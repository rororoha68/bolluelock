<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>볼루록 갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14121b;
    --bg-glow-1:#3a2f57;
    --bg-glow-2:#1c1830;
    --panel:#1f1b2e;
    --panel-border:#312b47;
    --text:#f5f1fa;
    --text-muted:#948da8;
    --accent:#ff6f91;
    --accent-2:#5eead4;
    --danger:#ff9e6d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  /* Safety net: nothing should ever cause page-wide horizontal scroll, regardless of language
     or how long a translated string turns out to be. Individual elements that need horizontal
     scrolling opt back in with their own overflow-x on themselves. */
  html{ overflow-x:hidden; }
  body{
    margin:0;
    overflow-x:hidden;
    max-width:100vw;
    background:
      radial-gradient(60% 55% at 50% 18%, var(--bg-glow-1) 0%, transparent 70%),
      radial-gradient(80% 60% at 50% 100%, var(--bg-glow-2) 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    /* Readability: keep-all avoids breaking in the middle of a Korean word/particle cluster,
       and overflow-wrap still allows a hard break for anything (like a long URL) that has no
       natural break point, so lines wrap at more natural points across all supported languages. */
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  h1,h2{ font-family:'Baloo 2', 'Inter', sans-serif; margin:0; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .app{ display:flex; flex-direction:column; min-height:100vh; }

  .topbar{
    display:flex; align-items:center; gap:20px;
    padding:16px 24px;
    border-bottom:1px solid var(--panel-border);
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:auto; cursor:pointer; background:none; border:none; padding:0; min-width:0; }
  .brand h1{ overflow-wrap:break-word; }
  .brand-mark{
    width:28px; height:28px; border-radius:50%;
    background:conic-gradient(from 200deg, var(--accent), var(--accent-2), var(--accent));
    display:inline-block; flex:0 0 auto;
  }
  .brand h1{ font-size:20px; font-weight:600; letter-spacing:0.2px; color:var(--text); }
  .hint-toggle{ font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .hint-toggle input{ accent-color: var(--accent); }

  .topbar-actions{
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
    min-width:0;
    max-width:100%;
    /* Always claim the full row beneath the brand, instead of only doing so when a language's
       labels happen to be long enough to force a wrap, so every language wraps the same way and
       stays pinned to the right via justify-content:flex-end above. */
    flex:1 1 100%;
  }
  /* Explicit two-row split — language+patch-notes on the first row, the two hint/effect
     checkboxes on the second — rather than leaving it to incidental flex-wrap, so the grouping
     stays the same at every viewport width and every language. */
  .topbar-actions-row{
    display:flex; align-items:center; gap:10px 16px;
    /* Long translations (Japanese/Chinese) can push a row wider than the viewport on mobile and
       drag the whole page into horizontal scroll. Letting it wrap, and letting each item
       shrink/wrap its own text instead of forcing one line, keeps every language contained. */
    flex-wrap:wrap;
    justify-content:flex-end;
    min-width:0;
    max-width:100%;
  }
  @media (max-width:600px){
    /* Within each row the items would still wrap differently per language based on label width.
       Stacking one item per row removes label width from the equation entirely: every language
       gets the same rows, right-aligned. */
    .topbar-actions-row{ flex-direction:column; align-items:flex-end; gap:10px; }
  }
  .lang-select{
    background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    font-size:13px; padding:6px 10px; border-radius:999px; cursor:pointer;
  }
  .lang-select:hover{ border-color:var(--accent-2); }
  .patch-btn{
    position:relative; background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    font-size:13px; padding:7px 14px; border-radius:999px; cursor:pointer; transition:border-color .15s ease;
  }
  .patch-btn:hover{ border-color:var(--accent-2); }
  .patch-btn .patch-dot{
    position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
    background:var(--accent); display:none; box-shadow:0 0 0 2px var(--bg);
  }
  .patch-btn.has-new .patch-dot{ display:block; }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(10,8,16,0.6); backdrop-filter:blur(2px);
    z-index:50; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-panel{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
    width:100%; max-width:480px; max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; border-bottom:1px solid var(--panel-border);
  }
  .modal-header h2{ font-size:16px; font-weight:600; }
  .modal-close{
    background:none; border:none; color:var(--text-muted); font-size:18px; line-height:1; cursor:pointer; padding:4px;
  }
  .modal-close:hover{ color:var(--text); }
  .modal-body{ padding:18px 20px; overflow-y:auto; }
  .patch-entry{ padding:14px 0; border-top:1px solid var(--panel-border); }
  .patch-entry:first-child{ border-top:none; padding-top:0; }
  .patch-entry-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .patch-version{ font-weight:600; font-size:14px; color:var(--accent-2); }
  .patch-date{ font-size:12px; color:var(--text-muted); }
  .patch-changes{ margin:0; padding-left:18px; font-size:13px; color:var(--text); line-height:1.7; }
  .patch-empty{ color:var(--text-muted); font-size:13px; text-align:center; padding:20px 0; }

  /* "Coming soon" teaser image — a deliberately cropped peek shown inside the info modal, see
     showComingSoonModal(). object-fit:cover + a per-character object-position (teaserFocus)
     does the actual cropping: the frame only shows a slice of the full image, not the whole
     thing, so it reads as a sneak peek rather than a normal thumbnail. */
  .teaser-hint{
    font-size:13px; font-weight:600; color:var(--accent-2); text-align:center;
    margin:14px 0 0;
  }
  .teaser-wrap{
    margin-top:10px; border-radius:14px; overflow:hidden; position:relative;
    aspect-ratio:16/10; background:#141019;
    border:1px solid var(--panel-border);
    box-shadow:0 0 0 3px rgba(94,234,212,0.12);
  }
  .teaser-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .teaser-wrap::after{
    /* Soft vignette around the edges so the crop reads as a deliberate "peek through a window"
       rather than a plain cropped photo. */
    content:''; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 34px 8px rgba(10,8,16,0.55);
  }

  .char-tabs{
    display:none; padding:12px 24px; gap:10px;
    border-bottom:1px solid var(--panel-border);
    /* Centered within the same max-width as the gallery/content below it, instead of flush
       against the full browser width — on wide desktop screens that left it bunched up against
       the left edge with a big empty gap on the right, looking lopsided. */
    max-width:1100px; margin:0 auto; width:100%; justify-content:center;
  }
  .char-tabs.show{ display:flex; }
  .studio-nav-btn{
    flex:0 0 auto;
    background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    padding:8px 16px; border-radius:999px; font-size:14px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .studio-nav-btn:hover{ border-color:var(--accent-2); }
  .studio-nav-btn.active{ border-color:var(--accent); color:var(--accent); }
  /* "BETA" marker. Uppercase Latin in every language on purpose — it reads as a status tag
     rather than a translated word, so it stays identical across ko/en/ja/zh. */
  .beta-badge{
    display:inline-block; vertical-align:middle;
    margin-left:6px; padding:2px 7px; border-radius:999px;
    background:rgba(94,234,212,0.14); border:1px solid var(--accent-2); color:var(--accent-2);
    font-family:'Inter', system-ui, sans-serif;
    font-size:10px; font-weight:700; letter-spacing:.06em; line-height:1.4;
    text-transform:uppercase; white-space:nowrap;
  }
  .studio-nav-btn .beta-badge{ font-size:9.5px; padding:1px 6px; }
  /* The studio button's label and its badge must stay on one line together even when a
     translated label is long, hence the inline-flex wrapper rather than plain inline text. */
  .studio-nav-btn{ display:inline-flex; align-items:center; }
  .beta-notice-list{ margin:12px 0 0; padding-left:20px; }
  .beta-notice-list li{ margin-bottom:8px; }
  .beta-notice-list li:last-child{ margin-bottom:0; }
  .char-select{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    padding:8px 32px 8px 14px;
    border-radius:999px;
    font-size:14px;
    cursor:pointer;
    max-width:100%;
    transition:border-color .15s ease, color .15s ease;
  }
  .char-select:hover{ border-color:var(--accent-2); }
  .char-select option{ background:var(--panel); color:var(--text); }
  .char-select option.grid-option{ color:var(--accent-2); }

  /* Skin / motion pickers in the dock — same pill-dropdown language as char-select, but full
     width since they sit stacked in a narrow side panel rather than a centered top bar. */
  .anim-select{
    display:block; width:100%;
    background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    padding:8px 32px 8px 14px; border-radius:999px; font-size:13px; cursor:pointer;
    transition:border-color .15s ease;
  }
  .anim-select:hover{ border-color:var(--accent-2); }
  .anim-select option{ background:var(--panel); color:var(--text); }

  /* Gallery */
  .gallery{ flex:1; padding:36px 24px 48px; max-width:1100px; margin:0 auto; width:100%; }
  .gallery-heading{ margin-bottom:22px; }
  .gallery-heading p{ color:var(--text-muted); font-size:14px; margin:6px 0 0; }
  .gallery-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:16px;
  }
  .gallery-card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;
    padding:14px; text-align:center; cursor:pointer; color:var(--text);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .gallery-card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .gallery-card{ position:relative; }
  .gallery-card.coming-soon{ opacity:0.55; }
  .gallery-card.coming-soon:hover{ transform:none; border-color:var(--panel-border); }
  .coming-soon-badge{
    position:absolute; top:8px; right:8px; background:rgba(10,8,16,0.75); color:var(--text);
    font-size:10.5px; padding:3px 8px; border-radius:999px; border:1px solid var(--panel-border);
  }
  .gallery-thumb{
    width:96px; height:96px; border-radius:50%; object-fit:cover;
    background:#141019; border:1px solid var(--panel-border);
  }
  .gallery-thumb-fallback{
    width:96px; height:96px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-size:34px; font-weight:600; color:#14121b;
  }
  .gallery-card-name{ font-size:14px; font-weight:500; }
  .gallery-empty{
    color:var(--text-muted); font-size:14px; line-height:1.7;
    background:var(--panel); border:1px dashed var(--panel-border); border-radius:14px; padding:28px;
  }
  .gallery-empty code{ background:#141019; padding:2px 6px; border-radius:6px; font-size:13px; }

  /* Viewer */
  .viewer{ display:none; flex:1; min-height:0; }
  .viewer.show{ display:flex; }
  @media (max-width:860px){
    .viewer.show{ flex-direction:column; }
  }

  .stage-wrap{
    position:relative; flex:1; min-height:420px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  /* NOTE: this rule must stay AFTER the base .stage-wrap rule above — both selectors have equal
     specificity, so whichever comes later in the stylesheet wins for properties they both set
     (flex, min-height), regardless of the media query. Previously this block sat BEFORE the base
     rule, so the base rule's flex:1;min-height:420px silently overrode it on every phone and the
     aspect-ratio below never actually took effect.
     On narrow screens the stage used to be flex:1 with only a min-height:420px floor. When the
     dock's stacked controls (single column on mobile) ran taller than the viewport, flex-grow
     had no room left and the stage got squeezed down to that 420px floor regardless of the
     device's actual width — since phone widths cluster around 360-430px, that floor produced a
     near-square box on every phone instead of a consistent, intentional shape. Switching to an
     aspect-ratio (and letting the page scroll if the dock needs more room below) keeps the
     stage's proportions tied to its own width instead of to leftover flex space.
     --stage-ratio defaults to 3/4 (no background picked yet) but is overwritten in JS with the
     uploaded background image's own natural width/height the moment one is set, so the stage
     takes the shape of whatever photo was actually uploaded instead of a single hardcoded ratio.
  */
  @media (max-width:860px){
    .stage-wrap{ flex:none; width:100%; min-height:0; aspect-ratio:var(--stage-ratio, 3/4); }
  }
  #stage{ width:100%; height:100%; display:block; touch-action:none; position:relative; z-index:1; }
  /* Dedicated layer behind the canvas for the studio background image, kept separate from the
     stage-wrap element itself so the background can be scaled (zoom in/out) with a CSS transform
     without that transform also affecting the canvas. background-size:auto deliberately shows the
     image at its own native pixel size instead of cropping/stretching it to cover the stage —
     the zoom slider (studioBgZoom) and the drag-to-pan behavior are how the user fits it instead. */
  .studio-bg-layer{
    position:absolute; inset:0; z-index:0;
    background-size:auto; background-position:center; background-repeat:no-repeat;
    transform-origin:center center;
    pointer-events:none;
  }
  .stage-back-btn{
    position:absolute; top:16px; left:16px; z-index:5;
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    font-size:13px; padding:7px 14px 7px 12px; border-radius:999px; cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .stage-back-btn:hover{ border-color:var(--accent); transform:translateX(-2px); }
  .stage-back-btn svg{ width:14px; height:14px; flex:0 0 auto; }
  /* z-index:4 — same reasoning as .hint-layer/.effect-layer above: without an explicit z-index
     this defaults to auto/0 and sits behind #stage's canvas (z-index:1), so the toast (e.g. the
     "PNG saved" confirmation) could end up hidden behind a tall character instead of floating
     on top of everything else in the stage. */
  .stage-toast{
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--panel); border:1px solid var(--panel-border);
    padding:8px 16px; border-radius:8px; font-size:13px; color:var(--text);
    opacity:0; transition:opacity .2s ease, transform .2s ease; pointer-events:none;
    z-index:4;
  }
  .stage-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* z-index:2 — must paint above #stage's canvas (z-index:1). Both are absolutely-positioned
     siblings, so without an explicit z-index here the layer would default to auto/0 and the
     canvas's explicit z-index:1 would win regardless of DOM order, leaving every hint dot stuck
     behind the character instead of pointing at the interactive bone on top of it. */
  .hint-layer{ position:absolute; inset:0; pointer-events:none; display:none; z-index:2; }
  /* z-index:3 — must paint above #stage's canvas (z-index:1) and the hint layer (z-index:2), same
     reasoning as .hint-layer above. Without this, star particles default to z-index:auto/0 and
     render behind the canvas even though they come later in the DOM. */
  .effect-layer{ position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:3; }
  .star-particle{
    position:absolute; top:0; left:0; font-size:34px; color:#ffd166;
    text-shadow:0 0 8px rgba(255,209,102,0.85);
    transform:translate(-50%,-50%); will-change:transform, opacity;
    animation: starBurst .6s ease-out forwards;
  }
  @keyframes starBurst{
    0%{ transform:translate(-50%,-50%) scale(0.3) rotate(0deg); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity:0; }
  }
  /* Heart particles for the "pet" hold-drag (spawnHeartBurst) — a gentle upward drift instead of
     starBurst's outward pop, since these spawn repeatedly while the pointer is held/dragged
     rather than once per tap, and an outward burst repeated every few hundred ms reads as
     chaotic where a soft rise reads as continuous affection. */
  .heart-particle{
    position:absolute; top:0; left:0; font-size:28px; color:var(--accent);
    text-shadow:0 0 8px rgba(255,111,145,0.85);
    transform:translate(-50%,-50%); will-change:transform, opacity;
    animation: heartFloat .9s ease-out forwards;
  }
  @keyframes heartFloat{
    0%{ transform:translate(-50%,-50%) translateY(0) scale(0.5); opacity:0.9; }
    20%{ transform:translate(calc(-50% + var(--dx)), -50%) translateY(-6px) scale(1); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), -50%) translateY(var(--dy)) scale(0.85); opacity:0; }
  }
  .hint-dot{ position:absolute; top:0; left:0; width:34px; height:34px; border-radius:50%; pointer-events:none; }
  .hint-dot.pat{ background:radial-gradient(circle, rgba(255,111,145,0.55) 0%, rgba(255,111,145,0) 70%); }
  .hint-dot.pull{ background:radial-gradient(circle, rgba(94,234,212,0.55) 0%, rgba(94,234,212,0) 70%); }
  @media (prefers-reduced-motion: no-preference){ .hint-dot{ animation:hintPulse 1.6s ease-in-out infinite; } }
  @keyframes hintPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  .dock{ width:340px; flex:0 0 auto; border-left:1px solid var(--panel-border); background:rgba(31,27,46,0.5); overflow-y:auto; }
  @media (max-width:860px){ .dock{ width:100%; border-left:none; border-top:1px solid var(--panel-border); } }
  .dock-panel{ padding:20px 22px; border-top:1px solid var(--panel-border); }
  .dock-panel:first-child{ border-top:none; }
  .dock-panel h2{ font-size:15px; font-weight:600; margin-bottom:10px; }
  .dock-desc{ font-size:12.5px; color:var(--text-muted); line-height:1.5; margin:0 0 12px; }
  #charDescription{ white-space:pre-line; }

  .anim-controls{ display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12.5px; color:var(--text-muted); margin-bottom:12px; }
  .anim-controls label{ display:flex; align-items:center; gap:6px; }
  .anim-controls input[type=range]{ accent-color:var(--accent-2); width:90px; }
  .anim-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .anim-btn{ background:#141019; border:1px solid var(--panel-border); color:var(--text); padding:7px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; }
  .anim-btn:hover{ border-color:var(--accent-2); }
  .anim-btn.active{ border-color:var(--accent-2); color:var(--accent-2); }

  .bone-list{ list-style:none; padding:0; margin:0 0 10px; display:flex; flex-direction:column; gap:6px; }
  .bone-list li{ font-size:13px; color:var(--text); background:#141019; border:1px solid var(--panel-border); border-radius:8px; padding:8px 10px; }

  /* Studio slot cards — one per placed character, each with its own motion picker + remove. */
  .studio-slot-list{ list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:10px; }
  .studio-slot{ background:#141019; border:1px solid var(--panel-border); border-radius:10px; padding:12px; }
  .studio-slot-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .studio-slot-name{ font-size:13.5px; font-weight:600; color:var(--text); overflow-wrap:break-word; }
  .studio-slot-skin{ font-size:12px; color:var(--text-muted); }
  .studio-slot-remove{ flex:0 0 auto; background:none; border:1px solid var(--panel-border); color:var(--text-muted); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:13px; line-height:1; }
  .studio-slot-remove:hover{ border-color:var(--danger); color:var(--danger); }
  .studio-slot-loading{ font-size:12px; color:var(--text-muted); }
  .studio-slot-sliders{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .studio-slot-sliders label{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted); }
  .studio-slot-sliders input[type="range"]{ flex:1; min-width:0; }
  .studio-bg-controls{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .studio-bg-controls input[type="file"]{ display:none; }
  .studio-bg-clear{ background:none; border:1px solid var(--panel-border); color:var(--text-muted); border-radius:999px; padding:7px 12px; font-size:12.5px; cursor:pointer; }
  .studio-bg-clear:hover{ border-color:var(--danger); color:var(--danger); }
  .studio-bg-zoom-row{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-muted); margin:10px 0 0; }
  .studio-bg-zoom-row input[type="range"]{ flex:1; min-width:0; accent-color:var(--accent-2); }
  .studio-panel-head{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .studio-panel-head h2{ margin-bottom:0; }
  .studio-panel-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  /* Layer-order controls (bring forward / send backward one step in the studio's draw order). */
  .studio-slot-layer-btn{ flex:0 0 auto; background:none; border:1px solid var(--panel-border); color:var(--text-muted); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:12px; line-height:1; }
  .studio-slot-layer-btn:hover:not(:disabled){ border-color:var(--accent-2); color:var(--accent-2); }
  .studio-slot-layer-btn:disabled{ opacity:0.35; cursor:default; }

  .site-footer{
    padding:14px 24px 20px; border-top:1px solid var(--panel-border);
    font-size:11.5px; line-height:1.6; color:var(--text-muted); text-align:center;
  }
  .creator-credit{ margin-top:10px; font-size:12.5px; }
  .creator-credit a{ color:var(--accent-2); text-decoration:none; }
  .creator-credit a:hover{ text-decoration:underline; }

  .source-links{ margin-top:12px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .source-link{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    font-size:12px; padding:6px 12px; border-radius:999px; text-decoration:none;
    transition:border-color .15s ease, color .15s ease;
  }
  .source-link:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .source-link svg{ width:11px; height:11px; flex:0 0 auto; }

  /* Update-available banner: shown when a newer deploy is detected while the page is open. */
  .update-banner{
    position:fixed; top:0; left:50%; transform:translateX(-50%) translateY(-120%);
    z-index:60; margin-top:12px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
    background:var(--panel); border:1px solid var(--accent-2); border-radius:999px;
    padding:10px 12px 10px 18px; box-shadow:0 8px 24px rgba(0,0,0,0.35);
    transition:transform .3s ease, visibility 0s linear .3s;
    max-width:calc(100vw - 24px);
    /* visibility:hidden (not just the translateY) so no sliver of the banner's border can ever
       peek in at the top of the page before an update is actually pending. */
    visibility:hidden;
  }
  .update-banner.show{ transform:translateX(-50%) translateY(0); visibility:visible; transition:transform .3s ease; }
  .update-banner-text{ font-size:13px; color:var(--text); }
  .update-banner-btn{
    background:var(--accent-2); border:none; color:#0f1720; font-weight:600;
    font-size:12.5px; padding:7px 16px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .update-banner-btn:hover{ filter:brightness(1.08); }
  .update-banner-dismiss{
    background:none; border:none; color:var(--text-muted); font-size:16px; line-height:1;
    cursor:pointer; padding:4px; margin-left:-4px;
  }
  .update-banner-dismiss:hover{ color:var(--text); }
  @media (max-width:520px){
    .update-banner{ padding:9px 10px 9px 14px; }
    .update-banner-text{ font-size:12.5px; }
  }
</style>

(function(){

  const studioBgZoomSlider = document.getElementById('studioBgZoomSlider');
  const studioBgLayer = document.getElementById('studioBgLayer');

  const studioAddSlotBtn = document.getElementById('studioAddSlotBtn');

  const studioPickSkinSelect = document.getElementById('studioPickSkinSelect');

  const studioBetaClose = document.getElementById('studioBetaClose');
  const studioBetaConfirmBtn = document.getElementById('studioBetaConfirmBtn');
  const WELCOME_SEEN_KEY = 'chr-playroom-welcome-seen';
  const STUDIO_BETA_SEEN_KEY = 'chr-playroom-studio-beta-seen';
  const PATCH_NOTES_SEEN_KEY = 'chr-playroom-last-seen-patch';
  // When a newer patch version is spotted while the page is already open, its version string is
  // stashed here so that the *next* full page load (i.e. the refresh the banner is asking for)
  // knows to auto-open the patch notes modal once, instead of relying on the user to click the
  // patch notes button themselves.
  const UPDATE_PENDING_KEY = 'chr-playroom-update-pending-version';
  const UPDATE_CHECK_INTERVAL_MS = 60000; // how often to poll site-config.json for a newer version

  // Its patchNotes[0].version doubles as a lightweight "site version" so the update-banner logic
  // below (see startUpdateWatcher) can tell whether the deployed site has moved on since this tab
  // was opened, without needing a real build-id or service worker.
  let siteVersionAtLoad = undefined; // version string captured on the very first successful load
  let siteVersionLoaded = false;

  let gl = null, renderer = null, lastTime = 0;
  let manifestEntries = [];
  let loadedCharacters = new Map(); // id -> character object (single-character viewer)
  let activeId = null;
  let dragging = null;   // active cheek-pull drag (spring offset), or the pet hold-drag once a 'pat' gesture escalates past the tap threshold (dragging.isPet distinguishes the two — see spawnHeartBurst below)
  let gesture = null;    // active head pointer-down, still deciding tap vs drag
  let pinch = null;      // active two-finger pinch-zoom gesture (mobile)
  let panDrag = null;    // active background drag-to-pan gesture (starts only outside the character) — single-character viewer only; the studio uses bgDrag instead (see below)
  let slotDrag = null;   // active studio-only drag that repositions a whole placed character (grabbed on its body, not an interactive bone)
  let bgDrag = null;     // active studio-only drag that repositions the background image layer itself (starts outside every placed character), independent of the stage camera and every character's position
  let lastPetHeartAt = 0; // performance.now() of the last heart particle spawned by an active pet hold-drag — throttles spawnHeartBurst to a steady drip instead of one every single pointermove frame
  const activePointers = new Map(); // pointerId -> {x, y}, tracked to detect a second touch (pinch)
  // How long (ms) a reaction-triggered animation swap keeps a character's physics bones pinned
  // rigid — see the comment on animationStateData.defaultMix above for why this has to cover the
  // *whole* crossfade, not just one frame. 250ms mix + a small safety margin for a late/slow
  // frame right at the tail end of the mix to still land inside the pinned window.
  const REACTION_PIN_MS = 400;
  // Called from playReaction/startHoldReaction/stopHoldReaction, everywhere a track-0 animation
  // swap happens for this character. Stamps a wall-clock deadline instead of a one-shot boolean
  // flag so the render loop can keep physics pinned for the swap's entire crossfade window (see
  // isDragPinned in renderLoop) no matter how many frames that takes.
  function pinReactionPhysics(c){
    c.__reactionPinnedUntil = performance.now() + REACTION_PIN_MS;
  }
  // Scratch vectors reused every frame by the studio's "runaway bone" safety net below — see
  // that check, next to c.skeleton.updateWorldTransform() in renderLoop, for what it's for.
  const __runawayBoundsOffset = new spine.Vector2(), __runawayBoundsSize = new spine.Vector2();
  const ZOOM_MIN = 1, ZOOM_MAX = 4.5; // 1 = the default "fit to view" framing

  // --- Studio (multi-character stage) state ---
  // 'gallery' | 'viewer' | 'studio'. Kept separate from the gallery/viewer show/hide flags above
  // (which predate this feature) so the render loop, camera, and pointer handlers all have one
  // place to check which mode they're operating in.
  let mode = 'gallery';
  const STUDIO_MAX_SLOTS = 5;
  // Each slot: {id, entry, skinName, animName, char}. `char` is null until assets finish loading.
  // A slot is a full independent character instance (its own skeleton/animationState), never
  // shared with loadedCharacters above or with other slots — two slots can freely point at the
  // same entry.id and the same skinName; each gets its own instance (see addStudioSlot, which
  // re-stamps char.id to the slot's own id precisely so duplicates never collide).
  let studioSlots = [];
  let studioSlotSeq = 0;
  // Single shared camera for the whole stage (as opposed to the per-character zoom/pan/baseCamera
  // used in the single-character viewer) — this is what "무대 전체를 하나로 줌/팬" means.
  let studioCamera = {baseCamera:null, zoom:1, panX:0, panY:0};
  // A user-picked background image for the stage (data URL, kept in memory only — never uploaded
  // anywhere). Applied as a CSS background on studioBgLayer only while mode==='studio'; the
  // single-character viewer never shows it.
  let studioBackgroundURL = null;
  // Independent zoom for the background image itself (as opposed to studioCamera.zoom, which
  // zooms the Spine stage/characters). Applied as a CSS transform:scale on studioBgLayer so it
  // never affects the canvas's own "fit to view" framing.
  let studioBgZoom = 1;
  // Independent pan (in CSS px) for the background image itself, set by dragging the background
  // directly (see bgDrag above). Kept completely separate from studioCamera.panX/Y — dragging the
  // background must only move the background layer, never the stage camera or any placed
  // character.
  let studioBgPanX = 0, studioBgPanY = 0;

  const HEAD_PATTERN = /atama/i;
  const CHEEK_PATTERN = /cheek|볼|뺨/i;
  // Categories of *dedicated* reaction animations. Name your Spine animations so they contain
  // one of these keywords and the site will find and play them automatically (see README).
  const HIT_PATTERN = /hit|smack|콩콩|때리|두드/i;   // short tap/click on the head
  const PET_PATTERN = /pet|stroke|rub|쓰다듬|쓰담|문지르/i; // drag on the head — plays on loop while held, then its follow-up clip on release (see pointermove/startHoldReaction)
  const PULL_PATTERN = /pull|stretch|당기|늘리/i;    // drag on the cheek
  // A "follow-up" clip is the same keyword plus one of these suffixes, e.g. "hit" + "hit_after".
  // If no suffix match exists but two clips share the keyword, the second one is used as the follow-up.
  const FOLLOWUP_SUFFIX_PATTERN = /(after|end|out|후속|후)$|[^0-9]2$/i;
  const DRAG_THRESHOLD_PX = 10; // how far a pointer must move before a head touch counts as a drag, not a tap
  const PET_HEART_INTERVAL_MS = 350; // minimum gap between hearts spawned by an ongoing pet hold-drag (see spawnPetHeart)
  const PLACEHOLDER_COLORS = ['#ff6f91', '#5eead4', '#ffb454', '#9b8cff', '#7fd8ff'];
  const LANG_STORAGE_KEY = 'chr-playroom-lang';
  const SUPPORTED_LANGS = ['ko','en','ja','zh'];

  // UI-chrome translations. Author-supplied content (character name/description, skin
  // label/description, patch note text) is NOT auto-translated — there's no translation API
  // wired up, and machine-translating someone's flavor text tends to read badly anyway. Instead,
  // any of those fields can optionally be written as {"ko":"...","en":"...","ja":"...","zh":"..."}
  // in manifest.json / site-config.json and localize() below will pick the right one, falling
  // back to Korean (or whatever's available) if a language is missing.

  let currentLang = 'ko';
  try{
    const saved = localStorage.getItem(LANG_STORAGE_KEY);
    if (saved && SUPPORTED_LANGS.includes(saved)) currentLang = saved;
  } catch(e){}

  // Looks up a UI-chrome string for the current language, falling back to Korean if a key is
  // ever missing in another language's table (shouldn't happen, but keeps things from breaking).
  function t(key){
    const table = STRINGS[currentLang] || STRINGS.ko;
    return (key in table) ? table[key] : STRINGS.ko[key];
  }

  // For author-supplied content (character/skin name & description, patch note text): a plain
  // string is shown as-is in every language; an object like {ko, en, ja, zh} picks the current
  // language, falling back to Korean, then to whatever language *is* present.
  function localize(value){
    if (value == null) return '';
    if (typeof value === 'string') return value;
    if (typeof value === 'object'){
      if (value[currentLang]) return value[currentLang];
      if (value.ko) return value.ko;
      const firstKey = Object.keys(value)[0];
      return firstKey ? value[firstKey] : '';
    }
    return String(value);
  }

  // Fills in every static [data-i18n] / [data-i18n-html] element in the DOM. Called once on
  // startup and again whenever the language switcher changes.
  function applyStaticI18n(){
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml + 'Html'); });
    document.querySelectorAll('[data-i18n-attr-aria-label]').forEach(el=>{ el.setAttribute('aria-label', t(el.dataset.i18nAttrAriaLabel)); });
    // Korean's welcomeAutoTranslateNotice is intentionally '' (it's the site's original
    // language, so there's nothing to disclose) — collapse the element in that case instead
    // of showing an empty line.
    const autoTranslateNotice = document.getElementById('welcomeAutoTranslateNotice');
    if (autoTranslateNotice) autoTranslateNotice.style.display = t('welcomeAutoTranslateNotice') ? '' : 'none';
  }


  // Given the full list of animation names on a skeleton, find the primary reaction clip and
  // (optionally) its follow-up clip for one interaction category.
  function pickReactionAnims(names, pattern){
    const matches = names.filter(n=>pattern.test(n));
    if (matches.length === 0) return null;
    const suffixed = matches.filter(n=>FOLLOWUP_SUFFIX_PATTERN.test(n));
    const plain = matches.filter(n=>!FOLLOWUP_SUFFIX_PATTERN.test(n));
    const primary = plain[0] || matches[0];
    let followUp = suffixed.find(n=>n!==primary) || matches.find(n=>n!==primary) || null;
    return {primary, followUp};
  }

  function hashName(name){
    let h = 0;
    for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return h;
  }

  // site-config.json lives next to index.html and is meant to be hand-edited, same spirit as
  // characters/manifest.json — no code changes needed to update the creator credit or add a
  // new patch note entry, just edit the JSON and redeploy.
  async function loadSiteConfig(){
    let config = null;
    try{
      const res = await fetch('./site-config.json', {cache:'no-store'});
      if (!res.ok) throw new Error(`site-config.json responded with ${res.status}`);
      config = await res.json();
    } catch(e){
      console.warn('[site-config] failed to load site-config.json:', e.message, '— check that the file sits next to index.html (same folder), not inside characters/, and that it was actually included in the deploy.');
      config = null;
    }
    lastCreator = config && config.creator;
    renderCreatorCredit(lastCreator);
    const notes = Array.isArray(config && config.patchNotes) ? config.patchNotes : [];
    renderPatchNotes(notes);

    const latestVersion = notes[0] && notes[0].version;
    if (!siteVersionLoaded){
      // First load in this tab: remember the version we're on, and check whether a previous tab
      // (or a previous visit) had flagged this exact version as "pending" — meaning the user
      // refreshed specifically to get it. If so, this is that first post-update refresh, so pop
      // the patch notes open automatically instead of waiting for a click.
      siteVersionLoaded = true;
      siteVersionAtLoad = latestVersion;
      let pending = null;
      try{ pending = localStorage.getItem(UPDATE_PENDING_KEY); } catch(e){}
      if (pending && latestVersion && pending === latestVersion){
        try{ localStorage.removeItem(UPDATE_PENDING_KEY); } catch(e){}
        openPatchNotes();
      }
      startUpdateWatcher();
    }
  }

  // Polls site-config.json every UPDATE_CHECK_INTERVAL_MS for a newer patch version than the one
  // this tab loaded with. The site is fully static (no service worker / build hash), so "newer
  // deploy happened" is detected purely by the patch-notes version changing.
  function startUpdateWatcher(){
    const check = async ()=>{
      if (document.hidden) return; // skip while tab is backgrounded; visibilitychange re-checks on return
      let config = null;
      try{
        const res = await fetch('./site-config.json', {cache:'no-store'});
        if (!res.ok) return;
        config = await res.json();
      } catch(e){ return; }
      const notes = Array.isArray(config && config.patchNotes) ? config.patchNotes : [];
      const latestVersion = notes[0] && notes[0].version;
      if (latestVersion && siteVersionAtLoad && latestVersion !== siteVersionAtLoad){
        try{ localStorage.setItem(UPDATE_PENDING_KEY, latestVersion); } catch(e){}
        showUpdateBanner();
      }
    };
    setInterval(check, UPDATE_CHECK_INTERVAL_MS);
    document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) check(); });
  }

  function renderCreatorCredit(creator){
    creatorCredit.innerHTML = '';
    if (!creator || !creator.name) return;
    const name = localize(creator.name);
    const label = t('creatorPrefix')(name);
    if (creator.url){
      const a = document.createElement('a');
      a.href = creator.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      creatorCredit.appendChild(a);
    } else {
      creatorCredit.textContent = label;
    }
  }

  let lastCreator = null;
  let patchNotesData = [];
  // Accepts either a plain array of strings, or an object keyed by language (each an array of
  // strings) if the author wants to hand-write the changelog in more than one language.
  // Also reports whether the returned list is Korean text that hasn't been hand-translated for
  // the current language yet — that's the case renderPatchNotes() below auto-translates.
  function localizeChanges(changes){
    if (Array.isArray(changes)) return {list: changes, needsAutoTranslate: currentLang !== 'ko'};
    if (changes && typeof changes === 'object'){
      if (Array.isArray(changes[currentLang])) return {list: changes[currentLang], needsAutoTranslate: false};
      if (Array.isArray(changes.ko)) return {list: changes.ko, needsAutoTranslate: currentLang !== 'ko'};
      const firstKey = Object.keys(changes).find(k=>Array.isArray(changes[k]));
      return firstKey ? {list: changes[firstKey], needsAutoTranslate: false} : {list: [], needsAutoTranslate: false};
    }
    return {list: [], needsAutoTranslate: false};
  }

  // Free, no-key machine translation (MyMemory) for patch note lines the author only wrote in
  // Korean — not as good as a hand-written translation, but better than showing Korean to
  // visitors reading the site in another language. Results are cached per (text, language) so
  // switching languages back and forth doesn't re-request the same line, and any failure (rate
  // limit, offline, CORS hiccup) just falls back to the original Korean text.
  const LANG_TRANSLATE_CODE = { en:'en', ja:'ja', zh:'zh-CN' };
  const translationCache = new Map(); // key: `${lang}|${text}` -> Promise<string>
  function translateText(text, lang){
    const targetCode = LANG_TRANSLATE_CODE[lang];
    if (!text || !targetCode) return Promise.resolve(text);
    const key = lang + '|' + text;
    if (translationCache.has(key)) return translationCache.get(key);
    const promise = fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|${targetCode}`)
      .then(res=>res.json())
      .then(data=>{
        const translated = data && data.responseStatus === 200 && data.responseData && data.responseData.translatedText;
        return translated || text;
      })
      .catch(()=>text);
    translationCache.set(key, promise);
    return promise;
  }

  function renderPatchNotes(notes){
    patchNotesData = notes;
    patchNotesBody.innerHTML = '';
    if (notes.length === 0){
      const empty = document.createElement('div');
      empty.className = 'patch-empty';
      empty.textContent = t('patchEmpty');
      patchNotesBody.appendChild(empty);
    } else {
      const renderLang = currentLang; // captured so late-arriving translations can check for a language switch mid-flight
      notes.forEach(note=>{
        const entry = document.createElement('div');
        entry.className = 'patch-entry';
        const head = document.createElement('div');
        head.className = 'patch-entry-head';
        if (note.version){
          const v = document.createElement('span');
          v.className = 'patch-version';
          v.textContent = note.version.startsWith('v') || note.version.startsWith('V') ? note.version : `v${note.version}`;
          head.appendChild(v);
        }
        if (note.date){
          const d = document.createElement('span');
          d.className = 'patch-date';
          d.textContent = note.date;
          head.appendChild(d);
        }
        entry.appendChild(head);
        const resolved = localizeChanges(note.changes);
        const changes = resolved.list.length ? resolved.list : (note.change ? [localize(note.change)] : []);
        if (changes.length){
          const ul = document.createElement('ul');
          ul.className = 'patch-changes';
          changes.forEach(c=>{
            const li = document.createElement('li');
            li.textContent = c; // Korean shown immediately; swapped for the translation below if needed
            ul.appendChild(li);
            if (resolved.needsAutoTranslate){
              translateText(c, renderLang).then(translated=>{
                if (currentLang === renderLang && li.isConnected) li.textContent = translated;
              });
            }
          });
          entry.appendChild(ul);
        }
        patchNotesBody.appendChild(entry);
      });
    }
    updatePatchDot();
  }


  function updatePatchDot(){
    const latest = patchNotesData[0] && patchNotesData[0].version;
    const lastSeen = localStorage.getItem(PATCH_NOTES_SEEN_KEY);
    patchNotesBtn.classList.toggle('has-new', !!latest && latest !== lastSeen);
  }

  function openPatchNotes(){
    patchNotesOverlay.classList.add('show');

  patchNotesBtn.addEventListener('click', openPatchNotes);

  patchNotesOverlay.addEventListener('click', (e)=>{ if (e.target === patchNotesOverlay) closePatchNotes(); });

  // Generic small info popup, currently used for the "coming soon" notice when a manifest entry
  // has no spine data yet (see isComingSoon below), but written generically in case it's useful
  // for other one-off notices later.
  function showInfoModal(title, message){
    infoModalTitle.textContent = title;
    infoModalBody.textContent = message;
    infoModalOverlay.classList.add('show');
  }

  // "Coming soon" notice for a manifest entry with no spine data yet (see isComingSoon below).
  // Same modal as showInfoModal, but built as real DOM instead of plain text so it can optionally
  // include a cropped "sneak peek" teaser image. A manifest entry can add:
  //   "teaserImage": "teaser.png"          — file inside the character's own folder, like thumbnail
  //   "teaserFocus": "50% 20%"             — optional CSS object-position; picks which part of the
  //                                          image shows through the (deliberately smaller) crop
  //                                          window, default "50% 30%"
  // No teaserImage on the entry -> falls back to the plain text-only notice, same as before.
  function showComingSoonModal(entry){
    infoModalTitle.textContent = t('comingSoonTitle');
    infoModalBody.innerHTML = '';
    const msg = document.createElement('p');
    msg.className = 'dock-desc';
    msg.style.margin = '0';
    msg.textContent = t('comingSoonMessage');
    infoModalBody.appendChild(msg);
    if (entry.teaserImage){
      const hint = document.createElement('p');
      hint.className = 'teaser-hint';
      hint.textContent = t('comingSoonTeaserHint');
      infoModalBody.appendChild(hint);
      const wrap = document.createElement('div');
      wrap.className = 'teaser-wrap';
      const img = document.createElement('img');
      img.src = joinPath(entry.folder, entry.teaserImage);
      img.alt = localize(entry.name) || entry.id;
      img.style.objectPosition = entry.teaserFocus || '50% 30%';
      // If the teaser file 404s or fails to decode, quietly drop back to the text-only notice
      // instead of leaving a broken-image icon in the modal.
      img.onerror = ()=>{ hint.remove(); wrap.remove(); };
      wrap.appendChild(img);
      infoModalBody.appendChild(wrap);
    }
    infoModalOverlay.classList.add('show');
  }
  function closeInfoModal(){ infoModalOverlay.classList.remove('show'); }
  infoModalClose.addEventListener('click', closeInfoModal);
  infoModalOverlay.addEventListener('click', (e)=>{ if (e.target === infoModalOverlay) closeInfoModal(); });
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && infoModalOverlay.classList.contains('show')) closeInfoModal(); });

  // One-time first-visit notice about the site's parody/genderbent nature. Deliberately has no
  // X button and doesn't close on backdrop click or Escape — it only closes via the explicit
  // confirm button, and is remembered in localStorage so it doesn't reappear on later visits.
  function showWelcomeModalIfNeeded(){
    let seen = null;
    try{ seen = localStorage.getItem(WELCOME_SEEN_KEY); } catch(e){}
    if (seen) return;
    welcomeOverlay.classList.add('show');

  function closeWelcomeModal(){
    welcomeOverlay.classList.remove('show');

  }
  welcomeConfirmBtn.addEventListener('click', closeWelcomeModal);

  // Heads-up shown the first time someone opens the studio, since it's a beta feature whose
  // stage contents deliberately don't persist. Remembered in localStorage so it only ever
  // interrupts once; if storage is unavailable (private mode, etc.) the notice simply shows
  // again next time rather than breaking the studio.
  function showStudioBetaNoticeIfNeeded(){
    let seen = null;
    try{ seen = localStorage.getItem(STUDIO_BETA_SEEN_KEY); } catch(e){}
    if (seen) return;
    // Never stack on top of the first-visit site notice — that one has to be confirmed first.
    if (welcomeOverlay.classList.contains('show')) return;
    studioBetaOverlay.classList.add('show');
    // Marked as seen on open rather than on close: the notice is dismissible in several ways
    // (X, backdrop, Escape), and every one of them counts as having read it.
    try{ localStorage.setItem(STUDIO_BETA_SEEN_KEY, '1'); } catch(e){}
  }
  function closeStudioBetaNotice(){ studioBetaOverlay.classList.remove('show'); }
  studioBetaConfirmBtn.addEventListener('click', closeStudioBetaNotice);
  studioBetaClose.addEventListener('click', closeStudioBetaNotice);
  studioBetaOverlay.addEventListener('click', (e)=>{ if (e.target === studioBetaOverlay) closeStudioBetaNotice(); });
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && studioBetaOverlay.classList.contains('show')) closeStudioBetaNotice(); });

  // A manifest entry with no skeleton/atlas file (or an explicit "comingSoon": true flag) is
  // treated as a placeholder: it still shows up in the gallery/tabs so 로하 can announce it
  // ahead of time, but clicking it pops up a notice instead of trying (and failing) to load it.
  function isComingSoon(entry){
    return !!entry.comingSoon || !entry.skeletonFile || !entry.atlasFile;
  }

  langSelect.value = currentLang;
  langSelect.addEventListener('change', ()=>{
    currentLang = SUPPORTED_LANGS.includes(langSelect.value) ? langSelect.value : 'ko';

  async function loadManifest(){

  function renderGallery(){

    manifestEntries.forEach(entry=>{
      const card = document.createElement('button');
      card.type = 'button';
      const comingSoon = isComingSoon(entry);
      card.className = 'gallery-card' + (comingSoon ? ' coming-soon' : '');
      card.addEventListener('click', ()=>{
        if (comingSoon){ showComingSoonModal(entry); return; }
        openCharacter(entry);
      });
      const displayName = localize(entry.name) || entry.id;

      if (entry.thumbnail){
        const img = document.createElement('img');
        img.className = 'gallery-thumb';
        img.src = joinPath(entry.folder, entry.thumbnail);
        img.alt = displayName;
        img.onerror = ()=>{ img.replaceWith(makeFallbackThumb(displayName)); };
        card.appendChild(img);
      } else {
        card.appendChild(makeFallbackThumb(displayName));
      }
      if (comingSoon){
        const badge = document.createElement('div');
        badge.className = 'coming-soon-badge';
        badge.textContent = t('comingSoonTitle');
        card.appendChild(badge);
      }
      const label = document.createElement('div');
      label.className = 'gallery-card-name';
      label.textContent = displayName;
      card.appendChild(label);
      galleryGrid.appendChild(card);
    });
  }

  function makeFallbackThumb(name){
    const div = document.createElement('div');
    div.className = 'gallery-thumb-fallback';
    div.style.background = PLACEHOLDER_COLORS[hashName(name) % PLACEHOLDER_COLORS.length];
    div.textContent = (name || '?').trim().charAt(0).toUpperCase();

  }

  function joinPath(folder, file){
    return folder.replace(/\/$/, '') + '/' + file;
  }

  const GRID_OPTION_VALUE = '__grid__';

  function renderTabs(){
    charSelect.innerHTML = '';
    // Toggle visibility here (rather than only in showGallery/showViewer) so the dropdown is
    // correctly shown as soon as the manifest first loads too, not just after the user has
    // already navigated once — otherwise it stayed hidden on the very first screen.
    charTabs.classList.toggle('show', manifestEntries.length > 0);
    if (manifestEntries.length === 0) return;

      charSelect.appendChild(opt);

  charSelect.addEventListener('change', ()=>{
    const val = charSelect.value;
    if (val === GRID_OPTION_VALUE){ showGallery(); return; }
    const entry = manifestEntries.find(e=>e.id === val);
    if (!entry) return;
    if (isComingSoon(entry)){
      showComingSoonModal(entry);
      // Not navigating there — snap the dropdown back to whatever was actually active instead of
      // leaving it parked on a selection that never took effect.
      charSelect.value = activeId || GRID_OPTION_VALUE;

    }

  });

  brandBtn.addEventListener('click', showGallery);
  stageBackBtn.addEventListener('click', showGallery);
  studioNavBtn.addEventListener('click', showStudio);

  // Shows/hides the single-character dock panels vs. the studio slot panel. They share the same
  // <aside class="dock"> and the same stage canvas — only this and `mode` decide what's active.
  function setDockMode(m){
    const studioMode = m === 'studio';
    infoPanel.style.display = studioMode ? 'none' : '';
    if (studioMode) skinPanel.style.display = 'none'; // restored by renderSkinList() when back in viewer mode
    animPanel.style.display = studioMode ? 'none' : '';
    interactionPanel.style.display = studioMode ? 'none' : '';
    studioPanel.style.display = studioMode ? '' : 'none';
    studioNavBtn.classList.toggle('active', studioMode);
  }

  function showGallery(){
    galleryView.style.display = 'block';
    viewerView.classList.remove('show');
    charTabs.classList.toggle('show', manifestEntries.length > 0);
    activeId = null;
    mode = 'gallery';
    studioNavBtn.classList.remove('active');
    applyStudioBackground();
    renderTabs();
  }

  function showViewer(){
    galleryView.style.display = 'none';
    viewerView.classList.add('show');
    charTabs.classList.add('show');
    mode = 'viewer';
    setDockMode('viewer');
    applyStudioBackground();
    resizeCanvas();
  }

  // Enters the studio: same stage/canvas/dock as the single-character viewer, but with the
  // studio slot panel shown instead and the shared studioCamera driving the view instead of a
  // per-character one. Re-entering just re-renders whatever slots are already there — nothing is
  // reloaded (per the "no persistence needed" requirement, slots only ever exist in memory for
  // the current page load anyway).
  function showStudio(){
    galleryView.style.display = 'none';
    viewerView.classList.add('show');
    charTabs.classList.add('show');
    activeId = null;
    mode = 'studio';
    setDockMode('studio');
    applyStudioBackground();
    initGL();
    resizeCanvas();
    renderStudioSlots();
    showStudioBetaNoticeIfNeeded();
  }

  // Applies (or clears) the user-picked background image on the dedicated studioBgLayer div, and
  // its independent zoom level. Guarded by mode==='studio' at every call site rather than
  // unconditionally, since studioBgLayer sits inside the same stage-wrap the single-character
  // viewer uses — it must never carry the studio's background over when the person leaves the
  // studio.
  function applyStudioBackground(){
    studioBgLayer.style.backgroundImage = (mode === 'studio' && studioBackgroundURL) ? `url(${studioBackgroundURL})` : '';
    // Pan first, then scale, so the drag offset is in plain screen pixels regardless of zoom.
    studioBgLayer.style.transform = `translate(${studioBgPanX}px, ${studioBgPanY}px) scale(${studioBgZoom})`;
  }

  studioBgInput.addEventListener('change', ()=>{
    const file = studioBgInput.files && studioBgInput.files[0];
    studioBgInput.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      studioBackgroundURL = reader.result;
      studioBgPanX = 0; studioBgPanY = 0;
      // Insert the image whole, never cropped: the stage takes on the photo's own aspect ratio
      // (below) and the zoom is set to "contain" that same ratio, so the full picture always fits
      // inside the visible stage instead of being cut off by overflow:hidden at native pixel size.
      // Never upscale past the original resolution though — a photo smaller than the stage stays
      // at its own size (zoom capped at 1) rather than being blown up and going blurry.
      const probe = new Image();
      probe.onload = ()=>{
        // Let the mobile stage-wrap take the shape of this actual photo (see --stage-ratio in the
        // CSS) instead of the generic 3:4 fallback, then resize/measure after that reflow so the
        // fit-zoom below (and the WebGL canvas) line up with the now-correctly-shaped container,
        // not the stale one.
        stageWrap.style.setProperty('--stage-ratio', `${probe.naturalWidth} / ${probe.naturalHeight}`);
        resizeCanvas();
        // On mobile, changing --stage-ratio can require a layout reflow that isn't guaranteed to
        // be finished yet on the very next line — reading stageWrap.clientWidth/clientHeight here
        // could still see the box mid-reflow and get 0 back (e.g. before it's been given a real
        // height). `fitZoom || 1` then treated that "not measured yet" 0 as "the photo already
        // fits at 1:1 scale" instead of "unknown, don't trust this" — 1:1 (the photo's own native
        // pixel size, often 3000+ px wide on a phone photo) is many times larger than the actual
        // on-screen stage, which is exactly what showed up as the background rendering zoomed in
        // and cropped on mobile. Waiting a frame for the reflow to settle, and only trusting the
        // measurement when both dimensions come back as real positive numbers, fixes this at the
        // source instead of guessing at a fallback zoom.
        requestAnimationFrame(()=>{
          const w = stageWrap.clientWidth, h = stageWrap.clientHeight;
          const fitZoom = (w > 0 && h > 0)
            ? Math.min(w / probe.naturalWidth, h / probe.naturalHeight, 1)
            : 1;
          studioBgZoom = Math.max(parseFloat(studioBgZoomSlider.min) || 0.1, fitZoom || 1);
          studioBgZoomSlider.value = String(studioBgZoom);
          applyStudioBackground();
        });
      };
      probe.onerror = ()=>{
        studioBgZoom = 1;
        studioBgZoomSlider.value = '1';
        applyStudioBackground();
      };
      probe.src = studioBackgroundURL;
      applyStudioBackground();
    };
    reader.readAsDataURL(file);
  });


  studioBgClearBtn.addEventListener('click', ()=>{
    studioBackgroundURL = null;
    studioBgZoom = 1;
    studioBgZoomSlider.value = '1';
    studioBgPanX = 0; studioBgPanY = 0;
    stageWrap.style.removeProperty('--stage-ratio');
    resizeCanvas();
    applyStudioBackground();
  });

  studioBgZoomSlider.addEventListener('input', ()=>{
    studioBgZoom = parseFloat(studioBgZoomSlider.value) || 1;
    applyStudioBackground();
  });

  function initGL(){
    if (gl) return;
    // preserveDrawingBuffer:true is needed so the PNG export (studioExportBtn) can read back the
    // canvas contents via toDataURL/toBlob — without it the WebGL buffer is cleared right after
    // each frame is presented and a capture taken outside the render loop can come back blank.
    gl = canvas.getContext('webgl', {alpha:true, preserveDrawingBuffer:true}) || canvas.getContext('experimental-webgl', {alpha:true, preserveDrawingBuffer:true});
    if (!gl){ showToast(t('webglUnsupported')); return; }
    renderer = new spine.SceneRenderer(canvas, gl);
    window.addEventListener('resize', resizeCanvas);
    requestAnimationFrame(renderLoop);
  }

  function resizeCanvas(){
    if (!viewerView.classList.contains('show')) return;
    const dpr = window.devicePixelRatio || 1;
    const w = stageWrap.clientWidth, h = stageWrap.clientHeight;
    canvas.width = Math.max(1, Math.round(w*dpr));
    canvas.height = Math.max(1, Math.round(h*dpr));
    canvas.style.width = w+'px';
    canvas.style.height = h+'px';
    if (gl) gl.viewport(0,0,canvas.width, canvas.height);
    if (mode === 'studio') fitStudioCamera(); else fitCameraToActive();
  }

  function waitForAssets(am){
    return new Promise((resolve,reject)=>{
      (function check(){
        if (am.isLoadingComplete()){
          if (am.hasErrors()){
            const errs = am.getErrors ? am.getErrors() : null;
            const msg = errs ? Object.entries(errs).map(([k,v])=>`${k}: ${v}`).join(', ') : 'asset load error';
            reject(new Error(msg));
          }
          else resolve();
        } else requestAnimationFrame(check);
      })();
    });
  }

  // Loads a character's Spine assets and builds a fresh, fully self-contained character object
  // (its own skeleton/animationState/offsets/etc). Extracted out of openCharacter so both the
  // single-character viewer and the multi-character studio can create character instances the
  // same way — the studio needs independent instances even for the same character id (e.g. two
  // different skins standing side by side), so this never touches loadedCharacters/activeId
  // itself; callers decide where the result gets stored.
  async function loadCharacterInstance(entry){
    const displayName0 = localize(entry.name) || entry.id;
    const basePath = entry.folder.replace(/\/?$/, '/');
      const assetManager = new spine.AssetManager(gl, basePath);
      const isBinary = entry.skeletonFile.toLowerCase().endsWith('.skel');
      assetManager.loadTextureAtlas(entry.atlasFile);
      if (isBinary) assetManager.loadBinary(entry.skeletonFile);
      else assetManager.loadText(entry.skeletonFile);
      await waitForAssets(assetManager);

      const atlas = assetManager.get(entry.atlasFile);
      const atlasLoader = new spine.AtlasAttachmentLoader(atlas);
      let skeletonData;
      if (isBinary){
        const bytes = assetManager.get(entry.skeletonFile);
        const binary = new spine.SkeletonBinary(atlasLoader);
        skeletonData = binary.readSkeletonData(bytes);
      } else {
        const jsonText = assetManager.get(entry.skeletonFile);
        const json = new spine.SkeletonJson(atlasLoader);
        skeletonData = json.readSkeletonData(JSON.parse(jsonText));
      }

      const skeleton = new spine.Skeleton(skeletonData);
      skeleton.setupPose();

      // Skins: use manifest-provided metadata (name/label/description per skin) when given, else
      // fall back to whatever skins are baked into the Spine file itself, labelled by their own
      // name. Skins that don't actually exist on this skeleton are dropped with a console warning
      // rather than breaking the whole character.
      const availableSkinNames = skeletonData.skins.map(s=>s.name);
      let skinsMeta = [];
      if (Array.isArray(entry.skins) && entry.skins.length > 0){
        entry.skins.forEach(s=>{
          if (!s || !s.name) return;
          if (!availableSkinNames.includes(s.name)){
            console.warn(`[skin] "${s.name}" listed in manifest for ${entry.id} but not found on the skeleton — skipping.`);
            return;
          }
          skinsMeta.push({name:s.name, label:s.label || s.name, description: s.description || ''});
        });
      }
      if (skinsMeta.length === 0){
        skinsMeta = availableSkinNames.map(n=>({name:n, label:n, description:''}));
      }
      const defaultSkinName = (entry.defaultSkin && availableSkinNames.includes(entry.defaultSkin))
        ? entry.defaultSkin
        : (skinsMeta[0] ? skinsMeta[0].name : null);
      if (defaultSkinName){
        skeleton.setSkinByName(defaultSkinName);
        // Not every build of the Spine runtime exposes the same setup-pose method name (renamed
        // from setSlotsToSetupPose to setupPoseSlots as of 4.3) — feature-detect both rather than
        // assume. It isn't actually needed here anyway: this is a freshly constructed skeleton
        // with no skin set yet, and per Spine's own docs, setSkinByName() alone already attaches
        // every setup-pose-visible attachment from the new skin in that case.
        if (typeof skeleton.setupPoseSlots === 'function') skeleton.setupPoseSlots();
        else if (typeof skeleton.setSlotsToSetupPose === 'function') skeleton.setSlotsToSetupPose();
      }

      const animationStateData = new spine.AnimationStateData(skeletonData);
      animationStateData.defaultMix = 0.25; // crossfade between any two animations for smoother transitions
      // How long a track-0 animation swap (playReaction/startHoldReaction/stopHoldReaction) keeps
      // this character's physics-constraint bones pinned rigid — see REACTION_PIN_MS/pinReaction()
      // below for why a single frame isn't enough here: with defaultMix=0.25 above, "hit"/"pet"
      // don't replace idle's pose instantly, they crossfade into it over a quarter second. If
      // idle keeps keying a physics-driven bone's *parent* differently from the reaction clip
      // (this rig's idle sway does), every one of those ~15 blended frames moves that parent a
      // little further from where physics last expected it, and a spring reads each of those as
      // a fresh, large per-frame velocity — the divergence compounds across the whole crossfade
      // instead of happening once. A single Physics.reset on frame 1 (the old c.__justReacted
      // flag) caught only the first of those frames and left the rest of the mix free to blow the
      // spring out — exactly the still-broken behavior on video. Holding physics rigid for the
      // *entire* mix, the same way a manual body-drag is held rigid for its entire duration (see
      // c.__slotDragActive), is the fix: nothing physics-driven moves relative to its parent
      // while the pose itself is in motion, and normal jiggle resumes the instant the crossfade
      // (and this pin) ends.
      const animationState = new spine.AnimationState(animationStateData);
      const defaultAnim = entry.defaultAnimation && skeletonData.findAnimation(entry.defaultAnimation)
        ? entry.defaultAnimation
        : (skeletonData.animations[0] ? skeletonData.animations[0].name : null);
      if (defaultAnim) animationState.setAnimation(0, defaultAnim, true);

      // Apply the default animation once (not just the raw bind/setup pose) before measuring
      // anything, so bone world positions match what will actually be shown on screen — some
      // rigs only fully resolve IK/transform constraints once a real animation has been applied.
      animationState.update(0);
      animationState.apply(skeleton);
      skeleton.updateWorldTransform(spine.Physics.update);

      // --- DEBUG: transform-constraint self-test ---------------------------------------------
      // Logs whether the loaded runtime actually parsed the 4.3 "property-mapped" transform
      // constraints (atama/cheek -> head/face/backhead/hear), then does a live before/after test:
      // nudges 'atama' and 'cheek' by a large, obvious amount, re-runs updateWorldTransform, and
      // checks whether 'head'/'face'/'backhead'/'hear' actually moved. If they don't move here,
      // the runtime is not applying these constraints and the fix has to happen in this file's
      // own code (manual re-implementation) rather than by changing the spine-webgl version.
      try {
        // Log every constraint-ish array the live skeleton object actually exposes, since the
        // API surface for grouping constraints by type can differ between runtime builds (some
        // expose skeleton.transformConstraints, others only expose a single unified
        // skeleton.constraints list that mixes IK/transform/path/physics together).
        const candidateArrayNames = ['constraints','transformConstraints','ikConstraints','pathConstraints','physicsConstraints'];
        candidateArrayNames.forEach(n => {
          console.log('[debug][transform-constraint] skeleton.' + n, Array.isArray(skeleton[n]) ? ('array, length ' + skeleton[n].length) : skeleton[n]);
        });

        const watchNames = ['atama-to-head','atama-to-face','atama-to-backhead','atama-to-hear','cheek-to-head','cheek-to-face','cheek-to-backhead','cheek-to-hear'];
        // Pull from whichever array actually has entries, unified or not.
        const allConstraints = [].concat(
          Array.isArray(skeleton.constraints) ? skeleton.constraints : [],
          Array.isArray(skeleton.transformConstraints) ? skeleton.transformConstraints : []
        );
        const tcs = allConstraints.filter(c => c && c.data && watchNames.includes(c.data.name));
        console.log('[debug][transform-constraint] found', tcs.length, 'of', watchNames.length, 'expected constraints (searched', allConstraints.length, 'total constraint objects)');
        tcs.forEach(tc => {
          console.log('[debug][transform-constraint]', tc.data.name, {
            source: tc.source ? (tc.source.data ? tc.source.data.name : tc.source) : tc.data.source,
            bones: tc.bones && tc.bones.map(b => (b && b.bone && b.bone.data) ? b.bone.data.name : (b && b.data ? b.data.name : b)),
            properties: tc.data.properties,
            mixX: tc.mixX !== undefined ? tc.mixX : (tc.pose ? tc.pose.mixX : undefined)
          });
        });

        const atama = skeleton.findBone('atama');
        const cheek = skeleton.findBone('cheek');
        const head = skeleton.findBone('head');
        const face = skeleton.findBone('face');
        if (atama && head && face) {
          fixTransformConstraintMixes(skeleton); // apply the workaround before re-testing
          skeleton.updateWorldTransform(spine.Physics.reset);
          console.log('[debug][transform-constraint] after fixTransformConstraintMixes(), mixX values:',
            tcs.map(tc => ({name: tc.data.name, dataMixX: tc.data.mixX, liveMixX: tc.mixX})));
          const before = { head: boneWorldPos(head), face: boneWorldPos(face) };
          const atamaPose = bonePose(atama);
          const savedX = atamaPose.x, savedY = atamaPose.y;
          atamaPose.x += 200; atamaPose.y += 200; // big, obvious nudge
          // NOTE: this diagnostic nudge/restore pair used to run through spine.Physics.update,
          // which reads the huge instantaneous (200,200) jump — and the equally huge snap-back
          // right after — as two enormous single-frame velocities into every physics-constraint
          // spring descended from head/hear (fronthair/sidehair/mimi/backhair/mitsuami all chain
          // up through head — see the bone-parent dump in chat). That's exactly the same "huge
          // per-frame delta reads as huge velocity" failure mode already fixed for body-drag
          // (see isDragPinned/setPhysicsConstraintsMuted above), except this one fired at PAGE
          // LOAD, before the character even rendered once — corrupting each spring's internal
          // position/velocity bookkeeping so thoroughly that no amount of re-muting the transform
          // constraint afterward could undo it (muting only blocks new input; it can't repair
          // already-corrupted spring state). That's the actual explanation for "물리제약이 다
          // 죽어버렸어" persisting no matter how HEAD_FOLLOW_CONSTRAINT_NAMES was toggled — the
          // damage was already done here, once, at load, every single time. Fix: use
          // spine.Physics.reset for both calls instead. Transform/IK constraints (what this test
          // is actually checking) resolve identically either way; Physics.reset only changes how
          // PHYSICS constraints react, snapping their internal state silently to match the new
          // pose instead of reading the jump as velocity — so the test result is unaffected but
          // no spring ever sees a fake 200px/frame "impact".
          skeleton.updateWorldTransform(spine.Physics.reset);
          const after = { head: boneWorldPos(head), face: boneWorldPos(face) };
          // restore
          atamaPose.x = savedX; atamaPose.y = savedY;
          skeleton.updateWorldTransform(spine.Physics.reset);
          const moved = before.head && after.head && (Math.abs(after.head.x - before.head.x) > 0.01 || Math.abs(after.head.y - before.head.y) > 0.01);
          console.log('[debug][transform-constraint] TEST: moved atama by (200,200) ->', moved ? '✅ head/face MOVED (constraint is working)' : '❌ head/face DID NOT MOVE (constraint is NOT being applied by this runtime)', {before, after});
          // Diagnostic test above deliberately turned the native mix ON (via
          // fixTransformConstraintMixes) to prove the constraint is capable of moving bones at
          // all. muteHeadFollowConstraints() re-mutes only whichever constraint names are
          // currently listed in HEAD_FOLLOW_CONSTRAINT_NAMES (now empty — see chat history: all
          // 10 atama/cheek-to-* constraints are intentionally left live) — for anything not in
          // that list this is a no-op, which is correct: those should stay on from here on.
          muteHeadFollowConstraints(skeleton);
          skeleton.updateWorldTransform(spine.Physics.reset);
        } else {
          console.warn('[debug][transform-constraint] could not run live test — missing bone(s)', {atama:!!atama, cheek:!!cheek, head:!!head, face:!!face});
        }
      } catch (err) {
        console.error('[debug][transform-constraint] self-test threw', err);
      }
      // --- end DEBUG ---------------------------------------------------------------------------

      // --- DEBUG: physics-constraint self-test ------------------------------------------------
      // Separate from the transform-constraint test above — checks whether this build's
      // PhysicsConstraint (jiggle-bone spring) objects are actually found and actually move a
      // bone over a few ticks, independent of anything to do with atama/cheek follow constraints.
      try {
        const pcs = getPhysicsConstraints(skeleton);
        console.log('[debug][physics-constraint] found', pcs.length, 'physics constraints:',
          pcs.map(pc => ({
            name: pc.data && pc.data.name,
            ctor: pc.constructor && pc.constructor.name,
            mix: pc.mix !== undefined ? pc.mix : (pc.pose ? pc.pose.mix : undefined),
            dataMix: pc.data && pc.data.mix,
            hasBone: !!pc.bone, bonesLen: Array.isArray(pc.bones) ? pc.bones.length : 0
          }))
        );
        const testBone = skeleton.findBone('backhairSR2') || skeleton.findBone('mimiR2') || skeleton.findBone('fronthairM2');
        if (testBone) {
          const p0 = boneWorldPos(testBone);
          // Nudge the physics chain's shared ancestor a small, realistic amount (not a fake
          // 200px teleport) and step physics forward several real frames to see if the spring
          // actually reacts at all.
          const anchor = skeleton.findBone('backhead') || skeleton.findBone('head');
          const anchorPose = anchor && bonePose(anchor);
          const savedRot = anchorPose ? anchorPose.rotation : null;
          if (anchorPose) anchorPose.rotation += 15;
          for (let i=0;i<10;i++){
            animationState.update(1/30);
            // Same missing call as the main render loop (see renderLoop) — without this, the test
            // below would always report "DID NOT MOVE" even when physics is otherwise fine, since
            // the constraint never receives any delta to simulate with.
            skeleton.update(1/30);
            animationState.apply(skeleton);
            skeleton.updateWorldTransform(spine.Physics.update);
          }
          const p1 = boneWorldPos(testBone);
          if (anchorPose) anchorPose.rotation = savedRot;
          skeleton.updateWorldTransform(spine.Physics.reset);
          const pmoved = p0 && p1 && (Math.abs(p1.x-p0.x) > 0.01 || Math.abs(p1.y-p0.y) > 0.01);
          console.log('[debug][physics-constraint] TEST: rotated', anchor && anchor.data.name, 'by 15° for 10 frames, watched', testBone.data.name, '->',
            pmoved ? '✅ physics bone MOVED' : '❌ physics bone DID NOT MOVE', {before: p0, after: p1});
        } else {
          console.warn('[debug][physics-constraint] no watch bone found (backhairSR2/mimiR2/fronthairM2 all missing)');
        }
      } catch (err) {
        console.error('[debug][physics-constraint] self-test threw', err);
      }
      // --- end DEBUG ---------------------------------------------------------------------------

      // Pick a single best bone per interaction type instead of every substring match — Spine rigs
      // often have several bones whose name happens to contain "head" (a hair root like "head6",
      // rig control handles like "headcontrol"/"headcontrol2") that aren't the actual clickable part
      // and tend to sit off in a corner, which is exactly what was showing up as a stray hint dot.
      const CONTROL_BONE_PATTERN = /control|ctrl|handle|helper/i;
      const boneNames = skeletonData.bones.map(b=>b.name);
      function pickBestBoneMatch(pattern){
        // Prefer the bone that actually *positions the visible shape* for this feature — i.e. the
        // bone used by a slot whose own name also matches the pattern (e.g. a slot literally named
        // "head"). Rigs commonly split this into a small "control"/pivot bone plus a separate bone
        // the artist actually parented the head/face artwork to (here: bone 'head' is a minor detail
        // pivot, while the main head shape's slot is parented to bone 'atama') — a bone-name-only
        // heuristic like "shortest name wins" can't tell those apart and may grab the wrong one.
        const slotCandidates = skeletonData.slots
          .filter(s => pattern.test(s.name) && !CONTROL_BONE_PATTERN.test(s.name) && s.boneData && !CONTROL_BONE_PATTERN.test(s.boneData.name))
          .map(s => s.boneData.name);
        if (slotCandidates.length > 0){
          slotCandidates.sort((a,b)=> a.length - b.length);
          return slotCandidates[0];
        }
        // Fall back to matching on bone names directly when no slot name matches the pattern.
        const candidates = boneNames.filter(n => pattern.test(n) && !CONTROL_BONE_PATTERN.test(n));
        if (candidates.length === 0) return null;
        // Prefer the most literal match — "head" over "head6" over "headBackHair", etc.
        candidates.sort((a,b)=> a.length - b.length);
        return candidates[0];
      }

      // The bone picked above for hit-testing (e.g. 'atama') is often a small pivot with nothing
      // actually skinned to it — squashing it directly produces no visible motion at all. Walk up
      // the parent chain to the nearest ancestor that a slot is actually attached to (i.e. a bone
      // that moves real artwork — for this rig that's 'head'), and squash *that* one instead. The
      // tap/hint position still uses the original bone, so hit-testing itself is unaffected — only
      // the "띠용" squash target changes.
      const bonesWithSlots = new Set(skeletonData.slots.map(s => s.boneData.name));
      function resolveSquashBoneName(name){
        let b = skeletonData.bones.find(x => x.name === name) || null;
        while (b){
          if (bonesWithSlots.has(b.name)) return b.name;
          b = b.parent;
        }
        return name; // nothing found up the chain — fall back to the original bone
      }

      // Sample the character's bounding box across its idle loop (and let jiggle physics — long
      // back hair, tails, ears — settle into its natural sway), instead of trusting a single
      // static snapshot at time 0. A one-frame snapshot only captures wherever the animation and
      // physics happen to be sitting at that first instant, which is rarely as wide as the
      // character actually gets over a full loop — long back hair in particular keeps swaying
