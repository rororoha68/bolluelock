  // Small celebratory burst of star glyphs at a screen position, used for the head-pat "hit"
  // reaction. Purely a DOM/CSS overlay (like the hint dots) rather than anything drawn into the
  // Spine skeleton itself, so it works the same regardless of what animations a character does
  // or doesn't have. Gated on effectToggle so it can be turned off entirely.
  function spawnStarBurst(screenX, screenY){
    if (!effectToggle.checked) return;
    const count = 5 + Math.floor(Math.random()*4); // 5–8 stars, varies every hit
    for (let i=0;i<count;i++){
      // Angle drawn independently at random from an upward-facing 150° arc (screen space:
      // -90° is straight up), instead of an evenly-spaced ring — so stars only ever pop
      // upward/sideways-up, never downward, and no two hits look identical.
      const angleDeg = -90 + (Math.random()-0.5)*150;
      const angle = angleDeg * Math.PI/180;
      const dist = 55 + Math.random()*95;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;
      const el = document.createElement('span');
      el.className = 'star-particle';
      el.textContent = '★';
      el.style.left = screenX + 'px';
      el.style.top = screenY + 'px';
      el.style.setProperty('--dx', dx.toFixed(1) + 'px');
      el.style.setProperty('--dy', dy.toFixed(1) + 'px');
      el.style.setProperty('--rot', (Math.random()*180 - 90).toFixed(0) + 'deg');
      el.style.animationDelay = (Math.random()*0.05).toFixed(2) + 's';
      el.addEventListener('animationend', ()=>el.remove());
      effectLayer.appendChild(el);
    }
  }

  // Same idea as spawnStarBurst, for the "pet" hold-drag instead of the "hit" tap: 1–2 hearts
  // that drift gently upward and fade, rather than a big outward pop — see the .heart-particle/
  // heartFloat comment in <style> for why. Also gated on effectToggle, same as stars.
  function spawnHeartBurst(screenX, screenY){
    if (!effectToggle.checked) return;
    const count = 1 + Math.floor(Math.random()*2); // 1–2 hearts per spawn, since this fires repeatedly while held
    for (let i=0;i<count;i++){
      const dx = (Math.random()-0.5)*40;
      const dy = -(50 + Math.random()*40); // upward only
      const el = document.createElement('span');
      el.className = 'heart-particle';
      el.textContent = '♥';
      el.style.left = (screenX + (Math.random()-0.5)*20) + 'px';
      el.style.top = screenY + 'px';
      el.style.setProperty('--dx', dx.toFixed(1) + 'px');
      el.style.setProperty('--dy', dy.toFixed(1) + 'px');
      el.style.animationDelay = (Math.random()*0.05).toFixed(2) + 's';
      el.addEventListener('animationend', ()=>el.remove());
      effectLayer.appendChild(el);
    }
  }

  // Resolves boneName to a screen position and spawns a heart there — the same
  // canvas-vs-effectLayer offset correction playReaction's "hit" star-burst uses (see its
  // comment for why that offset is needed at all). Shared here so both the "pet just started"
  // and "still being pet-dragged" spawn points (see pointerdown/pointermove) stay in sync with
  // the actual bone position instead of drifting apart if only one of them got this fix.
  function spawnPetHeart(c, boneName){
    const bone = c && c.skeleton.findBone(boneName);
    const pos = bone && boneVisualCenter(c, bone);
    if (!pos) return;
    const screen = worldToScreenCSS(pos.x, pos.y);
    const canvasRect = canvas.getBoundingClientRect();
    const layerRect = effectLayer.getBoundingClientRect();
    const offsetX = canvasRect.left - layerRect.left;
    const offsetY = canvasRect.top - layerRect.top;
    spawnHeartBurst(screen.x + offsetX, screen.y + offsetY);
  }

  // Plays: dedicated reaction clip -> optional follow-up clip -> back to whatever was already
  // playing. Falls back to a quick procedural effect if the character has no dedicated clip yet
  // for this category (cheek/"pull" relies on the spring offset alone, so it has no fallback).
  function playReaction(c, boneName, category, starBoneName){
    if (category === 'hit'){
      // Stars should burst from the actual "atama" bone (the one the pat/tap hit-tests against),
      // not from squashName's resolved ancestor — that bone can sit lower on the rig (e.g. a
      // hair-root pivot vs the true head position), which made the burst spawn off-target.
      const bone = c.skeleton.findBone(starBoneName || boneName);
      const pos = boneVisualCenter(c, bone);
      if (pos){
        const screen = worldToScreenCSS(pos.x, pos.y);
        // worldToScreenCSS() returns a position relative to the *canvas's* own top-left corner,
        // but each star particle is positioned relative to effectLayer's top-left corner instead
        // (it's appended into #effectLayer, a separate inset:0 box over the stage). The two boxes
        // are meant to line up exactly, but — same as the hint dots in updateHints() — they can
        // drift apart by a few pixels depending on layout timing, which is what made the burst
        // spawn away from the atama bone instead of centered on it. Measuring the actual gap here
        // and folding it into the placement fixes that the same way it's already fixed for hints.
        const canvasRect = canvas.getBoundingClientRect();
        const layerRect = effectLayer.getBoundingClientRect();
        const offsetX = canvasRect.left - layerRect.left;
        const offsetY = canvasRect.top - layerRect.top;
        spawnStarBurst(screen.x + offsetX, screen.y + offsetY);
      }
    }
    // "hit" (head-tap) is meant to feel like repeated whacks: each new tap should cut off
    // whatever's currently playing (dedicated clip mid-flight, its follow-up, or the return-to-
    // rest tween) and restart the hit clip from frame 0, instead of being ignored until the
    // previous one finishes. Other categories (pet/pull) keep the old "ignore taps while busy"
    // behavior since they aren't meant to combo like this.
    if (c.reactionBusy && category !== 'hit') return;
    const reaction = c.reactions[category];
    // Use the character's tracked resting animation, not whatever happens to be on track 0
    // right now — see the comment on restingAnimation for why reading the live track is unsafe.
    const backTo = c.restingAnimation ? c.restingAnimation.name : (c.skeletonData.animations[0] ? c.skeletonData.animations[0].name : null);
    const wasLoop = c.restingAnimation ? c.restingAnimation.loop : true;

    if (reaction && reaction.primary){
      c.reactionBusy = true;
      // Same "teleport" problem as a manual body-drag (see c.__justRepositioned in
      // layoutStudioSlots / c.__slotDragActive in renderLoop), just triggered a different way, and
      // spread over longer than one frame: setAnimation() on track 0 crossfades this character's
      // pose from wherever idle happened to be into reaction.primary over defaultMix (0.25s), not
      // instantly. Idle keeps swaying the parents of this rig's physics-driven bones (tail root,
      // hair root, ...) the whole time, so every blended frame of that crossfade nudges them a
      // little further from where physics last expected them — a spring reads each nudge as a
      // fresh, large velocity, and the divergence compounds across the whole mix instead of
      // happening once. pinReactionPhysics() below holds physics rigid for that entire window
      // (see REACTION_PIN_MS) instead of just the first frame, so the reaction's pose change lands
      // cleanly instead of flinging jiggle bones out to the side (the runaway tail/hair on video
      // right after tapping an ear).
      pinReactionPhysics(c);
      c.animationState.setAnimation(0, reaction.primary, false);
      if (reaction.followUp){
        c.animationState.addAnimation(0, reaction.followUp, false, 0);
      }
      if (backTo){
        const backEntry = c.animationState.addAnimation(0, backTo, wasLoop, 0);
        // 'start' covers the normal case (this entry actually becomes current). But if something
        // else (e.g. grabbing the cheek) overrides track 0 before this entry ever gets to start,
        // 'start' never fires and reactionBusy would stay stuck true forever, silently freezing
        // every future head-tap. 'interrupt'/'dispose' catch that discard so it always resets.
        const clearBusy = ()=>{ c.reactionBusy = false; };
        backEntry.listener = { start: clearBusy, interrupt: clearBusy, dispose: clearBusy };
      } else {
        c.reactionBusy = false;
      }
    } else if (category !== 'pull'){
      const bone = c.skeleton.findBone(boneName);
      // If this bone already has a procedural effect running, reuse its captured base instead of
      // re-sampling the bone's *current* pose — mid-effect, that pose is already distorted (squashed/
      // rotated), so re-sampling it here would silently bake that distortion in as the new "original"
      // every time the bone is tapped again quickly. Since this rig's animations don't keyframe this
      // bone's rotation/scale, nothing else ever corrects that drift, so repeated taps would end up
      // never settling back to the true original pose. Reusing the same base keeps repeated taps
      // ("콩콩") additive-safe instead of compounding.
      const existing = c.patEffects.get(boneName);
      let baseRotation, baseScaleX, baseScaleY, baseShearX, baseShearY, baseX, baseY;
      if (existing){
        baseRotation = existing.baseRotation; baseScaleX = existing.baseScaleX; baseScaleY = existing.baseScaleY;
        baseShearX = existing.baseShearX; baseShearY = existing.baseShearY;
        baseX = existing.baseX; baseY = existing.baseY;
      } else {
        const basePose = bonePose(bone);
        baseRotation = basePose.rotation; baseScaleX = basePose.scaleX; baseScaleY = basePose.scaleY;
        baseShearX = basePose.shearX || 0; baseShearY = basePose.shearY || 0;
        baseX = basePose.x; baseY = basePose.y;
      }
      c.patEffects.set(boneName, {start: performance.now(), kind: category, baseRotation, baseScaleX, baseScaleY, baseShearX, baseShearY, baseX, baseY});
    }
    // category === 'pull' with no dedicated clip: the spring offset already provides the feel,
    // so there's nothing more to do.
  }

  // Manual, safe replacement for the native transform constraints (atama/cheek -> head/face/
  // backhead/hear). fixTransformConstraintMixes() above proved the *structure* parses fine but
  // the runtime's own math for this brand-new 4.3 constraint type is unstable once mix > 0 (it
  // blew the head up to several times its normal size instead of a subtle 10% nudge — confirmed
  // on video). So the native constraint is left alone at its broken mix:0 (harmless no-op) and
  // this instead reproduces just the intended visual — head/face/backhead/hear drifting a little
  // in the same direction as whichever bone (atama or cheek) is being dragged — entirely in local
  // bone-space offsets we control, with a fixed, safe strength.
  // atama (head pet) intentionally has no entry here anymore: pet has its own dedicated Spine
  // animation clip, so this manual follow was purely an extra on-screen nudge layered on top of
  // it — not something that exists in the editor. Removed so the pet reaction now matches the
  // editor's animation exactly. cheek keeps it: cheek "pull" has no dedicated clip, just the
  // spring offset, so face/backhead/hear following it is the only visual feedback it has.
  const FOLLOW_MAP = {};
  const FOLLOW_MIX_X = 0.035;
  // Vertical follow kept separate and clamped: dragging atama upward was lifting 'head' enough
  // to visibly expose a gap at the neck, since head's own art doesn't stretch to cover it. A
  // much weaker mix plus a hard cap keeps the wobble readable without ever pulling head far
  // enough off the body to look disconnected.
  const FOLLOW_MIX_Y = 0.001;
  const FOLLOW_MAX_Y = 0.001;
  function applyManualFollow(c, sourceName, off){
    const targets = FOLLOW_MAP[sourceName];
    if (!targets) return;
    // off.x/off.y are already in the DRAGGED bone's local (parent-relative) frame — see the
    // pointermove handler that builds `off` via boneWorldMatrix(bone.parent). Follow targets
    // (face/backhead/hear) share that same parent, so the numbers are valid to reuse directly...
    // but FOLLOW_MIX_X/FOLLOW_MIX_Y/FOLLOW_MAX_Y below are meant to mean "sideways" and "up/down"
    // on SCREEN, not "this bone's local x/y". On a rig where the head's parent chain carries close
    // to a 90°/100° cumulative rotation (as on this character), local x ends up pointing almost
    // straight up/down on screen and local y almost straight sideways — so the tiny FOLLOW_MAX_Y
    // clamp meant to suppress vertical drift was actually suppressing sideways drift, while the
    // generous FOLLOW_MIX_X was landing on the vertical axis instead, making the head visibly
    // lift far more than the source pet animation itself does (more than what shows in the Spine
    // editor, which has no follow logic at all). Converting to world space first and splitting
    // sideways/vertical there makes the mix behave the same regardless of a given rig's rotation.
    const sourceBone = c.skeleton.findBone(sourceName);
    const parentMatrix = sourceBone && boneWorldMatrix(sourceBone.parent);
    let worldDx = off.x, worldDy = off.y;
    if (parentMatrix){
      const {a, b, c: cc, d} = parentMatrix;
      worldDx = a*off.x + b*off.y;
      worldDy = cc*off.x + d*off.y;
    }
    let worldFx = worldDx * FOLLOW_MIX_X;
    let worldFy = worldDy * FOLLOW_MIX_Y;
    if (worldFy > FOLLOW_MAX_Y) worldFy = FOLLOW_MAX_Y;
    else if (worldFy < -FOLLOW_MAX_Y) worldFy = -FOLLOW_MAX_Y;
    // Convert the now screen-correct sideways/vertical amounts back into the shared local frame
    // (same parent as sourceBone, same matrix) before writing them onto each follow target's pose.
    let localFx = worldFx, localFy = worldFy;
    if (parentMatrix){
      const {a, b, c: cc, d} = parentMatrix;
      const det = a*d - b*cc;
      if (Math.abs(det) > 1e-9){
        const invDet = 1/det;
        localFx = (worldFx*d - worldFy*b) * invDet;
        localFy = (worldFy*a - worldFx*cc) * invDet;
      }
    }
    targets.forEach(targetName=>{
      const bone = c.skeleton.findBone(targetName);
      if (!bone) return;
      let base = c.followBases.get(targetName);
      if (!base){
        const p = bonePose(bone);
        base = {x: p.x, y: p.y};
        c.followBases.set(targetName, base);
      }
      const pose = bonePose(bone);
      pose.x = base.x + localFx;
      pose.y = base.y + localFy;
      // Once fully settled back near zero, drop the captured base so the next drag re-snapshots
      // fresh (in case idle animation moved this bone in the meantime).
      if (!off.dragging && Math.abs(off.x) < 0.05 && Math.abs(off.y) < 0.05){
        c.followBases.delete(targetName);
      }
    });
  }

  function applyProceduralEffects(c, dt){
    c.offsets.forEach((off, boneName)=>{
      const bone = c.skeleton.findBone(boneName);
      if (!bone) return;
      if (!off.dragging){
        const k = 900, damping = 24; // underdamped (critical would be ~60) for a snappy "띠용" boing-back with a little overshoot, instead of a slow, no-bounce glide
        // Semi-implicit (symplectic) Euler: update velocity first, then use the *new* velocity to
        // move the position, instead of using the old velocity for both in the same step. Plain
        // ("explicit") Euler goes numerically unstable for a spring this stiff once the frame time
        // gets a little long (e.g. a stutter, or a tab that was backgrounded) — the offset would
        // start blowing up into a jittery, ever-growing wobble instead of settling, which is what
        // made the spring-back look like it was "moving strangely". Semi-implicit Euler is far more
        // stable for stiff springs at the same stiffness/timestep and is a one-line reorder.
        const ax = -k*off.x - damping*off.vx;
        const ay = -k*off.y - damping*off.vy;
        off.vx += ax*dt; off.vy += ay*dt;
        off.x += off.vx*dt; off.y += off.vy*dt;
        if (Math.abs(off.x) < 0.05 && Math.abs(off.y) < 0.05 && Math.abs(off.vx) < 0.05 && Math.abs(off.vy) < 0.05){
          c.offsets.delete(boneName);
          // Settled fully back to rest — snap any follow targets back to their captured base too
          // (off is ~0 already so this is a no-op in practice, just avoids a stale tiny residual)
          // and clear their bases so the next drag re-snapshots from a fresh pose.
          (FOLLOW_MAP[boneName] || []).forEach(targetName=>{
            const base = c.followBases.get(targetName);
            const targetBone = c.skeleton.findBone(targetName);
            if (base && targetBone){
              const p = bonePose(targetBone);
              p.x = base.x; p.y = base.y;
            }
            c.followBases.delete(targetName);
          });
          return;
        }
      }
      // Set the absolute pose relative to the base captured when the drag started, rather than
      // adding to whatever pose.x/y the bone currently holds. This animation's timelines don't
      // key cheek.x/y, so nothing else was resetting that value between frames — `pose.x += off.x`
      // every single frame meant the same offset kept stacking on top of itself indefinitely
      // (tens of times a second) instead of representing "here's where the cheek should sit right
      // now", which is what sent the bone flying off after the first touch.
      const pose = bonePose(bone);
      pose.x = off.baseX + off.x;
      pose.y = off.baseY + off.y;
      applyManualFollow(c, boneName, off);
    });
    const now = performance.now();
    c.patEffects.forEach((eff, boneName)=>{
      const bone = c.skeleton.findBone(boneName);
      const duration = eff.kind === 'pet' ? 520 : 480;
      const t = (now - eff.start) / duration;
      if (t >= 1 || !bone){
        // Explicitly snap back to the exact captured base instead of just stopping. With unkeyed
        // rotation/scale, whatever value happened to be on screen the instant this effect is
        // dropped (a frame can easily land at t=0.97 with a tiny bit of squash still showing, since
        // frames don't land exactly on t=1) is what silently becomes the new "resting" pose. Over
        // many taps that tiny per-tap leftover kept compounding, which is why the head looked more
        // and more crushed the more it was tapped. Writing the exact base here guarantees every
        // single tap returns to the true original, no matter how the timing lines up.
        if (bone){
          const pose = bonePose(bone);
          pose.rotation = eff.baseRotation; pose.scaleX = eff.baseScaleX; pose.scaleY = eff.baseScaleY;
          pose.shearX = eff.baseShearX; pose.shearY = eff.baseShearY;
          if (Number.isFinite(eff.baseX) && Number.isFinite(eff.baseY)){ pose.x = eff.baseX; pose.y = eff.baseY; }
        }
        c.patEffects.delete(boneName);
        return;
      }
      const s = Math.sin(t*Math.PI);
      const pose = bonePose(bone);
      if (eff.kind === 'pet'){
        // no dedicated stroke animation yet — a slower, gentler pulse plus side-to-side rotation
        // wobble stands in for it. Scaled uniformly on purpose: a gentle all-over "breathe" reads
        // fine regardless of the rig's rotation, and petting isn't meant to look squashed.
        pose.rotation = eff.baseRotation + Math.sin(t*Math.PI*2) * 4 * (1-t);
        pose.scaleX = eff.baseScaleX * (1 + 0.05*s);
        pose.scaleY = eff.baseScaleY * (1 + 0.05*s);
      } else {
        // Head tap ("콩콩"): flatten wider left-right / shorter top-to-bottom, with a bouncy
        // squash-and-stretch curve (quick flatten on impact, a small rebound stretch as it springs
        // back, decaying to nothing) instead of a flat one-shot shrink.
        //
        // This has to be built in world/screen space, not the bone's own local axes: this rig's
        // parent chain carries a ~100° rotation, so a plain "scaleX up, scaleY down" on the bone's
        // *local* axes would show up on screen as a diagonal squash, not a horizontal one. Instead:
        // 1) figure out what this bone's world matrix would be with no squash applied (base local
        //    pose combined with the parent's current world matrix), 2) scale THAT along world x/y —
        //    world space maps to screen with no extra rotation (see worldToScreenCSS), so this is
        //    exactly "wider on screen" / "shorter on screen" — then 3) convert the result back into
        //    whatever local rotation/scale/shear this bone needs to reproduce it.
        const bounce = Math.sin(t*Math.PI*2.4) * Math.exp(-t*4.5);
        const amount = 0.22 * bounce; // >0 = flattened (wide+short), <0 = stretched (narrow+tall) rebound
        const parentMatrix = boneWorldMatrix(bone.parent);
        let applied = false;
        // A little downward dip on impact (and a small lift as it rebounds) sells the "콩콩" weight —
        // built in world space for the same reason as the flatten/stretch above: this rig's parent
        // chain is rotated, so a plain "-y" nudge on the bone's own local axis wouldn't read as
        // "down" on screen. maxDip is sized off the character's own bounds so it scales sensibly
        // across differently-sized rigs.
        const maxDip = Math.max(c.bounds.w, c.bounds.h) * 0.03;
        const dipWorldY = -maxDip * amount; // amount>0 (flattened) -> moves down; amount<0 (rebound) -> lifts
        if (parentMatrix){
          const L = localMatrixFromPose(eff.baseRotation, eff.baseScaleX, eff.baseScaleY, eff.baseShearX, eff.baseShearY);
          const {a: pa, b: pb, c: pc, d: pd} = parentMatrix;
          // Unsquashed world matrix this bone would have right now (parent * base local).
          const a0 = pa*L.a + pb*L.c, b0 = pa*L.b + pb*L.d;
          const c0 = pc*L.a + pd*L.c, d0 = pc*L.b + pd*L.d;
          const sx = 1 + amount, sy = 1 - amount;
          const decomposed = decomposeWorldToLocal(a0*sx, b0*sx, c0*sy, d0*sy, pa, pb, pc, pd);
          if (decomposed){
            pose.rotation = decomposed.rotation;
            pose.scaleX = decomposed.scaleX;
            pose.scaleY = decomposed.scaleY;
            pose.shearX = decomposed.shearX;
            pose.shearY = decomposed.shearY;
            // Convert the desired world-space dip (0, dipWorldY) into this bone's local x/y by
            // inverting the parent's world matrix — same trick used for the cheek-pull drag delta.
            const det = pa*pd - pb*pc;
            if (Math.abs(det) > 1e-9 && Number.isFinite(eff.baseX) && Number.isFinite(eff.baseY)){
              const invDet = 1/det;
              const localDx = (0*pd - dipWorldY*pb) * invDet;
              const localDy = (dipWorldY*pa - 0*pc) * invDet;
              pose.x = eff.baseX + localDx;
              pose.y = eff.baseY + localDy;
            }
            applied = true;
          }
        }
        if (!applied){
          // No parent (or a degenerate matrix) — local space already is world/screen space, so a
          // plain axis split (and a plain y nudge) is correct as-is.
          pose.rotation = eff.baseRotation;
          pose.scaleX = eff.baseScaleX * (1 + amount);
          pose.scaleY = eff.baseScaleY * (1 - amount);
          pose.shearX = eff.baseShearX;
          pose.shearY = eff.baseShearY;
          if (Number.isFinite(eff.baseX) && Number.isFinite(eff.baseY)){
            pose.x = eff.baseX;
            pose.y = eff.baseY + dipWorldY;
          }
        }
      }
    });
  }

  function updateHints(c){
    if (!hintToggle.checked || !c){
      hintLayer.style.display = 'none';
      return;
    }
    hintLayer.style.display = 'block';
    if (hintLayer.dataset.charId !== c.id){
      hintLayer.innerHTML = '';
      hintLayer.dataset.charId = c.id;
      c.interactiveBones.forEach(ib=>{
        const dot = document.createElement('div');
        dot.className = 'hint-dot ' + ib.type;
        dot.dataset.bone = ib.name;
        hintLayer.appendChild(dot);
      });
    }
    // worldToScreenCSS() returns a position relative to the *canvas's* own top-left corner, but
    // each dot is positioned relative to hintLayer's top-left corner instead. The two boxes are
    // meant to line up exactly (hintLayer uses CSS inset:0 on stage-wrap, canvas gets its size
    // set in JS by resizeCanvas()), but depending on layout timing they can end up a few pixels
    // apart, which made every dot land off from the bone it's supposed to mark. Measuring the
    // actual gap between the two boxes here and folding it into the placement fixes that
    // regardless of why the drift happened.
    const canvasRect = canvas.getBoundingClientRect();
    const layerRect = hintLayer.getBoundingClientRect();
    const offsetX = canvasRect.left - layerRect.left;
    const offsetY = canvasRect.top - layerRect.top;
    hintLayer.querySelectorAll('.hint-dot').forEach(dot=>{
      const bone = c.skeleton.findBone(dot.dataset.bone);
      const world = c.hitAnchors.get(dot.dataset.bone) || boneVisualCenter(c, bone);
      if (!world) return;
      const pos = worldToScreenCSS(world.x, world.y);
      dot.style.transform = `translate(${pos.x + offsetX - 17}px, ${pos.y + offsetY - 17}px)`;
      if (!window.__hintDebugLoggedFor || window.__hintDebugLoggedFor !== c.id){
        const pivot = boneWorldPos(bone);
        const pivotScreen = pivot ? worldToScreenCSS(pivot.x, pivot.y) : null;
        console.log('[debug] hint dot', dot.dataset.bone, {
          visualCenterWorld: world, visualCenterScreen: pos,
          bonePivotWorld: pivot, bonePivotScreen: pivotScreen,
          canvasRect, hintLayerRect: layerRect, offsetX, offsetY,
          dotComputedTransform: getComputedStyle(dot).transform
        });
      }
    });
    window.__hintDebugLoggedFor = c.id;
  }

  function renderLoop(now){
    requestAnimationFrame(renderLoop);
    const dt = lastTime ? Math.min((now-lastTime)/1000, 0.05) : 0;
    lastTime = now;
    if (!gl || !renderer) return;
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    if (mode === 'studio'){
      const chars = studioSlots.map(s=>s.char).filter(Boolean);
      if (chars.length === 0){ updateHints(null); return; }
      chars.forEach(c=>{
        c.animationState.update(dt);
        // Spine 4.2+ split physics timing out of AnimationState: PhysicsConstraint gets its
        // per-frame delta from Skeleton.update(delta), NOT from AnimationState.update(dt). This
        // call was missing entirely, which is the actual root cause of "물리제약이 안먹어" (hair/
        // skirt physics bones just following their keyframed/parent rotation with zero spring lag
        // or overshoot) — with no delta ever reaching the physics constraints, their internal
        // simulation never advances a single tick no matter how many frames render. Must be called
        // after AnimationState.update(dt) (which advances the clip's own time) and before
        // AnimationState.apply()/updateWorldTransform() below, per Spine's own documented order.
        c.skeleton.update(dt);
        c.animationState.apply(c.skeleton);
        // Re-mute the moment any clip's keyframes may have set it non-zero (see
        // muteHeadFollowConstraints for the full "파츠 뜯어짐" root-cause writeup) — must run
        // after apply() (which is what would have re-enabled it) and before
        // updateWorldTransform() below (which is what actually runs the buggy constraint math).
        muteHeadFollowConstraints(c.skeleton);
        applyProceduralEffects(c, dt);
        // Physics.reset (instead of the usual Physics.update) on the exact frame a body-drag just
        // teleported this character — see the c.__justRepositioned comment in the slotDrag
        // pointermove handler above — AND for every frame of an active manual body drag (see
        // c.__slotDragActive, set/cleared in the pointerdown/endDrag handlers). The jumpThreshold
        // heuristic alone only catches a single big instantaneous jump; it still let an ordinary,
        // smooth per-frame drag delta through to Physics.update, and even that "normal" delta is
        // far larger, per frame, than any rig animation ever produces — Spine's physics
        // constraints read it as a huge world-space velocity and threw the hair out to the side,
        // never resettling until the drag stopped (the "뒷머리 이탈" symptom on video). Holding
        // physics on Physics.reset for the drag's entire duration keeps jiggle bones rigidly
        // pinned to the body (no sway) while it's being manually repositioned; ordinary
        // Physics.update — and therefore natural jiggle — resumes the instant the drag ends.
        // c.__reactionPinnedUntil covers the *other* kind of teleport: an interaction
        // (tap/pat/pet) crossfading this character onto a different track-0 animation — see
        // pinReactionPhysics()/REACTION_PIN_MS and the comment on animationStateData.defaultMix
        // for why this needs the same Physics.reset treatment held for the crossfade's whole
        // duration, not just the first frame of it.
        const isDragPinned = !!(c.__justRepositioned || c.__slotDragActive ||
          (c.__reactionPinnedUntil && now < c.__reactionPinnedUntil));
        // THE FIX for "드래그 직후에만 뒷머리가 찢어짐" (tears specifically the instant a body-drag
        // ends, only on physics-constraint bones): while isDragPinned is true, setPhysicsConstraintsMuted
        // below swaps each PhysicsConstraint's own update() method for a complete no-op (see that
        // function's comment) — meaning the spring's OWN internal "last known position/velocity"
        // bookkeeping is 100% frozen for the entire drag, no matter how far the character actually
        // moved, since our separate recomputeBoneWorldRigid() pass only fixes what's drawn on
        // screen, never touches the constraint's internal state. The instant the drag ends and the
        // real update() is restored, THAT frame's first real physics update compares its stale,
        // frozen pre-drag position against the bone's true (now far away) current position and
        // reads the whole drag distance as one huge single-frame velocity — exactly the fling/tear
        // seen right after releasing a drag. Fix: on precisely the one transition frame where
        // pinning just turned off (wasDragPinned true, isDragPinned now false), run ONE
        // spine.Physics.reset pass with the constraint UNMUTED (not spine.Physics.update) — this
        // lets the real, now-active constraint code resync its internal position/velocity to the
        // character's actual current pose with zero implied velocity, instead of jumping straight
        // to Physics.update and reading that resync gap as a spring impulse. Every following frame
        // proceeds through the normal isDragPinned-false / Physics.update path as before.
        const justUnpinned = !!c.__wasDragPinned && !isDragPinned;
        c.__wasDragPinned = isDragPinned;
        // Belt-and-suspenders: spine.Physics.reset alone does NOT fully suppress this rig's
        // PhysicsConstraint-driven hair/skirt sway during a fast body-drag on this pinned
        // spine-webgl 4.3.13 build — confirmed via a bone-drift diagnostic that caught the back
        // hair bones (backhairL2-4/R2-4/SR2-5, all real `_PhysicsConstraint` instances per a
        // dump of skeleton.constraints) lagging farther and farther behind the body every frame
        // while dragging (growing drift, unchanged local pose) — the classic signature of a
        // spring constraint still running despite Physics.reset. setPhysicsConstraintsMuted()
        // forces every physics constraint's mix to 0 directly, independent of whether
        // Physics.reset's own internal reset bookkeeping is honored by this build. Called every
        // frame with the current isDragPinned value so it both mutes instantly when a drag starts
        // and restores the original mix the instant it ends.
        setPhysicsConstraintsMuted(c.skeleton, isDragPinned);
        // Local-pose corruption fix (root cause of the drift surviving mix=0 + the update()
        // no-op swap above): snapshot every physics-constraint bone's LOCAL pose right now, while
        // it's still clean (set by animationState.apply()/applyProceduralEffects() only, nothing
        // physics-related has touched it yet this frame). Whatever updateWorldTransform() does to
        // these bones below — mix/method muting notwithstanding — this snapshot lets us undo it.
        const __pcPoseSnapshot = isDragPinned
          ? getBonesNeedingRigidRecompute(c.skeleton).map(b => ({ bone: b, pose: snapshotBonePose(b) }))
          : null;
        c.skeleton.updateWorldTransform((isDragPinned || justUnpinned) ? spine.Physics.reset : spine.Physics.update);
        c.__justRepositioned = false;
        if (__pcPoseSnapshot){
          // Force each physics bone's local pose back to the pre-updateWorldTransform snapshot.
          // Confirmed via [debug][mute-verify]: even with mix=0 and update() replaced by a no-op,
          // the watched bone (backhairSR5) kept drifting further from the body every frame while
          // pinned — which is only possible if something still writes into bone.pose during this
          // call despite the "mute" above. recomputeBoneWorldRigid() further down can't fix that on
          // its own: it faithfully rebuilds world transform FROM whatever local pose is current, so
          // a still-corrupted local pose just produces a bone rigidly glued to the wrong spot.
          // Restoring the clean snapshot here gives that recompute good data to work from.
          __pcPoseSnapshot.forEach(({bone, pose}) => restoreBonePose(bone, pose));
        }
        // THE ACTUAL FIX for "뒷머리 뜯어짐" (hair tearing away during a body-drag): the
        // [debug][mute-verify] log proved the constraint-muting above wasn't the answer — even with
        // the constraint's update() fully replaced by a no-op AND mix forced to 0, the watched hair
        // bone (backhairSR5) still drifted 183px away from the body by frame 15. A bone that's
        // truly just "not being pushed by physics" should stay perfectly rigid relative to its
        // parent as the parent moves (plain FK does that automatically) — drifting further away
        // every frame instead means that bone's updateWorldTransform() wasn't running AT ALL once
        // its constraint was silenced. On this build, jiggle bones apparently have no independent
        // "plain bone" entry in skeleton.updateCache — the physics constraint's own update() call
        // is the ONLY thing that ever repositions them, jiggle or not. So muting it doesn't stop
        // the sway, it stops the bone from tracking the body altogether, and it's left further and
        // further behind as the drag continues — exactly the tearing seen on video.
        // Fix: manually call each affected bone's own updateWorldTransform() (a plain Bone method,
        // nothing to do with the constraint) right after the pass above. The parent bones earlier
        // in hierarchy order have already been updated to their new dragged position by the normal
        // skeleton pass, so this simply recomputes worldX/Y/rotation from the bone's current local
        // pose against that fresh parent transform — rigidly following the body, no jiggle, no lag.
        if (isDragPinned){
          // Was: getPhysicsConstraintBones(...).forEach(b => b.updateWorldTransform()) — that
          // called the runtime's own Bone method directly, which threw "Cannot read properties of
          // undefined (reading '_update')" (BonePose.ts:139) on every single frame of a body-drag
          // on this build, crashing renderLoop before the actual "뒷머리 뜯어짐" fix below it ever
          // ran. recomputeBoneWorldRigid (added above) does the same "rigidly follow the parent, no
          // jiggle" job by hand instead of through that broken runtime method. Sorted by hierarchy
          // depth (shallowest/parent-most first) so a chained jiggle bone (e.g. backhairL2 -> L3 ->
          // L4) always sees its own parent's *freshly recomputed* world matrix rather than a stale
          // one from before this pass started.
          getBonesNeedingRigidRecompute(c.skeleton)
            .slice()
            .sort((a, b) => boneDepth(a) - boneDepth(b))
            .forEach(b => recomputeBoneWorldRigid(b));
        }
        // Verification: confirm the mute call above is actually (a) running, (b) matching
        // constraints, and (c) having any effect on the bone that was drifting worst before —
        // rather than assuming the previous fix worked. Logs once right when a drag starts, then
        // every ~15 frames while it continues.
        if (isDragPinned){
          c.__verifyFrame = (c.__verifyFrame || 0) + 1;
          if (c.__verifyFrame === 1 || c.__verifyFrame % 15 === 0){
            const pcs = getPhysicsConstraints(c.skeleton);
            const watchBone = c.skeleton.findBone('backhairSR5');
            const rootBone = c.skeleton.bones[0];
            const rootPos = boneWorldPos(rootBone);
            const watchPos = watchBone && boneWorldPos(watchBone);
            if (!c.__verifyBase && rootPos && watchPos){
              c.__verifyBase = {root: rootPos, offX: watchPos.x - rootPos.x, offY: watchPos.y - rootPos.y};
            }
            const base = c.__verifyBase;
            const expected = (base && rootPos) ? {x: rootPos.x + base.offX, y: rootPos.y + base.offY} : null;
            const drift = (expected && watchPos) ? Math.round(Math.hypot(watchPos.x - expected.x, watchPos.y - expected.y)) : null;
            const watchPose = watchBone && bonePose(watchBone);
            // Direct check instead of guessing further: is backhairSR5 actually one of the bones
            // recomputeBoneWorldRigid() runs on this frame? If it's missing from this list, the
            // rigid recompute is simply never touching it — it stays wherever it was left in world
            // space while the body/root moves on, which looks exactly like the drift we're seeing.
            const pcBones = getBonesNeedingRigidRecompute(c.skeleton);
            const pcBoneNames = pcBones.map(b => (b.data && b.data.name) || b.name || '?');
            const watchBoneIncluded = watchBone ? pcBones.indexOf(watchBone) !== -1 : null;
            // Per-constraint dump: does each PhysicsConstraint actually expose a usable .bone /
            // .bones reference on this build? If a constraint named e.g. "backhairSR5" shows
            // hasBone:false and bonesLen:0, getPhysicsConstraintBones() has nothing to push for it
            // no matter how correctly everything else is written.
            const pcDump = pcs.map(pc => ({
              name: pc.data && pc.data.name,
              hasBone: !!pc.bone,
              boneName: pc.bone && ((pc.bone.data && pc.bone.data.name) || pc.bone.name),
              bonesLen: Array.isArray(pc.bones) ? pc.bones.length : 0
            }));
            console.log('[debug][mute-verify]', c.id, JSON.stringify({
              frame: c.__verifyFrame,
              physicsConstraintsFound: pcs.length,
              samplePcMix: pcs[0] ? pcs[0].mix : undefined,
              samplePcDataMix: pcs[0] ? pcs[0].data.mix : undefined,
              samplePcMutedMethod: pcs[0] ? pcs[0].__mutedMethodName : undefined,
              samplePcName: pcs[0] ? pcs[0].data.name : undefined,
              watchBoneDrift: drift,
              watchBonePoseX: watchPose ? Math.round(watchPose.x) : undefined,
              watchBonePoseY: watchPose ? Math.round(watchPose.y) : undefined,
              watchBonePoseRotation: watchPose ? Math.round(watchPose.rotation) : undefined,
              watchBoneIncludedInRecompute: watchBoneIncluded,
              pcBoneNamesRecomputed: pcBoneNames,
              pcDump: pcDump
            }));
          }
        } else {
          c.__verifyFrame = 0;
          c.__verifyBase = null;
        }
        // Runaway-bone safety net: whatever the exact cause turns out to be (pinned spine-webgl
        // 4.3.13 has already shown other constraint quirks vs. the exported data — see
        // fixTransformConstraintMixes above — so a physics-timing edge case slipping past the
        // __slotDragActive guard above isn't out of the question), a jiggle bone (back hair, ears,
        // tail...) that's genuinely flung away from the body inflates the skeleton's own bounding
        // box far past anything a normal idle sway ever produces. Catching that directly, rather
        // than trying to enumerate every possible timing path that could cause it, means the fix
        // holds even if the real trigger is something this file's code never gets a chance to see.
        if (c.__studioExpectedW && c.__studioExpectedH){
          c.skeleton.getBounds(__runawayBoundsOffset, __runawayBoundsSize, []);
          const expectedMax = Math.max(c.__studioExpectedW, c.__studioExpectedH);
          const liveMax = Math.max(__runawayBoundsSize.x, __runawayBoundsSize.y);
          if (Number.isFinite(liveMax) && liveMax > expectedMax * 2.2){
            console.warn('[debug][runaway-bone] detected on', c.id, '— live bounds', liveMax.toFixed(1), 'vs expected', expectedMax.toFixed(1), '— forcing extra Physics.reset');
            c.skeleton.updateWorldTransform(spine.Physics.reset);
          }
        }
        // Recovery net: if a bone's world transform has already diverged to NaN/Infinity — e.g. a
        // character positioned before this fix was in place — nothing in a normal Physics.update
        // pass can bring it back on its own; a diverged spring has no restoring force pulling it
        // toward a finite value. Re-pose the skeleton from scratch and reset physics once, which
        // clears the bad state without needing a page reload.
        {
          const rootBone = c.skeleton.bones[0];
          const rootWorld = rootBone && (rootBone.appliedPose || rootBone);
          const rootIsBroken = !rootWorld || !Number.isFinite(rootWorld.worldX) || !Number.isFinite(rootWorld.worldY);
          if (rootIsBroken){
            c.skeleton.setToSetupPose();
            c.animationState.apply(c.skeleton);
            c.skeleton.updateWorldTransform(spine.Physics.reset);
          }
        }
        // Catch any bone a transform constraint just flung off the body (the "파츠 분리" symptom
        // when a clip drives atama/cheek hard) and snap it back onto its parent. Must run before
        // the rotation post-process below, so that block rotates an already-intact pose — and
        // before updateHitAnchors/drawing, so taps and the rendered image agree.
        guardConstraintBlowups(c);
        // Studio rotation slider: NOT applied as a root-bone rotation (tried that first — see the
        // git history for the old approach). Setting root.rotation before updateWorldTransform()
        // silently did nothing on every rig: this skeleton's bones are driven by IK/transform
        // constraints, and constraint resolution runs *inside* updateWorldTransform() itself, after
        // local bone values are set, so it just recomputed the root's rotation back from the
        // animation and threw the manual offset away — no error, just zero visible effect.
        // Instead, rotate the already-finished world matrices/positions of every bone around the
        // character's own root pivot, AFTER updateWorldTransform() (and therefore after every
        // constraint) has run. Nothing downstream of this point can override it, since there's no
        // more constraint/animation logic left to run this frame — this is the actual final pose.
        if (c.studioRotation){
          try{
            // Pivot: rotate around the character's visual bounding-box center (c.bounds, kept in
            // world space by layoutStudioSlots — same box used for hit-testing/drag) rather than
            // the root bone's world position. The root bone's pivot rarely sits in the middle of
            // the actual artwork (it's wherever the rig's animator put it), so rotating around it
            // made the character swing around an off-center point instead of spinning in place.
            if (c.bounds && Number.isFinite(c.bounds.x) && Number.isFinite(c.bounds.y) && Number.isFinite(c.bounds.w) && Number.isFinite(c.bounds.h)){
              const rad = degToRad(c.studioRotation);
              const cos = Math.cos(rad), sin = Math.sin(rad);
              const px = c.bounds.x + c.bounds.w/2, py = c.bounds.y + c.bounds.h/2;
              // Every bone this block is about to overwrite is remembered here first, and put back
              // right after the draw (see restoreStudioRotation() below renderer.end()). Reason:
              // this rotation writes into the exact same worldX/worldY/a/b/c/d fields that the
              // NEXT frame's constraint pass reads as its "where was this bone last frame"
              // reference — PhysicsConstraint in particular derives its spring velocity from
              // precisely that comparison. Leaving the rotated values in place therefore fed every
              // jiggle bone (ears, hair, tail) a fake velocity equal to the whole rotation offset,
              // every single frame, which is what flung those parts off the body as soon as a
              // rotated character played a motion. Restoring the unrotated values after drawing
              // keeps the rotation purely visual: the renderer sees the rotated pose, the physics
              // and constraint math on the next frame see the clean one.
              const restore = c.__rotationRestore || (c.__rotationRestore = []);
              restore.length = 0;
              c.__rotationApplied = true;
              c.skeleton.bones.forEach(b=>{
                // 4.3: world transform (worldX/worldY/a/b/c/d) lives on bone.appliedPose, not on
                // the bare bone object — same story as boneWorldPos/boneWorldMatrix above. Reading
                // b.worldX directly gave undefined here, so this rotation never had any visible
                // effect even though no error was thrown (the finite-check just skipped silently).
                const bSrc = (b.appliedPose && Number.isFinite(b.appliedPose.worldX)) ? b.appliedPose : b;
                const dx = bSrc.worldX - px, dy = bSrc.worldY - py;
                const newWorldX = px + dx*cos - dy*sin;
                const newWorldY = py + dx*sin + dy*cos;
                const a = bSrc.a, bb = bSrc.b, cc = bSrc.c, d = bSrc.d;
                const newA = cos*a - sin*cc;
                const newB = cos*bb - sin*d;
                const newC = sin*a + cos*cc;
                const newD = sin*bb + cos*d;
                // Guard against propagating NaN/Infinity into the render (e.g. a bone whose world
                // transform hasn't been computed yet on the very first frame) — skip that single
                // bone rather than let one bad value corrupt the whole skeleton's draw.
                if ([newWorldX,newWorldY,newA,newB,newC,newD].every(Number.isFinite)){
                  restore.push({target: bSrc, worldX: bSrc.worldX, worldY: bSrc.worldY, a: a, b: bb, c: cc, d: d});
                  // The bare bone object is written too when it carries its own copy of the world
                  // transform, since parts of this file (and some runtime paths) read it there.
                  if (bSrc !== b && Number.isFinite(b.worldX)){
                    restore.push({target: b, worldX: b.worldX, worldY: b.worldY, a: b.a, b: b.b, c: b.c, d: b.d});
                    b.worldX = newWorldX; b.worldY = newWorldY;
                    b.a = newA; b.b = newB; b.c = newC; b.d = newD;
                  }
                  bSrc.worldX = newWorldX; bSrc.worldY = newWorldY;
                  bSrc.a = newA; bSrc.b = newB; bSrc.c = newC; bSrc.d = newD;
                }
              });
            }
          } catch(err){
            // Never let a rotation-math failure take down the whole render loop (which would
            // otherwise silently blank the stage on every subsequent frame, since the next
            // requestAnimationFrame is already scheduled but this callback throws before it draws
            // anything). Log it once per character so it's diagnosable instead of invisible.
            if (!c.__rotationWarned){ console.error('[studio rotation] failed for', c.id, err); c.__rotationWarned = true; }
          }
        }
        updateHitAnchors(c);
      });
      renderer.begin();
      chars.forEach(c=>renderer.drawSkeleton(c.skeleton));
      renderer.end();
      // Undo the purely-visual rotation applied above, now that the frame is drawn — see the big
      // comment at the top of that block for why leaving it in place tore jiggle parts off the
      // body on the following frame.
      chars.forEach(restoreStudioRotation);
      // Per-character hint dots aren't wired up for the studio yet (hintLayer currently tracks a
      // single character) — cleared here rather than left showing a stale single dot.
      updateHints(null);
      return;
    }

    const c = loadedCharacters.get(activeId);
    if (!c){ updateHints(null); return; }
    c.animationState.update(dt);
    // See the identical call in the studio render loop above for why this is required: without
    // it, PhysicsConstraint (hair/skirt jiggle) never receives a per-frame delta and never
    // simulates at all — bones just render at their plain keyframed/FK position.
    c.skeleton.update(dt);
    c.animationState.apply(c.skeleton);
    // Same re-mute as the studio render loop — see muteHeadFollowConstraints for why this has to
    // run every frame, after apply() and before updateWorldTransform().
    muteHeadFollowConstraints(c.skeleton);
    applyProceduralEffects(c, dt);
    c.skeleton.updateWorldTransform(spine.Physics.update);
    // Same runaway-transform-constraint guard the studio loop runs — the instability is in the
    // runtime's constraint math, not in anything studio-specific, so the single-character viewer
    // needs it on exactly the same clips.
    guardConstraintBlowups(c);
    updateHitAnchors(c);

    renderer.begin();
    renderer.drawSkeleton(c.skeleton);
    renderer.end();

    if (!window.__debugLoggedFrame){
      window.__debugLoggedFrame = true;
      console.log('[debug] first render frame', {glError: gl.getError(), skeletonBoneCount: c.skeleton.bones.length, rootBoneWorld: boneWorldPos(c.skeleton.bones[0])});
    }

    updateHints(c);
  }

  applyStaticI18n();
  loadManifest();
  loadSiteConfig();
  showWelcomeModalIfNeeded();
})();
</script>
</body>
