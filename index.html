      // outward as the idle animation plays and the physics catches up. Framing the camera
      // (fitCameraToActive/fitStudioCamera, both keyed off char.bounds below) to that too-tight
      // first-frame box then clips the hair right at the canvas edge once the sway carries it
      // past it — the "뒷머리만 잘림" (only the back hair gets cut off) symptom. Stepping through
      // a couple of loops and unioning every sampled box up front gives an envelope that already
      // has room for the full range of motion, so the very first camera fit is correct.
      const boundsOffset = new spine.Vector2(), boundsSize = new spine.Vector2();
      let envMinX = Infinity, envMinY = Infinity, envMaxX = -Infinity, envMaxY = -Infinity;
      const sampleBounds = ()=>{
        skeleton.getBounds(boundsOffset, boundsSize, []);
        if (Number.isFinite(boundsOffset.x) && Number.isFinite(boundsOffset.y) &&
            Number.isFinite(boundsSize.x) && Number.isFinite(boundsSize.y)){
          envMinX = Math.min(envMinX, boundsOffset.x);
          envMinY = Math.min(envMinY, boundsOffset.y);
          envMaxX = Math.max(envMaxX, boundsOffset.x + boundsSize.x);
          envMaxY = Math.max(envMaxY, boundsOffset.y + boundsSize.y);
        }
      };
      sampleBounds();
      const defaultAnimObj = defaultAnim ? skeletonData.findAnimation(defaultAnim) : null;
      // Two full loops of whatever the idle animation is (capped between 1-4s) is enough for a
      // looping clip to retrace its whole range and for jiggle physics to reach its steady sway
      // — going longer would only slow every character's load for no extra coverage.
      const sampleSpan = defaultAnimObj ? Math.min(Math.max(defaultAnimObj.duration * 2, 1), 4) : 1;
      const SAMPLE_STEP = 1/30;
      for (let t = SAMPLE_STEP; t <= sampleSpan; t += SAMPLE_STEP){
        animationState.update(SAMPLE_STEP);
        animationState.apply(skeleton);
        skeleton.updateWorldTransform(spine.Physics.update);
        sampleBounds();
      }
      // Put the character back on a clean resting frame — with physics reset, not mid-sway from
      // the sampling loop above — so it actually starts from its normal idle pose once loaded.
      animationState.clearTracks();
      if (defaultAnim) animationState.setAnimation(0, defaultAnim, true);
      animationState.update(0);
      animationState.apply(skeleton);
      skeleton.updateWorldTransform(spine.Physics.reset);

      const interactiveBones = [];
      const headBoneName = pickBestBoneMatch(HEAD_PATTERN);
      if (headBoneName) interactiveBones.push({name:headBoneName, type:'pat', squashName: resolveSquashBoneName(headBoneName)});
      const cheekBoneName = pickBestBoneMatch(CHEEK_PATTERN);
      if (cheekBoneName) interactiveBones.push({name:cheekBoneName, type:'pull'});

      const offsetVec = {
        x: Number.isFinite(envMinX) ? envMinX : boundsOffset.x,
        y: Number.isFinite(envMinY) ? envMinY : boundsOffset.y
      };
      const sizeVec = {
        x: Number.isFinite(envMaxX) ? Math.max(envMaxX - offsetVec.x, 1) : Math.max(boundsSize.x, 1),
        y: Number.isFinite(envMaxY) ? Math.max(envMaxY - offsetVec.y, 1) : Math.max(boundsSize.y, 1)
      };
      const bw = Math.max(sizeVec.x,1), bh = Math.max(sizeVec.y,1);
      const padX = bw * 0.15, padY = bh * 0.15;
      const inBoundsMinX = offsetVec.x - padX, inBoundsMaxX = offsetVec.x + bw + padX;
      const inBoundsMinY = offsetVec.y - padY, inBoundsMaxY = offsetVec.y + bh + padY;

      console.log('[debug] bounds box', {minX:inBoundsMinX, maxX:inBoundsMaxX, minY:inBoundsMinY, maxY:inBoundsMaxY});
      console.log('[debug] picked candidate bones with positions', interactiveBones.map(ib=>{
        const bone = skeleton.findBone(ib.name);
        const pos = boneWorldPos(bone);
        return {name: ib.name, type: ib.type, worldX: pos ? pos.x : null, worldY: pos ? pos.y : null};
      }));

      // Extra safety net: if the picked bone still ends up sitting outside the character's actual
      // visible body (e.g. a mislabeled control bone that doesn't match CONTROL_BONE_PATTERN), drop
      // it rather than showing a hint dot off in a corner. Bones with a non-finite world position are
      // kept as-is (better to keep a possibly-imprecise bone than to silently lose it).
      const filteredInteractiveBones = interactiveBones.filter(ib=>{
        const bone = skeleton.findBone(ib.name);
        if (!bone) return false;
        const pos = boneWorldPos(bone);
        if (!pos) return true;
        return pos.x >= inBoundsMinX && pos.x <= inBoundsMaxX &&
               pos.y >= inBoundsMinY && pos.y <= inBoundsMaxY;
      });
      // If filtering removed everything, fall back to the unfiltered list rather than showing nothing.
      // (.slice() makes a real copy — reusing the same array reference here caused the very bug
      // where clearing `interactiveBones` below also silently wiped out this fallback.)
      const finalInteractiveBones = filteredInteractiveBones.length > 0 ? filteredInteractiveBones : interactiveBones.slice();
      interactiveBones.length = 0;
      interactiveBones.push(...finalInteractiveBones);
      console.log('[debug] interactive bones after bounds filter', interactiveBones.map(b=>b.name));


      if (interactiveBones.length === 0 && skeleton.bones.length > 1){
        let top = null, topY = -Infinity;
        skeleton.bones.forEach(b=>{
          if (b.data.name === 'root') return;
          const pos = boneWorldPos(b);
          if (!pos) return;
          if (pos.y > topY && pos.x >= inBoundsMinX && pos.x <= inBoundsMaxX && pos.y >= inBoundsMinY && pos.y <= inBoundsMaxY){ topY = pos.y; top = b.data; }
        });
        if (top) interactiveBones.push({name:top.name, type:'pat', fallback:true, squashName: resolveSquashBoneName(top.name)});
      }


      const char = {
        id: entry.id,
        rawName: entry.name,
        rawDescription: entry.description,
        name: displayName0,
        description: localize(entry.description) || '',
        skeleton, animationState, animationStateData, skeletonData,
        interactiveBones,
        reactions: {
          hit: pickReactionAnims(skeletonData.animations.map(a=>a.name), HIT_PATTERN),
          pet: pickReactionAnims(skeletonData.animations.map(a=>a.name), PET_PATTERN),
          pull: pickReactionAnims(skeletonData.animations.map(a=>a.name), PULL_PATTERN)
        },
        reactionBusy: false,
        // The character's "true" idle/base animation to return to after a reaction sequence
        // (head-tap or cheek-pull) finishes. This is intentionally NOT read off
        // animationState.getTrack(0) at reaction time — that reflects whatever is playing at
        // that exact instant, which can itself be another reaction's one-shot follow-up clip
        // (loop:false) if one reaction fires while another is still wrapping up (e.g. tapping
        // the head right as the cheek-pull's follow-up is playing). Capturing that transient
        // clip as "what to go back to" bakes its loop:false in permanently, so the character
        // freezes on its last frame forever instead of returning to a looping idle. Keeping a
        // single persistent value here, updated only by genuine base-animation changes (see
        // resetMotionAndSkin and the manual animation picker), keeps every reaction returning
        // to the real resting pose regardless of what transient clip happens to be mid-flight.
        restingAnimation: {name: defaultAnim, loop: true},
        offsets: new Map(),
        patEffects: new Map(),
        // Base (pre-follow) local x/y snapshot for each of head/face/backhead/hear, captured the
        // moment atama or cheek starts being dragged — see FOLLOW_MAP / applyManualFollow(). This
        // replaces relying on the native (buggy, unstable-at-nonzero-mix — see fixTransformConstraintMixes)
        // spine-webgl 4.3.13 transform-constraint implementation for the "atama/cheek drag also
        // nudges head/face/backhead/hear a little" effect.
        followBases: new Map(),
        // Stable, "settled" world position per interactive bone, used for hit-testing and hint
        // dots instead of the bone's live (possibly mid-animation) position. Without this, tapping
        // the head to trigger the hit reaction — whether the dedicated Spine clip or the procedural
        // fallback — visibly dips/moves the head bone while it plays, which also silently drags the
        // hit circle down with it. A second quick tap aimed at where the head *was* then misses,
        // making rapid repeated taps ("콩콩콩") frustrating. This anchor is only refreshed while the
        // bone is at rest (see updateHitAnchors), so it stays put for the duration of the reaction.
        hitAnchors: new Map(),
        activeHolds: new Map(),
        bounds: {x:offsetVec.x, y:offsetVec.y, w:Math.max(sizeVec.x,1), h:Math.max(sizeVec.y,1)},
        zoom: 1, panX: 0, panY: 0, baseCamera: null, // mouse-wheel / pinch zoom state, per character
        defaultAnimation: defaultAnim,
        skins: skinsMeta,
        skinName: defaultSkinName,
        defaultSkinName: defaultSkinName
      };
      console.log('[debug] skeleton bounds', char.bounds, 'skeleton.scaleX/Y', skeleton.scaleX, skeleton.scaleY, 'skeletonData x/y/w/h', skeletonData.x, skeletonData.y, skeletonData.width, skeletonData.height);
      return char;
  }

  async function openCharacter(entry){
    if (loadedCharacters.has(entry.id)){
      // Zoom/pan/motion/skin are intentionally not remembered between visits — always come back
      // to the default framing, default animation, and default skin rather than wherever the
      // user last left things.
      const existing = loadedCharacters.get(entry.id);
      existing.zoom = 1; existing.panX = 0; existing.panY = 0;
      resetMotionAndSkin(existing);
      activeId = entry.id;
      showViewer();
      refreshViewerUI();
      return;
    }
    showViewer();
    const displayName0 = localize(entry.name) || entry.id;
    charNameHeading.textContent = displayName0;
    charDescription.textContent = t('loading');
    initGL();
    if (!gl){ showToast(t('webglUnsupported')); return; }
    showToast(t('loadingNamed')(displayName0));
    try{
      const char = await loadCharacterInstance(entry);
      loadedCharacters.set(entry.id, char);
      activeId = entry.id;
      showViewer();
      refreshViewerUI();
    } catch(err){
      console.error(err);
      showToast(t('failedToast')(displayName0));
      charDescription.textContent = t('failedDesc')(err && err.message ? err.message : 'unknown error');
    }
  }

  // Switches a character's active Spine skin. Resetting slots to their setup pose, where
  // available, clears out any attachment left over from the previous skin on slots the new skin
  // doesn't cover. The method for this was renamed between runtime versions (setSlotsToSetupPose
  // pre-4.3, setupPoseSlots from 4.3 onward as part of that version's bone/slot "Pose" refactor —
  // see https://esotericsoftware.com/spine-changelog), so both names are feature-detected rather
  // than assumed. Either way, per Spine's skin-change rules, a slot that already had an
  // attachment under the old skin picks up the corresponding attachment from the new skin
  // automatically — which covers ordinary full outfit-swap skins like the ones this site expects
  // — so skipping it entirely is a safe last-resort fallback, not just a silent failure. The
  // animation is then re-applied immediately so the new skin shows correctly on screen without
  // waiting a frame.
  function applySkin(c, skinName){
    if (!c || !skinName || c.skinName === skinName) return;
    try{
      c.skeleton.setSkinByName(skinName);
    } catch(err){
      console.warn(`[skin] failed to switch ${c.id} to "${skinName}"`, err);
      return;
    }
    if (typeof c.skeleton.setupPoseSlots === 'function'){
      // Spine 4.3+ runtime name.
      c.skeleton.setupPoseSlots();
    } else if (typeof c.skeleton.setSlotsToSetupPose === 'function'){
      // Pre-4.3 runtime name.
      c.skeleton.setSlotsToSetupPose();
    } else {
      // Neither exists (older/newer builds that dropped both) — without this, a slot only picks
      // up the new skin automatically if it *already* has a same-named attachment attached; any
      // slot the currently-playing animation doesn't keyframe (ears, tail, front hair,
      // face/faceline, blush, etc. on this rig) is left showing whatever happened to be attached
      // under the previous skin. Re-resolving every slot's setup-pose attachment name against the
      // newly active skin reproduces what setupPoseSlots/setSlotsToSetupPose does.
      // Note: as of 4.3, Slot instances no longer expose setAttachment() directly (attachment
      // moved onto slot.pose as part of the Pose refactor above), so this goes through
      // Skeleton#setAttachment(slotName, attachmentName) instead, which is still the documented
      // convenience method across runtime versions.
      c.skeleton.slots.forEach(slot=>{
        const name = slot.data.attachmentName;
        c.skeleton.setAttachment(slot.data.name, name || null);
      });
    }
    c.skinName = skinName;
    c.animationState.apply(c.skeleton);
    c.skeleton.updateWorldTransform(spine.Physics.update);
  }

  function getSkinDescription(c){
    const base = localize(c.rawDescription) || '';
    const meta = c.skins && c.skins.find(s=>s.name === c.skinName);
    const metaDesc = meta && localize(meta.description);
    if (metaDesc) return base ? `${base}\n\n${metaDesc}` : metaDesc;
    return base;
  }

  function updateDescription(c){
    charDescription.textContent = getSkinDescription(c);
  }

  function renderSkinList(c){
    skinList.innerHTML = '';
    if (!c.skins || c.skins.length <= 1){
      // Nothing to choose between — no point showing a picker for a single-skin character.
      skinPanel.style.display = 'none';
      return;
    }
    skinPanel.style.display = '';
    c.skins.forEach(s=>{
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = localize(s.label) || s.name;
      skinList.appendChild(opt);
    });
    skinList.value = c.skinName;
  }

  // Single delegated listener instead of one per option (options don't get their own click
  // handlers on a <select>) — reads whichever character is active at change time.
  skinList.addEventListener('change', ()=>{
    const c = loadedCharacters.get(activeId);
    if (!c) return;
    applySkin(c, skinList.value);
    updateDescription(c);
  });

  // Puts a character back to its default motion and default skin — used both when re-opening a
  // character that was already loaded, and by the manual reset button.
  function resetMotionAndSkin(c){
    applySkin(c, c.defaultSkinName);
    if (c.defaultAnimation){
      c.animationState.setAnimation(0, c.defaultAnimation, true);
      c.restingAnimation = {name: c.defaultAnimation, loop: true};
    }
    loopToggle.checked = true;
    c.reactionBusy = false;
    c.activeHolds.clear(); // drop any in-progress hold bookkeeping so it can't fire a stale return-to later
    // A background character's cheek-pull/head-tap effects only animate back to rest while it's
    // the *active* character (see renderLoop), so a character switched away from mid-drag can
    // still be holding a stretched/squashed pose. Snap those bones back to their captured base
    // before dropping the effect entries, instead of just clearing the map and leaving the
    // distortion stuck on screen.
    c.offsets.forEach((off, boneName)=>{
      const bone = c.skeleton.findBone(boneName);
      if (!bone) return;
      const pose = bonePose(bone);
      if (Number.isFinite(off.baseX) && Number.isFinite(off.baseY)){ pose.x = off.baseX; pose.y = off.baseY; }
    });
    c.patEffects.forEach((eff, boneName)=>{
      const bone = c.skeleton.findBone(boneName);
      if (!bone) return;
      const pose = bonePose(bone);
      pose.rotation = eff.baseRotation; pose.scaleX = eff.baseScaleX; pose.scaleY = eff.baseScaleY;
      pose.shearX = eff.baseShearX; pose.shearY = eff.baseShearY;
      if (Number.isFinite(eff.baseX) && Number.isFinite(eff.baseY)){ pose.x = eff.baseX; pose.y = eff.baseY; }
    });
    c.offsets.clear();
    c.patEffects.clear();
  }

  function refreshViewerUI(){
    const c = loadedCharacters.get(activeId);
    if (!c) return;
    charNameHeading.textContent = localize(c.rawName) || c.id;
    updateDescription(c);
    fitCameraToActive();
    renderTabs();
    renderSkinList(c);
    renderAnimList(c);
    renderBoneList(c);
    speedSlider.value = 1;
    c.animationState.timeScale = 1;
    hintLayer.dataset.charId = '';
  }

  // Computes the "fit to view" framing (zoom = 1) for the active character and stores it on the
  // character as baseCamera, then re-applies whatever zoom/pan that character currently has on
  // top of it. Kept separate from applyCameraTransform() so resizing the window (which changes
  // aspect ratio) recomputes the base fit without resetting a zoom the user already dialed in.
  function fitCameraToActive(){
    const c = loadedCharacters.get(activeId);
    if (!renderer || !c) return;
    const b = c.bounds;
    const pad = 1.35;
    const cx = b.x + b.w/2, cy = b.y + b.h/2;
    const aspect = canvas.width / canvas.height;
    let vw = b.w*pad, vh = b.h*pad;
    if (vw/vh < aspect) vw = vh*aspect; else vh = vw/aspect;
    c.baseCamera = {cx, cy, vw, vh};
    applyCameraTransform(c);
    console.log('[debug] camera fit', {cx, cy, vw, vh, canvasW: canvas.width, canvasH: canvas.height});
  }

  // Applies a character's current zoom/pan on top of its base "fit to view" framing.
  function applyCameraTransform(c){
    if (!renderer || !c || !c.baseCamera) return;
    const zoom = c.zoom || 1;
    renderer.camera.viewportWidth = c.baseCamera.vw / zoom;
    renderer.camera.viewportHeight = c.baseCamera.vh / zoom;
    renderer.camera.position.x = c.baseCamera.cx + (c.panX || 0);
    renderer.camera.position.y = c.baseCamera.cy + (c.panY || 0);
    renderer.camera.update();
  }

  function clampZoom(z){ return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)); }

  // Positions every loaded studio character. Auto-arrangement (automatically spacing multiple
  // characters side by side as a group) has been removed — every character defaults to standing
  // on its own at the shared ground line (world y = 0), centered on world x = 0, and it's up to
  // the person to drag each one to where they want it (see slotDrag below). This means adding or
  // removing a slot no longer reshuffles everyone else's position. Each character's *original*
  // captured bounds and scale (from load time, before any studio-specific transform) are cached
  // once as studioOrigBounds/studioOrigScaleX/Y, since c.bounds and c.skeleton.scaleX/Y
  // themselves get overwritten below — without caching the originals, a second layout call
  // (removing a slot, or moving the size slider) would compound the previous shift/scale instead
  // of recomputing cleanly from scratch every time.
  function layoutStudioSlots(){
    const entries = studioSlots.filter(s=>s.char).map(s=>({slot:s, c:s.char}));
    if (entries.length === 0) return;
    entries.forEach(({c})=>{
      if (!c.studioOrigBounds) c.studioOrigBounds = {x:c.bounds.x, y:c.bounds.y, w:c.bounds.w, h:c.bounds.h};
      if (c.studioOrigScaleX === undefined){ c.studioOrigScaleX = c.skeleton.scaleX; c.studioOrigScaleY = c.skeleton.scaleY; }
    });
    entries.forEach(({slot, c})=>{
      const scale = slot.scale || 1;
      c.skeleton.scaleX = c.studioOrigScaleX * scale;
      c.skeleton.scaleY = c.studioOrigScaleY * scale;
      const ob = c.studioOrigBounds;
      const ew = ob.w*scale, eh = ob.h*scale, ex = ob.x*scale, ey = ob.y*scale;
      const autoShiftX = -(ex + ew/2); // centers this character's own bounds on world x = 0
      const autoShiftY = -ey;          // bottom of the scaled bounds lands on the ground line
      // Manual position sliders are normalized to the character's OWN current size (e.g. 0.5 =
      // "half my own width to the right") so a slider setting still feels the same after the
      // size slider changes, rather than needing to be re-tuned every time.
      const manualX = (slot.offsetXNorm || 0) * ew;
      const manualY = (slot.offsetYNorm || 0) * eh;
      const newX = autoShiftX + manualX;
      const newY = autoShiftY + manualY;
      // Detect the teleport HERE, inside the one function that actually moves the skeleton,
      // instead of trusting every call site to remember to flag it themselves. This only needs to
      // catch a genuine one-off TELEPORT — first placement, the size slider, "reset positions" —
      // not the normal frame-by-frame motion of a smooth mouse drag. An earlier version of this
      // flagged c.__justRepositioned on ANY change at all (even a fraction of a pixel), which
      // meant every single frame of an ordinary slow drag also forced a physics reset instead of
      // a normal update. Resetting every frame throws away the jiggle bones' (hair/ears/tail)
      // accumulated sway and snaps them back to their bind pose each time, and doing that on
      // literally every rendered frame of a drag — rather than once, right after a real jump —
      // is what was producing the flat, undeformed-looking "torn" hair mesh caught on video: the
      // mesh was being asked to render mid-reset almost every frame instead of settling into its
      // normal physics-driven shape. Using a threshold sized to the character's own dimensions
      // (rather than a tiny fixed epsilon) means ordinary per-frame drag deltas — a few pixels at
      // most — fall through to the normal Physics.update path below and jiggle naturally, while an
      // actual instantaneous jump (which is always much larger than one frame of mouse movement)
      // still gets caught and reset so its spring doesn't blow out.
      const jumpThreshold = Math.max(ew, eh) * 0.08;
      if (c.__studioLastX === undefined || Math.hypot(newX - c.__studioLastX, newY - c.__studioLastY) > jumpThreshold){
        c.__justRepositioned = true;
      }
      c.__studioLastX = newX; c.__studioLastY = newY;
      c.skeleton.x = newX;
      c.skeleton.y = newY;
      c.bounds = {x: ex + newX, y: ey + newY, w: ew, h: eh};
      // Cached for the "runaway bone" safety net in renderLoop — the expected on-stage size of
      // this character at its current scale, before any idle-sway/physics widen it a little.
      c.__studioExpectedW = ew; c.__studioExpectedH = eh;
      // Read every frame in renderLoop's studio branch (see there for why: animationState.apply()
      // re-poses every bone including the root each frame, so a one-time root.rotation set here
      // would just get overwritten before the next draw).
      c.studioRotation = slot.rotation || 0;
    });
  }

  // Computes the "fit to view" framing for the whole studio stage (union of every placed
  // character's bounds) and stores it on studioCamera, then re-applies whatever shared zoom/pan
  // is currently dialed in — same split as fitCameraToActive/applyCameraTransform above, just at
  // the stage level instead of per character.
  function fitStudioCamera(){
    if (!renderer) return;
    const chars = studioSlots.map(s=>s.char).filter(Boolean);
    if (chars.length === 0){
      // No characters placed yet. Still give the stage a neutral baseline camera (instead of
      // leaving baseCamera null) so scroll/pinch zoom and background dragging work on an empty
      // studio — the moment a character is added, the branch below recomputes this for real.
      const aspect = canvas.width / canvas.height;
      let vw = 600, vh = 600;
      if (vw/vh < aspect) vw = vh*aspect; else vh = vw/aspect;
      studioCamera.baseCamera = {cx:0, cy:0, vw, vh};
      applyStudioCameraTransform();
      return;
    }
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    chars.forEach(c=>{
      minX = Math.min(minX, c.bounds.x); maxX = Math.max(maxX, c.bounds.x + c.bounds.w);
      minY = Math.min(minY, c.bounds.y); maxY = Math.max(maxY, c.bounds.y + c.bounds.h);
    });
    const pad = 1.25;
    const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
    const aspect = canvas.width / canvas.height;
    let vw = (maxX-minX)*pad, vh = (maxY-minY)*pad;
    if (vw/vh < aspect) vw = vh*aspect; else vh = vw/aspect;
    studioCamera.baseCamera = {cx, cy, vw, vh};
    applyStudioCameraTransform();
  }

  function applyStudioCameraTransform(){
    if (!renderer || !studioCamera.baseCamera) return;
    const zoom = studioCamera.zoom || 1;
    renderer.camera.viewportWidth = studioCamera.baseCamera.vw / zoom;
    renderer.camera.viewportHeight = studioCamera.baseCamera.vh / zoom;
    renderer.camera.position.x = studioCamera.baseCamera.cx + (studioCamera.panX || 0);
    renderer.camera.position.y = studioCamera.baseCamera.cy + (studioCamera.panY || 0);
    renderer.camera.update();
  }

  // Same cursor-anchored zoom trick as zoomAt(c, ...) above, but against the single shared
  // studioCamera instead of a per-character one.
  function studioZoomAt(clientX, clientY, factor){
    if (!renderer || !studioCamera.baseCamera || !Number.isFinite(factor) || factor <= 0) return;
    const before = screenToWorld(clientX, clientY);
    const newZoom = clampZoom((studioCamera.zoom || 1) * factor);
    if (newZoom !== studioCamera.zoom){
      studioCamera.zoom = newZoom;
      applyStudioCameraTransform();
      const after = screenToWorld(clientX, clientY);
      studioCamera.panX = (studioCamera.panX || 0) + (before.x - after.x);
      studioCamera.panY = (studioCamera.panY || 0) + (before.y - after.y);
      applyStudioCameraTransform();
    }
    // Note: this only moves the camera/characters. Wheel/pinch callers that also want the
    // background to zoom in lockstep should go through studioZoomBothAt() instead of calling
    // this directly — see that function's comment for why the two can't just be zoomed
    // independently by the same raw factor.
  }

  // Cursor/pinch-midpoint-anchored zoom for the background layer, mirroring studioZoomAt's math
  // but in the background layer's own CSS-pixel space (translate() is applied unscaled, after
  // scale(), in .studio-bg-layer's transform — see its CSS comment — so panX/panY only need a
  // factor-weighted blend with the anchor's offset from center, no world<->screen conversion).
  function bgZoomAt(clientX, clientY, factor){
    if (!Number.isFinite(factor) || factor <= 0) return;
    const rect = stageWrap.getBoundingClientRect();
    const sx = clientX - (rect.left + rect.width/2);
    const sy = clientY - (rect.top + rect.height/2);
    const minZ = parseFloat(studioBgZoomSlider.min) || 0.1;
    const maxZ = parseFloat(studioBgZoomSlider.max) || 3;
    const newZoom = Math.min(maxZ, Math.max(minZ, studioBgZoom * factor));
    const applied = newZoom / studioBgZoom;
    if (applied === 1) return;
    studioBgPanX = studioBgPanX * applied + sx * (1 - applied);
    studioBgPanY = studioBgPanY * applied + sy * (1 - applied);
    studioBgZoom = newZoom;
    studioBgZoomSlider.value = String(studioBgZoom);
    applyStudioBackground();
  }

  // Scroll/pinch zoom in the studio is meant to move the background and the characters together,
  // as if they were one scene — but the background layer (CSS transform:scale, its own
  // min/max from studioBgZoomSlider) and the stage camera (studioCamera.zoom, clamped to
  // ZOOM_MIN/ZOOM_MAX) are two independently-clamped systems. Applying the raw wheel/pinch
  // `factor` to both separately would let whichever one has more headroom keep zooming after the
  // other one has hit its limit, breaking the "zoom together" feel and letting the two drift out
  // of sync. This computes the largest factor, in the same direction as the requested `factor`,
  // that BOTH the camera and the background can still fully apply — so the pair always moves in
  // lockstep and freezes (factor collapses to 1, i.e. no movement) the instant either one is maxed
  // out, exactly as if a single shared zoom were being clamped.
  // Deliberately does not touch the background zoom slider or the per-character size slider —
  // those remain independent, uncapped-by-each-other controls; this only governs wheel/pinch.
  function syncedStudioZoomFactor(factor){
    if (!Number.isFinite(factor) || factor <= 0) return 1;
    if (factor === 1) return 1;
    // No background image loaded means there's nothing to stay in sync with — fall back to the
    // camera's own full range instead of needlessly capping character zoom at the background
    // layer's (unused) 0.1–3 slider range.
    if (!studioBackgroundURL) return clampZoom((studioCamera.zoom || 1) * factor) / (studioCamera.zoom || 1);
    const camZoom = studioCamera.zoom || 1;
    const bg = studioBgZoom;
    const minZ = parseFloat(studioBgZoomSlider.min) || 0.1;
    const maxZ = parseFloat(studioBgZoomSlider.max) || 3;
    if (factor > 1){
      // Zooming in: cap at whichever of the two hits its max first, but never let the cap flip
      // the direction into a zoom-out (floor the result at 1 = "no movement").
      const camCap = camZoom > 0 ? ZOOM_MAX / camZoom : 1;
      const bgCap = bg > 0 ? maxZ / bg : 1;
      return Math.max(1, Math.min(factor, camCap, bgCap));
    }
    // Zooming out: cap at whichever hits its min first; ceil the result at 1 for the same reason.
    const camCap = camZoom > 0 ? ZOOM_MIN / camZoom : 1;
    const bgCap = bg > 0 ? minZ / bg : 1;
    return Math.min(1, Math.max(factor, camCap, bgCap));
  }

  // Applies one wheel/pinch zoom step to the studio's background and characters together, per
  // syncedStudioZoomFactor's clamped factor. clientX/clientY is the cursor position (wheel) or
  // pinch midpoint — each layer anchors the zoom to that same screen point independently (world
  // space for the camera, CSS-pixel space for the background), so both keep the same point of the
  // scene under the user's fingers/cursor even though they zoom through different math.
  function studioZoomBothAt(clientX, clientY, factor){
    const eff = syncedStudioZoomFactor(factor);
    if (eff === 1) return;
    studioZoomAt(clientX, clientY, eff);
    if (studioBackgroundURL) bgZoomAt(clientX, clientY, eff);
  }

  // True only when the point falls outside *every* placed studio character's bounds — used the
  // same way isOutsideCharacter() is used in the single-character viewer, to decide whether a
  // press on empty space should start a background pan.
  function isOutsideAllStudioChars(clientX, clientY){
    const chars = studioSlots.map(s=>s.char).filter(Boolean);
    if (chars.length === 0) return true;
    return chars.every(c=>isOutsideCharacter(c, clientX, clientY));
  }

  // Finds which placed studio character's bounding box contains this pointer, used to start a
  // whole-character reposition drag when the press lands on a character's body but not on any
  // interactive bone. Walked back-to-front (last drawn = visually on top) so an overlap after a
  // manual drag resolves to whichever character the user would actually expect to grab.
  function findStudioCharAt(clientX, clientY){
    const chars = studioSlots.map(s=>s.char).filter(Boolean);
    for (let i = chars.length - 1; i >= 0; i--){
      if (!isOutsideCharacter(chars[i], clientX, clientY)) return chars[i];
    }
    return null;
  }

  // Finds which studio character (if any) owns an interactive bone under this pointer, checking
  // each placed character in turn since they sit side by side rather than overlapping.
  // Tap-only in the studio: testing confirmed a plain short tap on a 'pat' bone (releases before
  // DRAG_THRESHOLD_PX -> playReaction('hit')) is fine on its own, but the physics runaway
  // (tail/hair flinging out) that kept reproducing came from the *held/dragged* interactions —
  // cheek "pull" (a 'pull'-type bone, always a drag) and the pet hold-drag that a 'pat' bone
  // escalates into once the pointer moves past that threshold (see the studio-only guard on that
  // escalation in pointermove). So only 'pat' bones are hit-testable here at all, and the escalation
  // itself is blocked, leaving nothing but the tap path reachable in the studio.
  function findStudioHit(clientX, clientY){
    const chars = studioSlots.map(s=>s.char).filter(Boolean);
    for (const c of chars){
      const hit = findHitBone(c, clientX, clientY);
      if (hit && hit.type === 'pat') return {c, hit};
    }
    return null;
  }

  // Looks up a character by id the same way regardless of which pointer-interaction state
  // (dragging/gesture/pinch) is asking — but scoped to whichever pool is actually live right
  // now. Deliberately NOT a single merged lookup across both loadedCharacters and studioSlots:
  // the same entry.id can exist in both places (e.g. you viewed Chigiri solo earlier, then put
  // Chigiri on the studio stage), and querying the wrong pool would resolve pointer events
  // against a character that isn't even on screen.
  function getCharById(id){
    if (mode === 'studio'){
      const slot = studioSlots.find(s=>s.char && s.char.id === id);
      return slot ? slot.char : null;
    }
    return loadedCharacters.get(id) || null;
  }

  async function addStudioSlot(entry, skinName){
    if (studioSlots.length >= STUDIO_MAX_SLOTS) return;
    const slot = {id:'slot'+(++studioSlotSeq), entry, skinName, animName:null, char:null, offsetXNorm:0, offsetYNorm:0, scale:1, rotation:0, speed:1};
    studioSlots.push(slot);
    renderStudioSlots();
    initGL();
    if (!gl){ studioSlots = studioSlots.filter(s=>s!==slot); renderStudioSlots(); return; }
    try{
      const char = await loadCharacterInstance(entry);
      // loadCharacterInstance stamps char.id = entry.id, which is fine for the single-character
      // viewer (one instance per entry.id) but not here: two slots can share the same entry.id
      // with different skins, and dragging/gesture/pinch/panDrag state (and getCharById above)
      // all key off char.id to find the right instance mid-interaction. Slot ids are unique per
      // slot, so re-stamping onto that avoids one instance's interactions ever resolving onto
      // the other.
      char.id = slot.id;
      if (skinName && skinName !== char.skinName) applySkin(char, skinName);
      // Reconcile against the character's *actual* resolved skin name (matters when the caller
      // passed '' / a manifest-less fallback) so later duplicate checks and the slot label are
      // accurate rather than stuck on the placeholder value picked before loading finished.
      slot.skinName = char.skinName;
      slot.animName = char.defaultAnimation;
      slot.char = char;
      layoutStudioSlots();
      // Only auto-frame the camera for the very first character placed on an otherwise-empty
      // stage (same reasoning as endDrag's comment below). Once something's already on stage,
      // adding another character leaves the camera exactly as the person left it instead of
      // re-fitting to the union of every character's bounds — that recompute is what was making
      // the view visibly zoom out/recenter ("shrink") every time a 2nd+ character was placed.
      if (studioSlots.filter(s=>s.char).length === 1) fitStudioCamera();
    } catch(err){
      console.error(err);
      studioSlots = studioSlots.filter(s=>s!==slot);
      showToast(t('failedToast')(localize(entry.name) || entry.id));
    }
    renderStudioSlots();
  }

  function removeStudioSlot(slotId){
    studioSlots = studioSlots.filter(s=>s.id !== slotId);
    layoutStudioSlots();
    // Same reasoning as addStudioSlot above: don't re-fit the camera just because the set of
    // characters changed — that snaps the view to the remaining character(s)' bounds and reads
    // as an unwanted zoom. Only refit when the stage goes fully empty, so the placeholder
    // baseCamera gets set (see resetStudio's comment on why an empty stage still needs one).
    if (studioSlots.filter(s=>s.char).length === 0) fitStudioCamera();
    renderStudioSlots();
  }

  // Layer order (which character draws on top of which) is simply the order of studioSlots in
  // the array — see renderLoop below, where characters are drawn in array order so a later entry
  // paints over an earlier one. These two helpers swap a slot with its neighbor to move it one
  // step toward the front (drawn later / on top) or back (drawn earlier / behind). Position never
  // needs to be recomputed here since layoutStudioSlots positions each character independently
  // now (no group arrangement depends on array order).
  function moveStudioSlotForward(slotId){
    const i = studioSlots.findIndex(s=>s.id === slotId);
    if (i === -1 || i === studioSlots.length - 1) return;
    [studioSlots[i], studioSlots[i+1]] = [studioSlots[i+1], studioSlots[i]];
    renderStudioSlots();
  }
  function moveStudioSlotBackward(slotId){
    const i = studioSlots.findIndex(s=>s.id === slotId);
    if (i <= 0) return;
    [studioSlots[i-1], studioSlots[i]] = [studioSlots[i], studioSlots[i-1]];
    renderStudioSlots();
  }

  // Clears the whole stage back to its starting state: every placed character, the background
  // image and its zoom, and the shared stage camera's zoom/pan.
  function resetStudio(){
    studioSlots = [];
    studioBackgroundURL = null;
    studioBgZoom = 1;
    studioBgZoomSlider.value = '1';
    studioBgPanX = 0; studioBgPanY = 0;
    stageWrap.style.removeProperty('--stage-ratio');
    studioCamera.zoom = 1; studioCamera.panX = 0; studioCamera.panY = 0;
    applyStudioBackground();
    resizeCanvas();
    // fitStudioCamera() (not a direct null-out) so the empty-studio placeholder baseCamera gets
    // set right away — otherwise background drag/scroll-zoom would stay dead until a character
    // was added, same bug this file's other zero-character fix addresses.
    fitStudioCamera();
    renderStudioSlots();
    showToast(t('studioResetToast'));
  }
  studioResetBtn.addEventListener('click', resetStudio);

  // Resets only the background's pan/zoom back to default — keeps the background image itself,
  // every placed character, and their skins/motions/speeds/positions untouched. Separate from the
  // character-position reset below so the person can fix just the piece that drifted.
  function resetStudioBgPosition(){
    studioBgZoom = 1;
    studioBgZoomSlider.value = '1';
    studioBgPanX = 0; studioBgPanY = 0;
    applyStudioBackground();
    showToast(t('studioResetBgPositionToast'));
  }
  studioResetBgPositionBtn.addEventListener('click', resetStudioBgPosition);

  // Resets every placed character's manual position/size, and the shared stage camera's zoom/pan,
  // back to default — keeps every placed character, its skin/motion/speed, and the background
  // image (and its pan/zoom) untouched.
  function resetStudioCharPositions(){
    studioSlots.forEach(slot=>{
      slot.offsetXNorm = 0;
      slot.offsetYNorm = 0;
      slot.scale = 1;
      slot.rotation = 0;
    });
    layoutStudioSlots();
    studioCamera.panX = 0;
    studioCamera.panY = 0;
    studioCamera.zoom = 1;
    fitStudioCamera();
    renderStudioSlots();
    showToast(t('studioResetCharPositionsToast'));
  }
  studioResetCharPositionsBtn.addEventListener('click', resetStudioCharPositions);

  // Loads a data URL / image URL into an <img> for canvas compositing (needed because the studio
  // background is stored as a CSS background-image, not a drawable element on its own).
  function loadImageForExport(src){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // Flattens the current stage — the user's background image (if any) plus every placed
  // character — into a single PNG and triggers a download. Composited on an offscreen 2D canvas
  // rather than just grabbing the WebGL canvas, since the background image is a separate DOM
  // layer (see studioBgLayer) that the WebGL context never draws itself. The background math
  // mirrors applyStudioBackground's CSS exactly: background-size:auto + background-position:center
  // means the image sits at its native size centered on the stage, then translate(pan) scale(zoom)
  // is applied around that center — reproduced here in the export canvas's pixel space (which is
  // devicePixelRatio-scaled, same as the WebGL canvas) rather than CSS pixels.
  async function exportStudioPNG(){
    if (mode !== 'studio' || !gl) return;
    if (studioSlots.length === 0){ showToast(t('studioExportEmptyToast')); return; }
    try{
      const scaleX = canvas.width / stageWrap.clientWidth;
      const scaleY = canvas.height / stageWrap.clientHeight;
      const full = document.createElement('canvas');
      full.width = canvas.width;
      full.height = canvas.height;
      const fctx = full.getContext('2d');
      // When there's a background image, remember its own footprint on the full-size canvas
      // (clipped to the stage bounds) so the export can be cropped down to just that rect below.
      // Without this, the exported PNG was always the full stage-wrap size, which left empty
      // margin around the background whenever it didn't happen to fill the whole stage — cropping
      // to the background's own bounds means the export only ever shows "background + whatever
      // character pixels fall inside it", with no leftover empty edges.
      let cropRect = null;
      if (studioBackgroundURL){
        const img = await loadImageForExport(studioBackgroundURL);
        const w = img.naturalWidth * scaleX * studioBgZoom;
        const h = img.naturalHeight * scaleY * studioBgZoom;
        const cx = full.width / 2 + studioBgPanX * scaleX;
        const cy = full.height / 2 + studioBgPanY * scaleY;
        const bgX = cx - w / 2, bgY = cy - h / 2;
        fctx.drawImage(img, bgX, bgY, w, h);
        cropRect = {
          left: Math.max(0, bgX),
          top: Math.max(0, bgY),
          right: Math.min(full.width, bgX + w),
          bottom: Math.min(full.height, bgY + h)
        };
      }
      // The WebGL context was created with preserveDrawingBuffer:true (see initGL) specifically
      // so this read-back is reliable regardless of render-loop timing.
      fctx.drawImage(canvas, 0, 0);

      // No background → nothing to crop to, so export the full stage as before. With a
      // background, crop down to its footprint (guarding against a degenerate 0-size rect, e.g.
      // a background panned entirely off-stage).
      let out = full;
      if (cropRect && cropRect.right > cropRect.left && cropRect.bottom > cropRect.top){
        const cw = cropRect.right - cropRect.left, ch = cropRect.bottom - cropRect.top;
        out = document.createElement('canvas');
        out.width = cw;
        out.height = ch;
        out.getContext('2d').drawImage(full, cropRect.left, cropRect.top, cw, ch, 0, 0, cw, ch);
      }

      out.toBlob(blob=>{
        if (!blob){ showToast(t('studioExportFailToast')); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bolulock-studio-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast(t('studioExportToast'));
      }, 'image/png');
    } catch(err){
      console.error(err);
      showToast(t('studioExportFailToast'));
    }
  }
  studioExportBtn.addEventListener('click', exportStudioPNG);

  function renderStudioSlots(){
    studioSlotList.innerHTML = '';
    studioSlots.forEach(slot=>{
      const li = document.createElement('li');
      li.className = 'studio-slot';
      const head = document.createElement('div');
      head.className = 'studio-slot-head';
      const nameWrap = document.createElement('div');
      const nameEl = document.createElement('div');
      nameEl.className = 'studio-slot-name';
      nameEl.textContent = localize(slot.entry.name) || slot.entry.id;
      nameWrap.appendChild(nameEl);
      const layerBtns = document.createElement('div');
      layerBtns.style.display = 'flex';
      layerBtns.style.gap = '4px';
      const idx = studioSlots.indexOf(slot);
      const backBtn = document.createElement('button');
      backBtn.type = 'button';
      backBtn.className = 'studio-slot-layer-btn';
      backBtn.textContent = '↓';
      backBtn.title = t('studioLayerBackward');
      backBtn.setAttribute('aria-label', t('studioLayerBackward'));
      backBtn.disabled = idx <= 0;
      backBtn.addEventListener('click', ()=>moveStudioSlotBackward(slot.id));
      const fwdBtn = document.createElement('button');
      fwdBtn.type = 'button';
      fwdBtn.className = 'studio-slot-layer-btn';
      fwdBtn.textContent = '↑';
      fwdBtn.title = t('studioLayerForward');
      fwdBtn.setAttribute('aria-label', t('studioLayerForward'));
      fwdBtn.disabled = idx === -1 || idx >= studioSlots.length - 1;
      fwdBtn.addEventListener('click', ()=>moveStudioSlotForward(slot.id));
      layerBtns.appendChild(backBtn);
      layerBtns.appendChild(fwdBtn);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'studio-slot-remove';
      removeBtn.textContent = '✕';
      removeBtn.setAttribute('aria-label', t('closeLabel'));
      removeBtn.addEventListener('click', ()=>removeStudioSlot(slot.id));
      head.appendChild(nameWrap);
      head.appendChild(layerBtns);
      head.appendChild(removeBtn);
      li.appendChild(head);

      if (!slot.char){
        const loadingEl = document.createElement('div');
        loadingEl.className = 'studio-slot-loading';
        loadingEl.textContent = t('studioSlotLoading');
        li.appendChild(loadingEl);
        studioSlotList.appendChild(li);
        return;
      }

      const c = slot.char;
      if (c.skins && c.skins.length > 1){
        const skinMeta = c.skins.find(s=>s.name === c.skinName);
        const skinEl = document.createElement('div');
        skinEl.className = 'studio-slot-skin';
        skinEl.textContent = (skinMeta && localize(skinMeta.label)) || c.skinName;
        nameWrap.appendChild(skinEl);
      }

      const motionSelect = document.createElement('select');
      motionSelect.className = 'anim-select';
      motionSelect.setAttribute('aria-label', 'Motion');
      c.skeletonData.animations.forEach(a=>{
        const opt = document.createElement('option');
        opt.value = a.name;
        opt.textContent = a.name;
        motionSelect.appendChild(opt);
      });
      motionSelect.value = slot.animName || c.defaultAnimation || '';
      motionSelect.addEventListener('change', ()=>{
        slot.animName = motionSelect.value;
        // Pin physics for this crossfade exactly like a pointer-triggered reaction does (see
        // pinReactionPhysics/REACTION_PIN_MS) — without this, switching motions here blends the
        // old and new animation's pose over animationStateData.defaultMix (0.25s) same as any
        // other track-0 swap, and a jiggle-bone spring (back hair) reads that blend as a huge
        // per-frame velocity and flings itself away ("뒷머리 찢어짐") instead of just cutting over
        // cleanly. This dropdown was the one track-0-swap call site that never pinned.
        pinReactionPhysics(c);
        c.animationState.setAnimation(0, motionSelect.value, true);
        c.restingAnimation = {name: motionSelect.value, loop: true};
      });
      li.appendChild(motionSelect);

      const sliders = document.createElement('div');
      sliders.className = 'studio-slot-sliders';

      const makeSlider = (labelKey, min, max, step, value, onInput)=>{
        const label = document.createElement('label');
        const span = document.createElement('span');
        span.textContent = t(labelKey);
        const input = document.createElement('input');
        input.type = 'range';
        input.min = String(min); input.max = String(max); input.step = String(step);
        input.value = String(value);
        input.addEventListener('input', ()=>onInput(parseFloat(input.value)));
        label.appendChild(span);
        label.appendChild(input);
        return label;
      };
      // Left/right and up/down position are no longer sliders — drag the character directly on
      // the stage instead (see the studio-only branch in the pointerdown/pointermove handlers
      // below, and slotDrag). Only size stays a slider, since there's no natural drag gesture for
      // that (pinch is already claimed by the shared stage zoom).
      // Deliberately NOT calling fitStudioCamera() here: it reframes the shared stage camera to
      // fit the (now bigger/smaller) character, which zooms the camera out/in to compensate and
      // makes the character look the same size on screen no matter what this slider is set to.
      // layoutStudioSlots() alone changes the character's actual size while the camera framing
      // stays put, so the size change is actually visible.
      sliders.appendChild(makeSlider('studioScaleLabel', 0.4, 2, 0.05, slot.scale || 1, v=>{
        slot.scale = v; layoutStudioSlots();
      }));
      // Rotation, in degrees, applied on top of whatever the animation already does with the
      // root bone (see the studioRotation branch in renderLoop) — layoutStudioSlots() doesn't
      // need to run here since rotation isn't part of the position/size layout math, just synced
      // onto the character object for renderLoop to pick up each frame.
      sliders.appendChild(makeSlider('studioRotationLabel', -180, 180, 1, slot.rotation || 0, v=>{
        slot.rotation = v; c.studioRotation = v;
      }));
      // Per-character playback speed — mirrors the single-character viewer's speedSlider, but
      // scoped to this slot's own animationState so each placed character can run at its own
      // pace independent of the others on stage.
      sliders.appendChild(makeSlider('speedLabel', 0.1, 2, 0.1, slot.speed || 1, v=>{
        slot.speed = v; c.animationState.timeScale = v;
      }));
      li.appendChild(sliders);
      studioSlotList.appendChild(li);
    });

    const full = studioSlots.length >= STUDIO_MAX_SLOTS;
    studioAddSlotBtn.style.display = full ? 'none' : '';
    studioFullNote.style.display = full ? '' : 'none';
  }

  function populateStudioPickCharSelect(){
    studioPickCharSelect.innerHTML = '';
    manifestEntries.filter(e=>!isComingSoon(e)).forEach(e=>{
      const opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = localize(e.name) || e.id;
      studioPickCharSelect.appendChild(opt);
    });
  }

  // Populated straight from manifest metadata (no asset load needed to know skin names/labels)
  // when the manifest declares skins for this entry; falls back to a single placeholder option
  // for characters whose skin list is only known once their Spine file is actually loaded.
  function populateStudioPickSkinSelect(entry){
    studioPickSkinSelect.innerHTML = '';
    const skins = (Array.isArray(entry.skins) && entry.skins.length > 0)
      ? entry.skins
      : [{name: entry.defaultSkin || '', label: t('skinTitle')}];
    skins.forEach(s=>{
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = localize(s.label) || s.name || t('skinTitle');
      studioPickSkinSelect.appendChild(opt);
    });
    studioPickSkinSelect.style.display = skins.length > 1 ? '' : 'none';
  }

  studioPickCharSelect.addEventListener('change', ()=>{
    const entry = manifestEntries.find(e=>e.id === studioPickCharSelect.value);
    if (entry) populateStudioPickSkinSelect(entry);
  });

  function openStudioPicker(){
    if (studioSlots.length >= STUDIO_MAX_SLOTS) return;
    populateStudioPickCharSelect();
    const firstEntry = manifestEntries.find(e=>e.id === studioPickCharSelect.value);
    if (firstEntry) populateStudioPickSkinSelect(firstEntry);
    studioPickerOverlay.classList.add('show');
  }
  function closeStudioPicker(){ studioPickerOverlay.classList.remove('show'); }

  studioAddSlotBtn.addEventListener('click', openStudioPicker);
  studioPickerClose.addEventListener('click', closeStudioPicker);
  studioPickerOverlay.addEventListener('click', (e)=>{ if (e.target === studioPickerOverlay) closeStudioPicker(); });
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && studioPickerOverlay.classList.contains('show')) closeStudioPicker(); });

  studioPickConfirmBtn.addEventListener('click', ()=>{
    const entry = manifestEntries.find(e=>e.id === studioPickCharSelect.value);
    if (!entry) return;
    const skinName = studioPickSkinSelect.value || null;
    closeStudioPicker();
    addStudioSlot(entry, skinName);
  });

  // Converts a client (mouse/touch) coordinate into Spine world space, using the camera's
  // *current* transform — used so zooming can keep the point under the cursor/pinch-midpoint
  // fixed on screen instead of always zooming toward the character's center.
  function screenToWorld(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const cssX = clientX - rect.left, cssY = clientY - rect.top;
    const cssW = canvas.clientWidth || 1, cssH = canvas.clientHeight || 1;
    const camera = renderer.camera;
    const worldPerCssX = camera.viewportWidth / cssW;
    const worldPerCssY = camera.viewportHeight / cssH;
    return {
      x: camera.position.x + (cssX - cssW/2) * worldPerCssX,
      y: camera.position.y - (cssY - cssH/2) * worldPerCssY
    };
  }

  // True when a client (mouse/touch) coordinate falls outside the character's own bounding box —
  // used to only let background-drag panning start when the user grabs empty space, not the
  // character itself (so it never fights with the head-tap / cheek-pull interactions).
  function isOutsideCharacter(c, clientX, clientY){
    const world = screenToWorld(clientX, clientY);
    const b = c.bounds;
    return world.x < b.x || world.x > b.x + b.w || world.y < b.y || world.y > b.y + b.h;
  }

  // Multiplies a character's zoom by `factor`, anchored so the world point currently under
  // (clientX, clientY) stays under that same screen point after the zoom is applied — this is
  // what makes wheel-zoom and pinch-zoom feel like they're zooming "into" the cursor/fingers
  // rather than always recentering on the character.
  function zoomAt(c, clientX, clientY, factor){
    if (!renderer || !c || !c.baseCamera || !Number.isFinite(factor) || factor <= 0) return;
    const before = screenToWorld(clientX, clientY);
    const newZoom = clampZoom((c.zoom || 1) * factor);
    if (newZoom === c.zoom) return;
    c.zoom = newZoom;
    applyCameraTransform(c);
    const after = screenToWorld(clientX, clientY);
    c.panX = (c.panX || 0) + (before.x - after.x);
    c.panY = (c.panY || 0) + (before.y - after.y);
    applyCameraTransform(c);
  }

  function renderAnimList(c){
    animList.innerHTML = '';
    c.skeletonData.animations.forEach(a=>{
      const opt = document.createElement('option');
      opt.value = a.name;
      opt.textContent = a.name;
      animList.appendChild(opt);
    });
    const current = c.animationState.getTrack(0) && c.animationState.getTrack(0).animation.name;
    animList.value = current || (c.skeletonData.animations[0] ? c.skeletonData.animations[0].name : '');
  }

  // Single delegated listener instead of one per option — reads whichever character is active
  // at change time, same pattern as skinList above.
  animList.addEventListener('change', ()=>{
    const c = loadedCharacters.get(activeId);
    if (!c) return;
    // Same physics-pin fix as the studio motion dropdown (see the comment there) — this manual
    // picker is also a track-0 animation swap and needs its crossfade pinned too.
    pinReactionPhysics(c);
    c.animationState.setAnimation(0, animList.value, loopToggle.checked);
    c.restingAnimation = {name: animList.value, loop: loopToggle.checked};
  });

  function renderBoneList(c){
    boneList.innerHTML = '';
    if (c.interactiveBones.length === 0){
      const li = document.createElement('li');
      li.textContent = t('noParts');
      boneList.appendChild(li);
      return;
    }
    c.interactiveBones.forEach(b=>{
      const li = document.createElement('li');
      const label = b.type === 'pat' ? t('boneLabelPat') : t('boneLabelPull');
      li.textContent = label + ' — ' + b.name + (b.fallback ? t('autoGuessSuffix') : '');
      boneList.appendChild(li);
    });
  }

  speedSlider.addEventListener('input', ()=>{
    const c = loadedCharacters.get(activeId);
    if (c) c.animationState.timeScale = parseFloat(speedSlider.value);
  });

  // Resets zoom, pan, playback speed, animation, and skin back to their defaults for the active
  // character.
  function resetView(){
    const c = loadedCharacters.get(activeId);
    if (!c) return;
    c.zoom = 1; c.panX = 0; c.panY = 0;
    applyCameraTransform(c);
    speedSlider.value = 1;
    c.animationState.timeScale = 1;
    resetMotionAndSkin(c);
    renderSkinList(c);
    renderAnimList(c);
    updateDescription(c);
    showToast(t('resetToast'));
  }
  resetViewBtn.addEventListener('click', resetView);

  function showToast(msg){
    stageToast.textContent = msg;
    stageToast.classList.add('show');
    setTimeout(()=>stageToast.classList.remove('show'), 2400);
  }

  // Spine 4.3 moved a bone's computed world transform (worldX/worldY/a/b/c/d) off the Bone
  // object itself and onto a separate `appliedPose` object (Bone -> BonePose). Older/newer
  // runtime builds may still expose worldX/worldY directly on the bone, so this helper checks
  // both places instead of assuming one. Without this, bone.worldX read straight off a 4.3
  // Bone is `undefined`, which silently drops every interactive bone from hit-testing (the
  // Number.isFinite(...) checks throughout this file reject it) — that's what made taps/drags
  // stop doing anything at all.
  // Same 4.3 refactor as boneWorldPos above, but for the *local* pose (x, y, rotation, scaleX,
  // scaleY) that animations and this file's own procedural effects write to every frame. In
  // 4.3 those moved from the Bone object to Bone.pose. Writing straight to bone.x/bone.rotation/
  // etc. on a 4.3 bone silently creates unused stray properties — the actual pose never changes,
  // so the cheek's spring-back drag and the pat/pet squash-and-wobble effects render as if
  // nothing happened even once a tap/drag is correctly detected.
  function bonePose(bone){
    return (bone && bone.pose) ? bone.pose : bone;
  }

  // Takes a plain-object copy of a bone's *local* pose (x, y, rotation, scaleX, scaleY, shearX,
  // shearY) — the same fields bonePose() exposes above. Used to remember a "known good" local
  // pose for a physics-constraint bone before updateWorldTransform() runs, so it can be forced
  // back afterward if something still wrote into it despite the constraint being "muted" (see
  // the [debug][mute-verify] note in renderLoop for why muting alone wasn't enough).
  function snapshotBonePose(bone){
    const pose = bonePose(bone);
    if (!pose) return null;
    return {
      x: pose.x, y: pose.y, rotation: pose.rotation,
      scaleX: pose.scaleX, scaleY: pose.scaleY,
      shearX: pose.shearX, shearY: pose.shearY
    };
  }

  // Inverse of snapshotBonePose: writes a previously-captured local pose back onto the bone,
  // undoing whatever wrote into bone.pose in between the snapshot and this call.
  function restoreBonePose(bone, snap){
    if (!bone || !snap) return;
    const pose = bonePose(bone);
    if (!pose) return;
    pose.x = snap.x; pose.y = snap.y; pose.rotation = snap.rotation;
    pose.scaleX = snap.scaleX; pose.scaleY = snap.scaleY;
    pose.shearX = snap.shearX; pose.shearY = snap.shearY;
  }

  // Runtime bug workaround (spine-webgl 4.3.13 vs. editor-exported 4.3.26 data): the new
  // "property-mapped" transform constraints (atama/cheek -> head/face/backhead/hear) parse their
  // structure (source/bones/properties) correctly, but this runtime build's math for this
  // constraint type is unstable once its mix is above 0 — confirmed on video to blow the target
  // bone up to several times its normal size instead of a subtle nudge. Because of that, the
  // design decision (see applyManualFollow/FOLLOW_MAP below) is to leave these specific
  // constraints permanently muted (mix forced to 0, a harmless no-op) and reproduce the intended
  // "head/cheek following" visual entirely in our own manual JS code instead, where it's safe.
  //
  // 파츠 뜯어짐(스튜디오에서 캐릭터를 옮긴 뒤 pet_idle/pull_idle 재생 시 중심에서 먼 파츠일수록 심해지는 증상)의
  // 실제 원인: 이 뮤트가 로드 시 self-test 블록 안에서 "fixTransformConstraintMixes()"라는, 이름과 반대로
  // mix를 원래 데이터 값(0이 아닌 값, 예: 0.1)으로 "복구"하는 함수를 통해 딱 한 번만 걸렸었고, 그 뒤로는
  // 다시 0으로 되돌리는 코드가 전혀 없었음. 즉 로드 이후 세션 내내 이 망가진 4.3 제약 계산이 켜진 채로
  // 돌아가고 있었던 것 — 대부분의 애니메이션에서는 atama/cheek가 거의 안 움직여서 티가 안 났지만,
  // atama/cheek를 크게 움직이는 pet_idle/pull_idle 같은 모션이 재생되면 그 큰 소스 이동량이 불안정한
  // 제약 계산에 그대로 들어가 스케일/회전이 폭주했고, 그 결과가 제약 대상 본(head/face/backhead/hear)의
  // 로컬 원점에서 먼 정점일수록(그리고 스튜디오의 후처리 회전 슬라이더가 그 폭주한 월드 좌표를 다시 한 번
  // 중심점 기준으로 회전시키면서) 더 크게 벌어져 보였던 것.
  //
  // 고침: 아래 muteHeadFollowConstraints()를 매 프레임(renderLoop, 스튜디오/단일 뷰어 모두) 애니메이션
  // 적용 직후·updateWorldTransform() 직전에 호출해, 어떤 애니메이션 클립이 이 제약들의 mix를 얼마로
  // 키프레임하든 상관없이 매 프레임 강제로 0(뮤트)으로 되돌린다. 로드 시점 self-test도 이제 이 함수를
  // 통해 뮤트 상태를 명시적으로 복구하도록 정리함 — 더 이상 "복구 후 방치"로 몰래 켜진 채 남지 않는다.
  const HEAD_FOLLOW_CONSTRAINT_NAMES = [];
  // Kept only for the load-time self-test's own before/after diagnostic (it needs to briefly turn
  // the native mix ON to prove the constraint *can* move bones at all) — never call this anywhere
  // else. Every real render path uses muteHeadFollowConstraints() below instead.
  function fixTransformConstraintMixes(skeleton){
    const all = [].concat(
      Array.isArray(skeleton.constraints) ? skeleton.constraints : [],
      Array.isArray(skeleton.transformConstraints) ? skeleton.transformConstraints : []
    );
    all.forEach(c => {
      if (!c || !c.data || !HEAD_FOLLOW_CONSTRAINT_NAMES.includes(c.data.name)) return;
      const correctMixX = Number.isFinite(c.data.mixX) ? c.data.mixX : 1;
      const correctMixY = Number.isFinite(c.data.mixY) ? c.data.mixY : 1;
      if (c.pose){ c.pose.mixX = correctMixX; c.pose.mixY = correctMixY; }
      c.mixX = correctMixX;
      c.mixY = correctMixY;
      if (c.appliedPose){ c.appliedPose.mixX = correctMixX; c.appliedPose.mixY = correctMixY; }
    });
  }
  // THE ACTUAL FIX: forces every head/cheek-follow transform constraint's mix (every mix* field
  // this runtime build might expose — mixX/mixY plus the spec's mixRotate/mixScaleX/mixScaleY/
  // mixShearY, zeroed defensively in case any of those are also live on this build) down to 0,
  // on whichever of pose/live/appliedPose fields exist. Call this every frame, right after
  // animationState.apply() and before updateWorldTransform(), so a clip that keyframes these
  // constraints' mix (pet_idle/pull_idle keyframe atama/cheek heavily, which is exactly the input
  // that fed the blow-up) never gets a chance to leave a non-zero mix in place for even one frame.
  const HEAD_FOLLOW_MIX_FIELDS = ['mixX','mixY','mixRotate','mixScaleX','mixScaleY','mixShearY'];
  function muteHeadFollowConstraints(skeleton){
    const all = [].concat(
      Array.isArray(skeleton.constraints) ? skeleton.constraints : [],
      Array.isArray(skeleton.transformConstraints) ? skeleton.transformConstraints : []
    );
    all.forEach(c => {
      if (!c || !c.data || !HEAD_FOLLOW_CONSTRAINT_NAMES.includes(c.data.name)) return;
      HEAD_FOLLOW_MIX_FIELDS.forEach(field => {
        if (c.pose && field in c.pose) c.pose[field] = 0;
        if (field in c) c[field] = 0;
        if (c.appliedPose && field in c.appliedPose) c.appliedPose[field] = 0;
      });
    });
  }

  // Finds every PhysicsConstraint (jiggle-bone spring) on a skeleton, regardless of which array
  // shape this runtime build exposes them under (some builds group constraints by type under
  // skeleton.physicsConstraints, others only expose a single mixed skeleton.constraints list —
  // same ambiguity already handled for transform constraints above). Originally detected by
  // duck-typing on "inertia" (a field that's supposed to only exist on PhysicsConstraintData) —
  // but the [debug][all-constraint-classes] dump proved that check silently matched 0 constraints
  // on this pinned build even though real PhysicsConstraint instances (this rig's back/front/side
  // hair sway, skirt sway, ear sway — confirmed by name: backhairL2/L3/L4, backhairR2/R3/R4,
  // backhairSR2-5, skirtFA2 etc., all logged with ctor "_PhysicsConstraint" / dataCtor
  // "PhysicsConstraintData") are very much present and were the actual, confirmed cause of the
  // "뒷머리 뜯어짐" (back hair tearing away) symptom during a fast body-drag. Matching on the
  // actual runtime class name (seen directly in that dump) instead of a guessed field name is
  // reliable regardless of which internal fields this build's PhysicsConstraintData does or
  // doesn't expose.
  function getPhysicsConstraints(skeleton){
    const all = [].concat(
      Array.isArray(skeleton.physicsConstraints) ? skeleton.physicsConstraints : [],
      Array.isArray(skeleton.constraints) ? skeleton.constraints : []
    );
    const seen = new Set();
    return all.filter(pc => {
      if (!pc || seen.has(pc)) return false;
      const ctorName = (pc.constructor && pc.constructor.name) || '';
      const dataCtorName = (pc.data && pc.data.constructor && pc.data.constructor.name) || '';
      if (!/physicsconstraint/i.test(ctorName) && !/physicsconstraint/i.test(dataCtorName)) return false;
      seen.add(pc);
      return true;
    });
  }

  // Forcibly silences (mix=0) every physics constraint on a skeleton, or restores each one's
  // original mix. Used as belt-and-suspenders alongside spine.Physics.reset while a character is
  // being manually body-dragged in the studio (see c.__slotDragActive) — Physics.reset *should*
  // already be enough to stop a jiggle bone (back hair, ears, tail) from lagging behind a
  // teleport-speed move, but this rig's pinned spine-webgl 4.3.13 build has already shown one
  // confirmed case (fixTransformConstraintMixes above) of silently not honoring constraint state
  // the way the spec says it should. Zeroing the mix directly doesn't rely on Physics.reset
  // working correctly at all — a muted constraint contributes nothing regardless of whether the
  // runtime's internal reset bookkeeping is trustworthy.
  // THE ACTUAL ROOT CAUSE of watchBoneIncludedInRecompute always coming back false in the
  // [debug][mute-verify] log, even after everything above: per Spine 4.3's own class docs,
  // `PhysicsConstraint.bone` (and `.bones`) is typed as **BonePose**, not **Bone**. A BonePose is
  // just a bag of local pose fields (x/y/rotation/scaleX/...) — it carries no `.parent`/`.children`
  // hierarchy at all; that hierarchy only exists on the real Bone object, which in turn *owns* a
  // BonePose via its own `.pose`/`.appliedPose` fields. getPhysicsConstraintBones() was pushing
  // pc.bone straight into pcBoneSet and later doing `pcBoneSet.has(p)` while walking real Bone
  // parent chains in getBonesNeedingRigidRecompute() — comparing BonePose objects against Bone
  // objects can never match, so that walk silently found nothing above pc.bone itself no matter how
  // correct its own logic was. (pcDump's `hasBone:true` never caught this because it only checks
  // `!!pc.bone`, which is true for a valid BonePose too.) resolveOwningBone() below undoes exactly
  // that: given a BonePose, find the real Bone in skeleton.bones whose `.pose` or `.appliedPose`
  // is that exact object, and return the Bone instead.
  function resolveOwningBone(skeleton, poseOrBone){
    if (!poseOrBone) return null;
    // Already a real Bone (has hierarchy fields) — nothing to resolve.
    if ('parent' in poseOrBone && 'children' in poseOrBone) return poseOrBone;
    const bones = skeleton.bones || [];
    for (let i = 0; i < bones.length; i++){
      const b = bones[i];
      if (b.pose === poseOrBone || b.appliedPose === poseOrBone) return b;
    }
    // Fallback: some rigs name the constraint identically to the bone it drives (confirmed for
    // this rig's hair/skirt constraints — see getPhysicsConstraints comment above). Only reached
    // if the identity match above fails for some reason.
    return null;
  }

  // Returns the actual Bone object(s) each physics constraint drives. Spec says one bone per
  // PhysicsConstraint (`.bone`), but this build has already deviated from spec once
  // (fixTransformConstraintMixes) so `.bones` is also checked defensively. Both are BonePose
  // references (see resolveOwningBone above) and are resolved to real Bone objects here so every
  // caller downstream (parent-chain walks, recomputeBoneWorldRigid) gets what it actually needs.
  function getPhysicsConstraintBones(skeleton){
    const bones = [];
    getPhysicsConstraints(skeleton).forEach(pc => {
      if (pc.bone){
        const b = resolveOwningBone(skeleton, pc.bone) || (pc.data && skeleton.findBone(pc.data.name));
        if (b) bones.push(b);
      }
      if (Array.isArray(pc.bones)){
        pc.bones.forEach(pb => {
          const b = resolveOwningBone(skeleton, pb);
          if (b) bones.push(b);
        });
      }
    });
    return bones.filter((b, i, arr) => b && arr.indexOf(b) === i);
  }

  // Expands getPhysicsConstraintBones() to include every DESCENDANT of a physics-constraint bone
  // too, not just the constrained bone itself. Confirmed via [debug][mute-verify] pcDump: a bone
  // like backhairSR5 has no physics constraint of its own at all (it's missing entirely from the
  // 37 constraints found — only backhairSR2/3/4 have one) — it's a plain FK child hanging off
  // backhairSR4. recomputeBoneWorldRigid() only ever ran on backhairSR4 itself, so SR4 tracked the
  // body correctly while SR5 (never recomputed) was left exactly where it was in world space
  // before the drag started — the body moves on, SR5 doesn't, and it visibly tears away. Every
  // plain child several levels deep below a physics bone has the same problem, so this walks the
  // full skeleton and pulls in anything whose parent chain passes through a physics bone.
  function getBonesNeedingRigidRecompute(skeleton){
    const pcBones = getPhysicsConstraintBones(skeleton);
    const pcBoneSet = new Set(pcBones);
    const result = new Set(pcBones);
    (skeleton.bones || []).forEach(b => {
      if (result.has(b)) return;
      let p = b.parent;
      while (p){
        if (pcBoneSet.has(p)){ result.add(b); break; }
        p = p.parent;
      }
    });
    return Array.from(result);
  }

  function setPhysicsConstraintsMuted(skeleton, muted){
    getPhysicsConstraints(skeleton).forEach(pc => {
      if (muted){
        // v3: forcing mix to 0 (both pc.mix/pose.mix/appliedPose.mix AND pc.data.mix) was directly
        // verified via [debug][mute-verify] to have ZERO effect on this build — the watched hair
        // bone kept drifting exactly the same amount whether mix read back as 0 or not. That means
        // whatever this build's constraint update actually does, it isn't gating on mix at all for
        // translation. Instead of guessing another field, intercept execution itself: find
        // whichever per-frame method this object exposes (spine's Updatable interface is normally
        // `.update(physics)`, but check a couple of plausible alternates too) and swap it for a
        // no-op while muted, so the constraint simply never runs this frame — the bone is left
        // exactly where the previous bone in the update chain (its FK parent) put it. Restored to
        // the original function afterward.
        if (!pc.__mutedMethodName){
          const methodName = ['update','apply','applyConstraint'].find(m => typeof pc[m] === 'function');
          if (methodName){
            pc.__mutedMethodName = methodName;
            pc.__origMethod = pc[methodName];
            pc[methodName] = function(){};
          }
        }
        if (pc.__savedMix === undefined) pc.__savedMix = (pc.mix !== undefined ? pc.mix : 1);
        if (pc.data && pc.__savedDataMix === undefined) pc.__savedDataMix = pc.data.mix;
        pc.mix = 0;
        if (pc.pose) pc.pose.mix = 0;
        if (pc.appliedPose) pc.appliedPose.mix = 0;
        if (pc.data) pc.data.mix = 0;
      } else {
        if (pc.__mutedMethodName){
          pc[pc.__mutedMethodName] = pc.__origMethod;
          delete pc.__mutedMethodName;
          delete pc.__origMethod;
        }
        if (pc.__savedMix !== undefined){
          pc.mix = pc.__savedMix;
          if (pc.pose) pc.pose.mix = pc.__savedMix;
          if (pc.appliedPose) pc.appliedPose.mix = pc.__savedMix;
          delete pc.__savedMix;
        }
        if (pc.data && pc.__savedDataMix !== undefined){
          pc.data.mix = pc.__savedDataMix;
          delete pc.__savedDataMix;
        }
      }
    });
  }

  function boneWorldPos(bone){
    if (!bone) return null;
    const src = (bone.appliedPose && Number.isFinite(bone.appliedPose.worldX)) ? bone.appliedPose : bone;
    if (!Number.isFinite(src.worldX) || !Number.isFinite(src.worldY)) return null;
    return {x: src.worldX, y: src.worldY};
  }

  // Rig "handle" bones (drag anchors, IK targets, animator-only control bones, etc.) often sit
  // at a pivot that's offset from the sprite the viewer actually sees — e.g. a head bone whose
  // origin is up near the top of the hair rather than centered on the face. Hint dots and hit
  // tests anchored to the raw bone pivot then land visibly off the character. This instead
  // averages the world-space vertex positions of any attachment(s) whose slot is bound directly
  // to the bone, giving the center of what's actually drawn there. Falls back to the plain bone
  // pivot (boneWorldPos) if the bone has no directly-attached visible attachment, or if anything
  // about vertex computation goes wrong — never worse than the old behavior, only better.
  function boneVisualCenter(c, bone){
    const fallback = boneWorldPos(bone);
    if (!bone || !c || !c.skeleton || !c.skeleton.slots) return fallback;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity, found=false;
    c.skeleton.slots.forEach(slot=>{
      if (slot.bone !== bone) return;
      const att = slot.getAttachment ? slot.getAttachment() : slot.attachment;
      if (!att || !att.computeWorldVertices) return;
      try{
        let verts = null;
        if (typeof att.worldVerticesLength === 'number'){
          // VertexAttachment family (mesh, bounding box, path, clipping) — variable-length vertex list.
          const n = att.worldVerticesLength;
          verts = new Float32Array(n);
          att.computeWorldVertices(slot, 0, n, verts, 0, 2);
        } else {
          // RegionAttachment — always exactly 4 corners (8 floats).
          verts = new Float32Array(8);
          att.computeWorldVertices(slot, verts, 0, 2);
        }
        for (let i=0;i<verts.length;i+=2){
          const x = verts[i], y = verts[i+1];
          if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
          minX=Math.min(minX,x); maxX=Math.max(maxX,x);
          minY=Math.min(minY,y); maxY=Math.max(maxY,y);
          found = true;
        }
      } catch(e){ /* leave found=false, fall through to bone pivot below */ }
    });
    if (!found) return fallback;
    return {x:(minX+maxX)/2, y:(minY+maxY)/2};
  }

  // Same 4.3 "moved to appliedPose" story as boneWorldPos, but for the bone's world 2x2 matrix
  // (a/b/c/d). The cheek-drag direction fix below reads a *parent* bone's world matrix to convert
  // a screen-space drag into the correct local direction — on a 4.3 runtime, bone.a/b/c/d are
  // undefined (they live on bone.appliedPose.a/b/c/d instead), so the determinant came out NaN,
  // the "> 1e-9" check silently failed, and the code fell back to using the raw, un-rotated screen
  // delta as if it were the local delta. That fallback is exactly what made a left drag come out as
  // a downward pull and an up drag come out as a leftward pull: this rig's parent chain carries
  // roughly a 90°+ rotation, so skipping the correction rotates every drag by about that much.
  function boneWorldMatrix(bone){
    if (!bone) return null;
    const src = (bone.appliedPose && Number.isFinite(bone.appliedPose.a)) ? bone.appliedPose : bone;
    if (!Number.isFinite(src.a) || !Number.isFinite(src.b) || !Number.isFinite(src.c) || !Number.isFinite(src.d)) return null;
    return {a: src.a, b: src.b, c: src.c, d: src.d};
  }

  function degToRad(deg){ return deg * Math.PI / 180; }
  function radToDeg(rad){ return rad * 180 / Math.PI; }

  // Builds a bone's local 2x2 matrix (rotation+scale+shear, no translation) from pose values in
  // degrees, using the exact same formula Spine's own Bone.updateWorldTransform uses.
  function localMatrixFromPose(rotation, scaleX, scaleY, shearX, shearY){
    const rotationY = rotation + 90 + shearY;
    return {
      a: Math.cos(degToRad(rotation + shearX)) * scaleX,
      b: Math.cos(degToRad(rotationY)) * scaleY,
      c: Math.sin(degToRad(rotation + shearX)) * scaleX,
      d: Math.sin(degToRad(rotationY)) * scaleY
    };
  }

  // How many parents deep a bone sits below the skeleton root. Used to sort a batch of bones so
  // parents are always recomputed before their children — see recomputeBoneWorldRigid below, which
  // needs the parent's world matrix to already be up to date.
  function boneDepth(bone){
    let d = 0, b = bone;
    while (b && b.parent){ d++; b = b.parent; }
    return d;
  }

  // THE ACTUAL FIX for the console flooding with "Cannot read properties of undefined (reading
  // '_update')" out of BonePose.ts, which was crashing renderLoop every single frame during a
  // studio body-drag (and, worse, meant the "뒷머리 뜯어짐" fix below it never actually ran, so the
  // hair-tearing bug it was trying to fix was never actually fixed either). The previous approach
  // called a jiggle bone's own b.updateWorldTransform() directly to make it rigidly follow its
  // already-updated parent. That's a real, public Bone method — but on this pinned spine-webgl
  // 4.3.13 build it internally reaches into some per-bone physics/local-pose object that, per the
  // comment on the caller below, is apparently ONLY ever initialized by the owning
  // PhysicsConstraint's own update() call — never by a bare, standalone Bone.updateWorldTransform()
  // invocation. Calling it outside that path hits `something._update()` where `something` is that
  // never-initialized object, hence the crash.
  // This sidesteps the runtime method entirely and recomputes the bone's world transform by hand,
  // using the exact same formula (child local matrix composed with parent world matrix, then
  // translated by the parent's world position) that Bone.updateWorldTransform is supposed to run —
  // the same formula localMatrixFromPose/decomposeWorldToLocal already encode elsewhere in this
  // file for the same reason. Writes the result to both the bone itself and bone.appliedPose (when
  // present) so it's picked up regardless of which one the mesh renderer and this file's own
  // boneWorldPos/boneWorldMatrix helpers read from on this build.
  // Pure-math half of recomputeBoneWorldRigid: returns what this bone's world transform WOULD be
