  // under plain FK (its own current local pose composed onto its parent's current world
  // transform), without writing anything. Split out so the constraint-blow-up guard below can
  // compare a constraint's actual result against the plain-FK answer before deciding whether to
  // overwrite it.
  function computeBoneWorldRigid(bone){
    if (!bone || !bone.parent) return null;
    const pose = bonePose(bone);
    const parentMatrix = boneWorldMatrix(bone.parent);
    const parentPos = boneWorldPos(bone.parent);
    if (!pose || !parentMatrix || !parentPos) return null;
    const rotation = pose.rotation || 0;
    const scaleX = Number.isFinite(pose.scaleX) ? pose.scaleX : 1;
    const scaleY = Number.isFinite(pose.scaleY) ? pose.scaleY : 1;
    const shearX = pose.shearX || 0;
    const shearY = pose.shearY || 0;
    const local = localMatrixFromPose(rotation, scaleX, scaleY, shearX, shearY);
    const localX = pose.x || 0, localY = pose.y || 0;
    const out = {
      worldX: parentMatrix.a*localX + parentMatrix.b*localY + parentPos.x,
      worldY: parentMatrix.c*localX + parentMatrix.d*localY + parentPos.y,
      a: parentMatrix.a*local.a + parentMatrix.b*local.c,
      b: parentMatrix.a*local.b + parentMatrix.b*local.d,
      c: parentMatrix.c*local.a + parentMatrix.d*local.c,
      d: parentMatrix.c*local.b + parentMatrix.d*local.d
    };
    if (!Number.isFinite(out.worldX) || !Number.isFinite(out.worldY) ||
        !Number.isFinite(out.a) || !Number.isFinite(out.b) ||
        !Number.isFinite(out.c) || !Number.isFinite(out.d)) return null;
    return out;
  }

  // Writes a world transform onto both the bone itself and bone.appliedPose (when present), so
  // it's picked up regardless of which one the mesh renderer and this file's own boneWorldPos/
  // boneWorldMatrix helpers read from on this build.
  function writeBoneWorld(bone, w){
    if (!bone || !w) return;
    [bone, bone.appliedPose].forEach(target=>{
      if (!target) return;
      target.worldX = w.worldX; target.worldY = w.worldY;
      target.a = w.a; target.b = w.b; target.c = w.c; target.d = w.d;
    });
  }

  function recomputeBoneWorldRigid(bone){
    writeBoneWorld(bone, computeBoneWorldRigid(bone));
  }

  // ---------------------------------------------------------------------------------------
  // "파츠 분리" (parts tearing off the body when a motion that drives transform constraints is
  // played, most visibly in the studio) — the guard below.
  //
  // Background: this pinned spine-webgl 4.3.13 build's math for 4.3's new property-mapped
  // transform constraints is unstable once the constraint's mix goes above 0 (documented in
  // detail on muteHeadFollowConstraints above — it was caught on video blowing a target bone up
  // to several times its size instead of nudging it). The old workaround was to mute those
  // constraints outright, but that also threw away the follow motion the rig's author actually
  // authored in the editor, so HEAD_FOLLOW_CONSTRAINT_NAMES is now intentionally empty and the
  // constraints run live — which brings the blow-up back on exactly the clips that drive them
  // hard (pet_idle/pull_idle and friends).
  //
  // Rather than choosing between "constraint on, sometimes explodes" and "constraint off, no
  // follow at all", this catches the explosion itself: a transform constraint is only ever
  // supposed to nudge its target bone slightly away from where plain FK would put it. So after
  // updateWorldTransform() has run every constraint, each constrained bone's result is compared
  // against its own plain-FK answer (computeBoneWorldRigid above). Small differences — the real,
  // intended follow — are left completely untouched. Differences that are physically impossible
  // for a subtle follow (bone flung a large fraction of the rig's own size away, or its world
  // scale multiplied/collapsed) are discarded for that frame and replaced by the plain-FK
  // transform, which is exactly "this part stays attached where its parent says it should be".
  //
  // Bones are processed parents-first and the check includes every DESCENDANT of a constrained
  // bone, because a blown-up parent hands its garbage world matrix down the chain: once the
  // parent is snapped back to FK, each child's inherited (still blown-up) transform now differs
  // wildly from its own freshly-computed FK answer, so the correction cascades down the rest of
  // the limb/hair chain on the same pass.
  const CONSTRAINT_GUARD_SCALE_MAX = 1.8;   // world scale may not exceed the FK scale by more than this
  const CONSTRAINT_GUARD_SCALE_MIN = 0.55;  // ...nor collapse below it by more than this
  const CONSTRAINT_GUARD_OFFSET_RATIO = 0.15; // ...nor move more than this fraction of the rig's own size
  const CONSTRAINT_GUARD_MIN_OFFSET = 30;   // floor for the above, for very small rigs

  // Every bone a transform constraint targets, plus all of their descendants, sorted parents
  // first. Cached on the skeleton — the bone hierarchy and constraint list never change after
  // load. Matches on the runtime class name (same approach as getPhysicsConstraints above)
  // instead of on constraint names, so it covers any rig, not just this one's atama/cheek setup.
  function getConstraintGuardBones(skeleton){
    if (skeleton.__constraintGuardBones) return skeleton.__constraintGuardBones;
    const all = [].concat(
      Array.isArray(skeleton.transformConstraints) ? skeleton.transformConstraints : [],
      Array.isArray(skeleton.constraints) ? skeleton.constraints : []
    );
    const seeds = new Set();
    all.forEach(tc => {
      if (!tc) return;
      const ctorName = (tc.constructor && tc.constructor.name) || '';
      const dataCtorName = (tc.data && tc.data.constructor && tc.data.constructor.name) || '';
      if (!/transformconstraint/i.test(ctorName) && !/transformconstraint/i.test(dataCtorName)) return;
      // Constrained bones show up either as plain Bones or as BonePose wrappers with a .bone
      // back-reference, depending on the build — same ambiguity the load-time self-test already
      // has to deal with when it prints constraint bone names.
      const list = [].concat(Array.isArray(tc.bones) ? tc.bones : [], tc.bone ? [tc.bone] : []);
      list.forEach(entry => {
        const bone = (entry && entry.bone) ? entry.bone : entry;
        if (bone && (bone.data || bone.parent)) seeds.add(bone);
      });
    });
    const guarded = new Set(seeds);
    (skeleton.bones || []).forEach(b => {
      let p = b.parent;
      while (p){
        if (seeds.has(p)){ guarded.add(b); break; }
        p = p.parent;
      }
    });
    const sorted = Array.from(guarded).sort((a, b) => boneDepth(a) - boneDepth(b));
    skeleton.__constraintGuardBones = sorted;
    return sorted;
  }

  // The rig's own on-stage size, used to scale the "how far is too far" threshold so it means the
  // same thing on a large character as on a small one, and stays correct as the studio size
  // slider changes the skeleton's scale.
  function constraintGuardReferenceSize(c){
    // __studioExpectedW/H are the character's size *at its current studio scale*, so they're the
    // right reference there — but they stick around on the character object after leaving the
    // studio, where the skeleton is back at its own scale, so they're only trusted in studio mode.
    const fromStudio = mode === 'studio' ? Math.max(c.__studioExpectedW || 0, c.__studioExpectedH || 0) : 0;
    if (fromStudio > 1) return fromStudio;
    const b = c.bounds;
    const fromBounds = b ? Math.max(b.w || 0, b.h || 0) : 0;
    return fromBounds > 1 ? fromBounds : 400;
  }

  // Call once per character per frame, right AFTER updateWorldTransform() (so every constraint
  // has had its say) and BEFORE anything that reads the final pose — drawing, hit anchors, or the
  // studio's rotation post-process.
  // Puts back the world transforms the studio's rotation post-process overwrote for this frame's
  // draw. Safe to call on a character that wasn't rotated (no-op) and on every frame regardless
  // of whether the rotation slider is at 0.
  function restoreStudioRotation(c){
    if (!c || !c.__rotationApplied) return;
    c.__rotationApplied = false;
    const restore = c.__rotationRestore;
    if (!restore) return;
    for (let i = 0; i < restore.length; i++){
      const r = restore[i];
      if (!r || !r.target) continue;
      r.target.worldX = r.worldX; r.target.worldY = r.worldY;
      r.target.a = r.a; r.target.b = r.b; r.target.c = r.c; r.target.d = r.d;
    }
    restore.length = 0;
  }

  function guardConstraintBlowups(c){
    const skeleton = c && c.skeleton;
    if (!skeleton) return;
    const bones = getConstraintGuardBones(skeleton);
    if (!bones.length) return;
    const maxOffset = Math.max(CONSTRAINT_GUARD_MIN_OFFSET, constraintGuardReferenceSize(c) * CONSTRAINT_GUARD_OFFSET_RATIO);
    let corrected = 0;
    bones.forEach(bone => {
      const fk = computeBoneWorldRigid(bone);
      if (!fk) return;
      const src = (bone.appliedPose && Number.isFinite(bone.appliedPose.worldX)) ? bone.appliedPose : bone;
      const live = {worldX: src.worldX, worldY: src.worldY, a: src.a, b: src.b, c: src.c, d: src.d};
      const liveFinite = Object.keys(live).every(k => Number.isFinite(live[k]));
      let bad = !liveFinite;
      if (!bad){
        if (Math.hypot(live.worldX - fk.worldX, live.worldY - fk.worldY) > maxOffset) bad = true;
      }
      if (!bad){
        // Compare the length of each world-matrix column (i.e. the bone's effective world scale
        // along its own local x and y axes) against the FK answer. A runaway constraint shows up
        // here as a multiplied (or collapsed) column long before it looks subtle on screen.
        const pairs = [[Math.hypot(live.a, live.c), Math.hypot(fk.a, fk.c)], [Math.hypot(live.b, live.d), Math.hypot(fk.b, fk.d)]];
        for (const [liveLen, fkLen] of pairs){
          if (!(fkLen > 1e-6)) continue;
          const ratio = liveLen / fkLen;
          if (ratio > CONSTRAINT_GUARD_SCALE_MAX || ratio < CONSTRAINT_GUARD_SCALE_MIN){ bad = true; break; }
        }
      }
      if (!bad) return;
      writeBoneWorld(bone, fk);
      corrected++;
    });
    if (corrected && !c.__constraintGuardLogged){
      c.__constraintGuardLogged = true;
      console.warn('[constraint-guard]', c.id, '— snapped', corrected, 'bone(s) back to FK on this frame (runaway transform constraint). Threshold:', Math.round(maxOffset), 'units. Logged once per character.');
    }
  }

  // Inverse of the above, composed with a parent: given the world 2x2 matrix we *want* this bone
  // to have, and its parent's current world 2x2 matrix, returns the local rotation/scaleX/scaleY/
  // shearY (shearX forced to 0) that would reproduce it. This mirrors Spine's own
  // Bone.updateAppliedTransform (the "world transform was modified directly, recover local values"
  // case) and is what lets the head-squash effect below be specified in world/screen space and
  // still land as a plain rotation+scale on this bone, regardless of how the rig's parent chain is
  // rotated.
  function decomposeWorldToLocal(wa, wb, wc, wd, pa, pb, pc, pd){
    const det = pa*pd - pb*pc;
    if (Math.abs(det) < 1e-9) return null;
    const pid = 1/det;
    const ia = pid*pd, id = pid*pa, ib = pid*pb, ic = pid*pc;
    const ra = ia*wa - ib*wc;
    const rb = ia*wb - ib*wd;
    const rc = id*wc - ic*wa;
    const rd = id*wd - ic*wb;
    const scaleX = Math.sqrt(ra*ra + rc*rc);
    if (scaleX <= 0.0001) return null; // degenerate (collapsed to a line) — caller should skip
    // scaleY/shearY come from the *second* local column (rb, rd) directly, not from the
    // determinant. The old `localDet/scaleX` + `atan2(ra*rb+rc*rd, localDet)` pair only agrees
    // with the true column-2 length/angle when shearY is 0 — once a real shear is needed to
    // express the target world matrix (which is exactly the case here, since this rig's ~100°
    // parent rotation means a pure horizontal/vertical screen-space squash needs shear once
    // converted to local space), that pair returns a shrunken scaleY and a sign-flipped shearY.
    // That's what turned the head-tap squash into a diagonal press instead of a flat one.
    const rotation = Math.atan2(rc, ra);
    const scaleY = Math.sqrt(rb*rb + rd*rd);
    const angle2 = Math.atan2(rd, rb);
    const shearY = angle2 - rotation - Math.PI/2;
    return {
      rotation: radToDeg(rotation),
      scaleX,
      scaleY,
      shearX: 0,
      shearY: radToDeg(shearY)
    };
  }

  function worldToScreenCSS(wx, wy){
    const camera = renderer.camera;
    const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
    const scaleX = cssW / camera.viewportWidth;
    const scaleY = cssH / camera.viewportHeight;
    return {
      x: cssW/2 + (wx - camera.position.x) * scaleX,
      y: cssH/2 - (wy - camera.position.y) * scaleY
    };
  }

  // Per-interaction-type hit radius, as a fraction of the character's *width* rather than
  // Math.max(width, height). Full-body rigs (this one included) are much taller than they are
  // wide once legs/tail are counted, so sizing the radius off the height produced a hit circle
  // far bigger than the actual head — big enough to swallow the shoulders, hair, and even a hand
  // held up near the face. That's what was causing taps meant for the hand/hair/chest area to
  // register on 'head' or 'cheek' anyway. 'cheek' also gets a noticeably smaller radius than
  // 'head' since it's a small sub-feature sitting almost on top of the head bone; without that,
  // the two circles overlapped almost entirely and a pixel of mouse movement could flip which
  // one "won", making the drag/tap outcome feel random.
  const HIT_RADIUS_FACTOR = { pat: 0.26, pull: 0.13 };

  // Refreshes hitAnchors for every interactive bone that's currently "at rest", and leaves the
  // rest untouched. A 'pat' bone is at rest when it has no procedural pat effect running and no
  // dedicated reaction clip in flight (c.reactionBusy); a 'pull' bone is at rest when it isn't
  // actively being dragged. Called once per frame from renderLoop, after world transforms are
  // computed, so the anchor is always the most recent settled position rather than a stale one.
  function updateHitAnchors(c){
    if (!c.hitAnchors) c.hitAnchors = new Map();
    c.interactiveBones.forEach(ib=>{
      const bone = c.skeleton.findBone(ib.name);
      if (!bone) return;
      // While the bone is actively being dragged by real position (off.dragging — true for
      // cheek's "pull" the whole time it's held, and now also true for atama while a "pet" drag
      // is in progress, see the pointermove handler), the hint dot should track the bone's live
      // position 1:1 so it doesn't visibly lag behind/detach from the art while the user is
      // actively holding and moving it.
      const off = c.offsets.get(ib.name);
      const isDraggingPosition = !!(off && off.dragging);
      let busy;
      if (isDraggingPosition){
        busy = false;
      } else if (ib.type === 'pull'){
        busy = false;
      } else {
        // Not a live position-drag right now — freeze during the tap ("hit") squash reaction only,
        // so a quick double-tap's hit-circle doesn't jump while the squash dip plays.
        busy = c.reactionBusy || c.patEffects.has(ib.name) || c.activeHolds.has(ib.name);
      }
      if (busy) return;
      const world = boneVisualCenter(c, bone);
      if (world) c.hitAnchors.set(ib.name, world);
    });
  }

  function findHitBone(c, clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const scaleX = canvas.clientWidth / renderer.camera.viewportWidth;
    let best = null, bestScore = 1; // score = distance / that bone's own radius; must be < 1 to count
    c.interactiveBones.forEach(ib=>{
      const bone = c.skeleton.findBone(ib.name);
      const world = c.hitAnchors.get(ib.name) || boneVisualCenter(c, bone);
      if (!world) return;
      const factor = HIT_RADIUS_FACTOR[ib.type] ?? 0.08;
      const screenRadius = c.bounds.w * factor * scaleX;
      if (screenRadius <= 0) return;
      const pos = worldToScreenCSS(world.x, world.y);
      const d = Math.hypot(pos.x - px, pos.y - py);
      const score = d / screenRadius;
      if (score < bestScore){ bestScore = score; best = ib; }
    });
    return best;
  }

  // Mouse-wheel zoom (desktop). preventDefault stops the page itself from scrolling/zooming
  // while the cursor is over the stage.
  canvas.addEventListener('wheel', (e)=>{
    if (!renderer) return;
    if (mode === 'studio'){
      if (!studioCamera.baseCamera) return;
      e.preventDefault();
      // Background and characters zoom together here (studioZoomBothAt), not just the camera —
      // see that function's comment for how the two independently-clamped zoom ranges stay synced.
      studioZoomBothAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015));
      return;
    }
    const c = loadedCharacters.get(activeId);
    if (!c) return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    zoomAt(c, e.clientX, e.clientY, factor);
  }, {passive:false});

  canvas.addEventListener('pointerdown', (e)=>{
    if (!renderer) return;
    const studioMode = mode === 'studio';
    if (studioMode && !studioCamera.baseCamera) return;
    if (!studioMode && !loadedCharacters.get(activeId)) return;

    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (activePointers.size >= 2){
      // A second finger just landed — this becomes a pinch-zoom gesture instead of a tap/drag.
      // Cancel whatever single-finger interaction the first finger had already started so it
      // doesn't also fire once fingers lift.
      if (gesture){
        // If this was mid-pet (holding past the drag threshold), resolve its hold reaction the
        // same way releasing the pointer would, instead of abandoning it with pet_idle stuck
        // looping forever and activeHolds never cleared (which would also freeze that bone's hit
        // anchor/hint dot for good — see updateHitAnchors).
        if (gesture.petting){
          const gc = getCharById(gesture.charId);
          if (gc) stopHoldReaction(gc, gesture.boneName);
        }
        gesture.resolved = true; gesture = null;
      }
      if (dragging){
        const draggingC = getCharById(dragging.charId);
        const off = draggingC && draggingC.offsets.get(dragging.boneName);
        if (off) off.dragging = false;
        if (draggingC) stopHoldReaction(draggingC, dragging.boneName);
        dragging = null;
      }
      panDrag = null;
      bgDrag = null;
      // Deliberately NOT calling fitStudioCamera() here — same reasoning as endDrag's comment
      // further down: refitting would snap the camera back and cancel out the drag/visually
      // "shrink" the view right when a second finger lands.
      if (slotDrag){ slotDrag = null; }
      const pts = Array.from(activePointers.values()).slice(0,2);
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinch = studioMode ? {studio:true, lastDist: dist || 1} : {charId: loadedCharacters.get(activeId).id, lastDist: dist || 1};
      canvas.setPointerCapture(e.pointerId);
      return;
    }

    const found = studioMode ? findStudioHit(e.clientX, e.clientY) : (()=>{
      const c = loadedCharacters.get(activeId);
      const hit = findHitBone(c, e.clientX, e.clientY);
      return hit ? {c, hit} : null;
    })();

    if (!found){
      // No interactive part under the pointer. Only start a background pan if the press is
      // outside every placed character's bounding box — in the single-character viewer a stray
      // click/drag on the character's body itself (but off any recognized bone) still does
      // nothing, same as before this feature.
      const outside = studioMode
        ? isOutsideAllStudioChars(e.clientX, e.clientY)
        : isOutsideCharacter(loadedCharacters.get(activeId), e.clientX, e.clientY);
      if (outside){
        canvas.setPointerCapture(e.pointerId);
        if (studioMode){
          // In the studio, dragging empty space (the background) moves only the background image
          // layer — a plain CSS-pixel drag, not a stage-camera pan — so the stage/characters stay
          // exactly where they are.
          bgDrag = {pointerId:e.pointerId, startClientX:e.clientX, startClientY:e.clientY, startPanX:studioBgPanX, startPanY:studioBgPanY};
        } else {
          panDrag = {charId: loadedCharacters.get(activeId).id, pointerId:e.pointerId, anchorWorld: screenToWorld(e.clientX, e.clientY)};
        }
        return;
      }

      // and up/down position sliders with direct manipulation.
      if (studioMode){

        const slot = c && studioSlots.find(s=>s.char === c);

            lastClientX: e.clientX, lastClientY: e.clientY,

            // offset stays consistent through the drag even though layoutStudioSlots() recomputes
            // c.bounds every frame as offsetXNorm/offsetYNorm change.
            ew: c.bounds.w, eh: c.bounds.h

          // Pin physics/jiggle bones (back hair, ears, tail, ...) to follow the body rigidly for
          // the whole duration of a manual body drag — see the c.__slotDragActive check in
          // renderLoop for why. The previous "only reset on a big jump" heuristic (jumpThreshold
          // in layoutStudioSlots) still let ordinary, smooth per-frame drag deltas fall through to
          // Physics.update. Spine's physics constraints compute their sway from how fast their
          // bone moved *in world units per second*; a hand-dragged whole-body move covers far more
          // distance per frame than anything the rig's own animations ever do, so even a smooth
          // drag reads as an enormous velocity to the spring and throws the hair out to the side,
          // never catching back up until the drag stops — exactly the "이탈"(detached) hair seen on
          // video. Freezing physics for the drag's full duration (not just the first jump frame)

          c.__slotDragActive = true;

    }

      let off = c.offsets.get(hit.name);

        // Everything below then sets pose.x/y to base + offset every frame instead of adding to
        // whatever pose.x already happens to be — see the big comment in applyProceduralEffects
        // for why "add every frame" was the actual cause of bones flying off uncontrollably.
        const bone = c.skeleton.findBone(hit.name);

      // (see startHoldReaction) while the spring offset below keeps handling the actual

      startHoldReaction(c, hit.name, 'pull');

  canvas.addEventListener('pointermove', (e)=>{

        // the pointer right now, using the same mapping as screenToWorld() run in reverse — this
        // avoids any incremental-delta drift and just works regardless of current zoom level.
        const rect = canvas.getBoundingClientRect();
        const cssX = e.clientX - rect.left, cssY = e.clientY - rect.top;
        const cssW = canvas.clientWidth || 1, cssH = canvas.clientHeight || 1;
        const camera = renderer.camera;
        const worldPerCssX = camera.viewportWidth / cssW;
        const worldPerCssY = camera.viewportHeight / cssH;
        const desiredCamX = panDrag.anchorWorld.x - (cssX - cssW/2) * worldPerCssX;
        const desiredCamY = panDrag.anchorWorld.y + (cssY - cssH/2) * worldPerCssY;
        const c = getCharById(panDrag.charId);
        c.panX = desiredCamX - baseCamera.cx;

      const slot = studioSlots.find(s=>s.id === slotDrag.slotId);

        // Same screen-delta-to-world-delta conversion as the bone drag below, but applied
        // straight to the slot's normalized offset instead of a bone-local offset — the skeleton

        const scaleX = canvas.clientWidth / renderer.camera.viewportWidth;
        const scaleY = canvas.clientHeight / renderer.camera.viewportHeight;

        const dyCss = e.clientY - slotDrag.lastClientY;

        slot.offsetYNorm = (slot.offsetYNorm || 0) + dyWorld/slotDrag.eh;
        layoutStudioSlots();
        // layoutStudioSlots() just teleported this character's skeleton.x/y directly (a whole,
        // instantaneous jump, not an animated move). Spine's physics constraints (jiggle bones —
        // tail, hair, ears, etc.) compute their own motion from how far the bone they're attached
        // to moved *since last frame*; a big instantaneous jump reads to them as an enormous,
        // physically-impossible velocity in a single frame, which is what was blowing a bone's
        // spring permanently out of its stable range (hair/ears rendering torn apart, never
        // resettling even after the drag stopped). layoutStudioSlots() itself now detects this
        // jump and sets c.__justRepositioned so the render loop resets that character's physics
        // instead of feeding it a fake velocity — see the studio branch below — so nothing extra
        // needs to happen here anymore; this call alone is enough.
        // Deliberately NOT calling fitStudioCamera() mid-drag: it reframes to the union of every
        // placed character's bounds, which would recenter the camera on the character being
        // dragged and partly cancel out its on-screen movement. It's called once in endDrag()
        // instead, after the drag settles.

      }

    }

    if (dragging && dragging.pointerId === e.pointerId){
      const c = getCharById(dragging.charId);
      const off = c && c.offsets.get(dragging.boneName);
      if (off){
        const scaleX = canvas.clientWidth / renderer.camera.viewportWidth;
        const scaleY = canvas.clientHeight / renderer.camera.viewportHeight;
        const dxCss = e.clientX - dragging.lastClientX;
        const dyCss = e.clientY - dragging.lastClientY;
        const dxWorld = dxCss/scaleX;
        const dyWorld = -dyCss/scaleY; // screen y-down -> spine world y-up
        // bone.x/bone.y live in the PARENT bone's local (rotated+scaled) frame, not world/screen
        // space. Just dividing out the skeleton's overall scale (as before) ignores every bone's
        // rotation up the chain — on this rig the body is rotated ~90°+ in total, so a left/right
        // drag ended up moving the cheek up/down and vice versa. Inverting the parent's actual
        // world matrix (a,b,c,d) converts the screen-space drag delta into the correct local
        // direction regardless of how the parent chain is rotated or scaled. Read it via
        // boneWorldMatrix(), not parent.a/b/c/d directly — on this Spine 4.3 runtime those live on
        // parent.appliedPose, so reading them off the bone gave NaN, the inversion below was
        // silently skipped every time, and the drag fell back to the raw, un-rotated delta — which
        // is exactly what produced the "left pulls it down, up pulls it left" rotated behavior.
        const bone = c.skeleton.findBone(dragging.boneName);
        const parentMatrix = bone && boneWorldMatrix(bone.parent);
        let localDx = dxWorld, localDy = dyWorld;
        if (parentMatrix){
          const {a, b, c: cc, d} = parentMatrix;
          const det = a*d - b*cc;
          if (Math.abs(det) > 1e-9){
            const invDet = 1/det;
            localDx = (dxWorld*d - dyWorld*b) * invDet;
            localDy = (dyWorld*a - dxWorld*cc) * invDet;
          }
        }
        off.x += localDx;
        off.y += localDy;
        const maxOffset = Math.max(c.bounds.w, c.bounds.h) * 0.18;
        const mag = Math.hypot(off.x, off.y);
        if (mag > maxOffset){ off.x = off.x/mag*maxOffset; off.y = off.y/mag*maxOffset; }
        dragging.lastClientX = e.clientX; dragging.lastClientY = e.clientY;
        // Steady drip of hearts for as long as petting continues — throttled so it reads as a
        // gentle, continuous effect instead of one heart per pointermove frame (which fires far
        // more often than is legible or than the CSS animation duration can keep up with).
        if (dragging.isPet){
          const nowMs = performance.now();
          if (nowMs - lastPetHeartAt > PET_HEART_INTERVAL_MS){
            spawnPetHeart(c, dragging.boneName);
            lastPetHeartAt = nowMs;
          }
        }
      }
    }
    if (gesture && gesture.pointerId === e.pointerId && !gesture.resolved){
      const dist = Math.hypot(e.clientX - gesture.startX, e.clientY - gesture.startY);
      // Studio: never escalate into the pet hold-drag below — only the tap resolved on release
      // (in endDrag) is enabled there. See the comment on findStudioHit for why.
      if (dist > DRAG_THRESHOLD_PX && mode !== 'studio'){
        // Moved past the tap threshold before release — this is a pet/stroke drag rather than a
        // tap, so it no longer falls through to the tap ("hit") reaction on release. Start the
        // dedicated pet hold (loops pet_idle for as long as the pointer stays down); marking
        // gesture.petting lets endDrag know to resolve it with stopHoldReaction instead.
        gesture.resolved = true;
        gesture.petting = true;
        const c = getCharById(gesture.charId);
        if (c) startHoldReaction(c, gesture.boneName, 'pet');
        // Immediate feedback the instant petting starts, rather than waiting for the first
        // throttled spawn in the dragging block below (which could be up to PET_HEART_INTERVAL_MS
        // away) — see spawnPetHeart/lastPetHeartAt for the steady-state spawning while held.
        if (c){ spawnPetHeart(c, gesture.boneName); lastPetHeartAt = performance.now(); }
        // Also start tracking a real positional drag offset for the petted bone (same mechanism
        // as the cheek "pull"), purely so head/face/backhead/hear have something to follow — see
        // applyManualFollow(). The existing rotate/scale "petting" wobble (patEffects) keeps
        // playing independently on top of this.
        if (c && !dragging){
          let off = c.offsets.get(gesture.boneName);
          if (!off){
            const petBone = c.skeleton.findBone(gesture.boneName);
            const basePose = bonePose(petBone);
            off = {x:0, y:0, vx:0, vy:0, dragging:false, baseX: basePose.x, baseY: basePose.y};
            c.offsets.set(gesture.boneName, off);
          }
          off.dragging = true;

          // directly in pointerdown without this flag) so the block above can tell which one it's
          // looking at and only spawn hearts for petting — see spawnPetHeart below.
          dragging = {charId: c.id, boneName: gesture.boneName, pointerId: e.pointerId, lastClientX: e.clientX, lastClientY: e.clientY, isPet: true};

    }
  });

  function endDrag(e){
    if (bgDrag && (!e || bgDrag.pointerId === e.pointerId)){
      bgDrag = null;
    }
    if (panDrag && (!e || panDrag.pointerId === e.pointerId)){
      panDrag = null;
    }
    if (slotDrag && (!e || slotDrag.pointerId === e.pointerId)){
      // Deliberately NOT calling fitStudioCamera() here: that recenters the shared stage camera
      // on the union of every placed character's bounds, which (especially with a single
      // character on stage) visually snaps the view right back to where it started, canceling
      // out the drag the user just did. The character's own position (slot.offsetXNorm/Y) is
      // already persisted by the pointermove handler above; the camera should stay put.
      // Un-pin physics (see c.__slotDragActive in the pointerdown handler / renderLoop): the
      // very last Physics.reset call before this already re-synced the jiggle bones' internal
      // "last known position" to the character's final resting spot, so switching back to
      // Physics.update on the next frame resumes natural sway from a clean, correct baseline
      // instead of snapping.
      const draggedSlot = studioSlots.find(s=>s.id === slotDrag.slotId);
      if (draggedSlot && draggedSlot.char) draggedSlot.char.__slotDragActive = false;
      slotDrag = null;
    }
    if (dragging && (!e || dragging.pointerId === e.pointerId)){
      const c = getCharById(dragging.charId);
      const off = c && c.offsets.get(dragging.boneName);
      if (off) off.dragging = false;
      if (c) stopHoldReaction(c, dragging.boneName);
      dragging = null;
    }
    if (gesture && (!e || gesture.pointerId === e.pointerId)){
      const c = getCharById(gesture.charId);
      if (!gesture.resolved){
        // Released without dragging past the threshold — that's a short tap/click.
        if (c) playReaction(c, gesture.squashName || gesture.boneName, 'hit', gesture.boneName);
      } else if (gesture.petting){
        // Released after a pet drag — stop the pet_idle loop, which plays pet_end (if present)
        // and then returns to the resting animation (see stopHoldReaction).
        if (c) stopHoldReaction(c, gesture.boneName);
      }
      gesture = null;
    }

  // bone is actively being dragged, and only resolve (optional follow-up, then back to whatever
  // was playing before) once the pointer is released — see startHoldReaction/stopHoldReaction
  // below.
  function startHoldReaction(c, boneName, category){
    const reaction = c.reactions[category];

    if (c.activeHolds.has(boneName)) return; // already holding this bone

    // right now — see the comment on restingAnimation for why reading the live track is unsafe.
    const backTo = c.restingAnimation ? c.restingAnimation.name : (c.skeletonData.animations[0] ? c.skeletonData.animations[0].name : null);

    pinReactionPhysics(c);

    // animationStateData.defaultMix for why this needs the full-duration pin, whichever branch

    }
